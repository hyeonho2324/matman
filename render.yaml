# Render.com 배포 설정 — GitHub 저장소를 연결하면 이 파일을 읽어 자동 배포한다.
services:
  - type: web
    name: matman
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
