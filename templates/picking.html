{% extends "base.html" %}
{% block content %}
<div class="page-header">
  <div>
    <div class="page-title"><i class="ti ti-list-check" style="margin-right:6px;color:var(--fill-accent)"></i>피킹리스트</div>
    <div class="page-subtitle">WO별 창고 동선 최적화</div>
  </div>
  <div class="page-actions">
      <a href="/disburse" class="btn"><i class="ti ti-arrow-bar-up"></i>불출 처리</a>
      <a href="/production" class="btn"><i class="ti ti-tool"></i>생산 실적</a>
  </div>
</div>

<!-- 이 화면의 인터랙티브 UI는 iframe으로 통합됩니다 -->
<div style="flex:1;display:flex;flex-direction:column;gap:14px">
  <div class="alert alert-info">
    <i class="ti ti-info-circle"></i>
    <span>이 화면은 <strong>피킹리스트</strong> 기능을 제공합니다. 아래 패널에서 모든 기능을 이용하세요.</span>
  </div>
  <div style="flex:1;border-radius:12px;overflow:hidden;border:0.5px solid var(--border);min-height:580px">
    <iframe
      src="/embed/picking"
      style="width:100%;height:100%;min-height:580px;border:none;display:block"
      title="피킹리스트">
    </iframe>
  </div>
</div>
{% endblock %}
