{% extends "base.html" %}
{% block content %}
<div class="page-header">
  <div>
    <div class="page-title"><i class="ti ti-truck-delivery" style="margin-right:6px;color:var(--fill-accent)"></i>구매 발주</div>
    <div class="page-subtitle">발주 254건 · 발주 수량 대비 입고 대조</div>
  </div>
  <div class="page-actions">
      <a href="/suppliers" class="btn"><i class="ti ti-building-store"></i>협력사</a>
      <a href="/calendar" class="btn"><i class="ti ti-calendar"></i>발주 캘린더</a>
      <a href="/inbound" class="btn"><i class="ti ti-arrow-bar-to-down"></i>입고 처리</a>
  </div>
</div>

<!-- 이 화면의 인터랙티브 UI는 iframe으로 통합됩니다 -->
<div style="flex:1;display:flex;flex-direction:column;gap:14px">
  <div class="embed-box">
    <iframe
      src="/embed/purchase{% if hid %}?id={{ hid|urlencode }}{% endif %}" class="embed-frame"
      title="구매 발주">
    </iframe>
  </div>
</div>
{% endblock %}
