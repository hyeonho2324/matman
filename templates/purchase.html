{% extends "base.html" %}
{% block content %}
<div class="page-header">
  <div>
    <div class="page-title"><i class="ti ti-truck-delivery" style="margin-right:6px;color:var(--fill-accent)"></i>구매 발주</div>
    <div class="page-subtitle">발주 등록 및 이력</div>
  </div>
  <div class="page-actions">
      <a href="/suppliers" class="btn"><i class="ti ti-building-store"></i>협력사</a>
      <a href="/calendar" class="btn"><i class="ti ti-calendar"></i>발주 캘린더</a>
      <a href="/inbound" class="btn"><i class="ti ti-arrow-bar-to-down"></i>입고 처리</a>
  </div>
</div>

<!-- 이 화면의 인터랙티브 UI는 iframe으로 통합됩니다 -->
<div style="flex:1;display:flex;flex-direction:column;gap:14px">
  <div class="alert alert-info">
    <i class="ti ti-info-circle"></i>
    <span>이 화면은 <strong>구매 발주</strong> 기능을 제공합니다. 아래 패널에서 모든 기능을 이용하세요.</span>
  </div>
  <div style="flex:1;border-radius:12px;overflow:hidden;border:0.5px solid var(--border);min-height:580px">
    <iframe
      src="/embed/purchase"
      style="width:100%;height:100%;min-height:580px;border:none;display:block"
      title="구매 발주">
    </iframe>
  </div>
</div>
{% endblock %}
