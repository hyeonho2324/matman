{% extends "base.html" %}
{% block content %}
<div class="page-header">
  <div>
    <div class="page-title"><i class="ti ti-arrow-bar-up" style="margin-right:6px;color:var(--fill-accent)"></i>불출 처리</div>
    <div class="page-subtitle">FIFO 미리보기</div>
  </div>
  <div class="page-actions">
      <a href="/picking" class="btn"><i class="ti ti-list-check"></i>피킹리스트</a>
      <a href="/approval" class="btn"><i class="ti ti-check"></i>승인 현황</a>
      <a href="/lot" class="btn"><i class="ti ti-box"></i>LOT 상세</a>
  </div>
</div>

<!-- 이 화면의 인터랙티브 UI는 iframe으로 통합됩니다 -->
<div style="flex:1;display:flex;flex-direction:column;gap:14px">
  <div class="alert alert-info">
    <i class="ti ti-info-circle"></i>
    <span>이 화면은 <strong>불출 처리</strong> 기능을 제공합니다. 아래 패널에서 모든 기능을 이용하세요.</span>
  </div>
  <div style="flex:1;border-radius:12px;overflow:hidden;border:0.5px solid var(--border);min-height:580px">
    <iframe
      src="/embed/disburse"
      style="width:100%;height:100%;min-height:580px;border:none;display:block"
      title="불출 처리">
    </iframe>
  </div>
</div>
{% endblock %}
