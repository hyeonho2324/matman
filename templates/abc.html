{% extends "base.html" %}
{% block content %}
<div class="page-header">
  <div>
    <div class="page-title"><i class="ti ti-chart-bar" style="margin-right:6px;color:var(--fill-accent)"></i>ABC 분석 대시보드</div>
    <div class="page-subtitle">사용금액 기준 파레토 분석</div>
  </div>
  <div class="page-actions">
      <a href="/safety_stock" class="btn"><i class="ti ti-shield-check"></i>안전재고</a>
      <a href="/forecast" class="btn"><i class="ti ti-chart-line"></i>수요 예측</a>
  </div>
</div>

<!-- 이 화면의 인터랙티브 UI는 iframe으로 통합됩니다 -->
<div style="flex:1;display:flex;flex-direction:column;gap:14px">
  <div class="alert alert-info">
    <i class="ti ti-info-circle"></i>
    <span>이 화면은 <strong>ABC 분석 대시보드</strong> 기능을 제공합니다. 아래 패널에서 모든 기능을 이용하세요.</span>
  </div>
  <div style="flex:1;border-radius:12px;overflow:hidden;border:0.5px solid var(--border);min-height:580px">
    <iframe
      src="/embed/abc"
      style="width:100%;height:100%;min-height:580px;border:none;display:block"
      title="ABC 분석 대시보드">
    </iframe>
  </div>
</div>
{% endblock %}
