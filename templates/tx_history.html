{% extends "base.html" %}
{% block content %}
<div class="page-header">
  <div>
    <div class="page-title"><i class="ti ti-history" style="margin-right:6px;color:var(--fill-accent)"></i>입출고 이력</div>
    <div class="page-subtitle">입출고 1,075건 · LOT 단위 이력 추적</div>
  </div>
  <div class="page-actions">
      <a href="/lot" class="btn"><i class="ti ti-box"></i>LOT 상세</a>
      <a href="/products" class="btn"><i class="ti ti-package"></i>자재 목록</a>
  </div>
</div>

<!-- 이 화면의 인터랙티브 UI는 iframe으로 통합됩니다 -->
<div style="flex:1;display:flex;flex-direction:column;gap:14px">
  <div style="flex:1;border-radius:12px;overflow:hidden;border:0.5px solid var(--border);min-height:580px">
    <iframe
      src="/embed/tx_history"
      style="width:100%;height:100%;min-height:580px;border:none;display:block"
      title="입출고 이력">
    </iframe>
  </div>
</div>
{% endblock %}
