{% extends "base.html" %}
{% block content %}
<div class="page-header">
  <div>
    <div class="page-title"><i class="ti ti-package" style="margin-right:6px;color:var(--fill-accent)"></i>자재 목록</div>
    <div class="page-subtitle">자재 마스터 · 등록 · 수정 · 엑셀 일괄 등록</div>
  </div>
  <div class="page-actions">
      <a href="/lot" class="btn"><i class="ti ti-box"></i>LOT 상세</a>
      <a href="/bom" class="btn"><i class="ti ti-sitemap"></i>BOM 확인</a>
      <a href="/disburse" class="btn"><i class="ti ti-arrow-bar-up"></i>불출 처리</a>
  </div>
</div>

<!-- 이 화면의 인터랙티브 UI는 iframe으로 통합됩니다 -->
<div style="flex:1;display:flex;flex-direction:column;gap:14px">
  <div class="embed-box">
    <iframe
      src="/embed/products{% if pid %}?pid={{ pid|urlencode }}{% endif %}" class="embed-frame"
      title="자재 목록">
    </iframe>
  </div>
</div>
{% endblock %}
