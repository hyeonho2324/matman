{% extends "base.html" %}
{% block content %}
<div class="page-header">
  <div>
    <div class="page-title"><i class="ti ti-clipboard-check" style="margin-right:6px;color:var(--fill-accent)"></i>재고 실사</div>
    <div class="page-subtitle">장부 vs 실물 대조 · 차이 조정 · ABC 등급별 순환 실사</div>
  </div>
  <div class="page-actions">
      <a href="/stock-map" class="btn"><i class="ti ti-building-warehouse"></i>재고 지도</a>
      <a href="/lot" class="btn"><i class="ti ti-box"></i>LOT 상세</a>
      <a href="/tx-history" class="btn"><i class="ti ti-history"></i>입출고 이력</a>
  </div>
</div>

<!-- 이 화면의 인터랙티브 UI는 iframe으로 통합됩니다 -->
<div style="flex:1;display:flex;flex-direction:column;gap:14px">
  <div class="embed-box">
    <iframe
      src="/embed/stock_count" class="embed-frame"
      title="재고 실사">
    </iframe>
  </div>
</div>
{% endblock %}
