<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>발주 시뮬레이터</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.14.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--s0:#F8F7F4;--s1:#EFEEEA;--s2:#E5E4DF;--border:#D4D3CE;--border-s:#B8B7B2;--acc:#2a78d6;--ok:#1D9E75;--wn:#EF9F27;--dn:#E24B4A;--txt:#1A1917;--txt2:#4A4946;--txt3:#898781;--r:6px;--bg-ok:rgba(29,158,117,.1);--bg-wn:rgba(239,159,39,.1);--bg-dn:rgba(224,75,74,.1);--bg-ac:rgba(42,120,214,.09)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;font-size:13px;color:var(--txt);background:var(--s0);height:100vh;display:flex;flex-direction:column;overflow:hidden}
.wrap{flex:1;display:flex;flex-direction:column;overflow:hidden}

.topbar{height:44px;background:var(--s1);border-bottom:0.5px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:8px;flex-shrink:0}
.pt{font-size:14px;font-weight:500;flex:1;display:flex;align-items:center;gap:6px}
.tag{font-size:10px;color:var(--txt3);font-weight:400}
.btn{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:var(--r);font-size:12px;cursor:pointer;border:0.5px solid var(--border-s);background:transparent;color:var(--txt);font-family:inherit;white-space:nowrap}
.btn:hover{background:var(--s2)}

.selbar{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:0.5px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.selbar label{font-size:11px;color:var(--txt3)}
select{padding:5px 9px;border-radius:var(--r);border:0.5px solid var(--border-s);font-size:12px;font-family:inherit;background:var(--s0);color:var(--txt);max-width:330px}
.srch{display:flex;align-items:center;gap:5px;background:var(--s0);border:0.5px solid var(--border-s);border-radius:var(--r);padding:4px 8px}
.srch i{font-size:12px;color:var(--txt3)}
.srch input{border:none;outline:none;background:transparent;font-size:12px;font-family:inherit;width:150px;color:var(--txt)}
.hit{font-size:11px;color:var(--txt3);white-space:nowrap}
.hit.none{color:var(--dn)}
.chip{padding:2px 8px;border-radius:99px;font-size:10px;font-weight:500}
.c-재고소진,.c-발주지연{background:var(--bg-dn);color:#9B1C1C}
.c-발주임박{background:var(--bg-wn);color:#854F0B}
.c-주의{background:var(--bg-ac);color:#185FA5}
.c-여유{background:var(--bg-ok);color:#1D6E52}
.c-예측불가{background:var(--s2);color:var(--txt3)}
.gr{display:inline-block;width:17px;height:17px;line-height:17px;text-align:center;border-radius:4px;font-size:10px;font-weight:600}
.grA{background:var(--bg-dn);color:#9B1C1C}.grB{background:var(--bg-wn);color:#854F0B}.grC{background:var(--bg-ok);color:#1D6E52}
.meta{font-size:10px;color:var(--txt3);margin-left:auto}

.main{flex:1;display:flex;overflow:hidden;min-height:0}
.left{flex:1;display:flex;flex-direction:column;overflow-y:auto;min-width:0;padding:12px 14px}

/* 시뮬 차트 */
.chartbox{background:var(--s0);border:0.5px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:12px}
.cbh{padding:8px 12px;border-bottom:0.5px solid var(--border);background:var(--s1);display:flex;align-items:center;gap:6px}
.cbh-t{font-size:12px;font-weight:500;flex:1}
.cbh-m{font-size:10px;color:var(--txt3)}
svg{display:block;width:100%;height:210px}
.leg{display:flex;gap:14px;font-size:10px;color:var(--txt3);padding:7px 12px;border-top:0.5px solid var(--border);flex-wrap:wrap}
.leg span{display:inline-flex;align-items:center;gap:4px}
.sw{width:10px;height:3px;border-radius:2px;display:inline-block}
.swd{width:10px;height:0;border-top:2px dashed;display:inline-block}

/* 결과 카드 */
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.card{background:var(--s0);border:0.5px solid var(--border);border-radius:8px;padding:10px 12px}
.c-l{font-size:10px;color:var(--txt3);margin-bottom:4px;display:flex;align-items:center;gap:4px}
.c-v{font-size:19px;font-weight:600;line-height:1.1}
.c-v small{font-size:11px;font-weight:400;color:var(--txt3)}
.c-s{font-size:10px;color:var(--txt3);margin-top:3px}
.c-v.ok{color:var(--ok)}.c-v.dn{color:var(--dn)}.c-v.wn{color:var(--wn)}

.verdict{padding:10px 12px;border-radius:8px;font-size:11px;line-height:1.7;margin-bottom:12px;border:0.5px solid}
.v-ok{background:var(--bg-ok);border-color:rgba(29,158,117,.3);color:#1D6E52}
.v-wn{background:var(--bg-wn);border-color:rgba(239,159,39,.3);color:#854F0B}
.v-dn{background:var(--bg-dn);border-color:rgba(224,75,74,.3);color:#9B1C1C}

/* 조절 패널 */
.panel{width:320px;border-left:0.5px solid var(--border);background:var(--s1);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}
.ph{padding:10px 14px;border-bottom:0.5px solid var(--border);font-size:12px;font-weight:500;display:flex;align-items:center;gap:6px}
.pb{padding:12px;display:flex;flex-direction:column;gap:14px}
.ctl{}
.ctl-h{display:flex;align-items:baseline;gap:6px;margin-bottom:6px}
.ctl-l{font-size:11px;font-weight:500;flex:1}
.ctl-v{font-size:14px;font-weight:600;color:var(--acc)}
.ctl-u{font-size:10px;color:var(--txt3)}
input[type=range]{width:100%;accent-color:var(--acc);height:18px}
.ctl-r{display:flex;justify-content:space-between;font-size:9px;color:var(--txt3);margin-top:1px}
.ctl-n{font-size:10px;color:var(--txt3);margin-top:4px;line-height:1.5}
.base{background:var(--s0);border:0.5px solid var(--border);border-radius:8px;overflow:hidden}
.ir{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 10px;border-bottom:0.5px solid var(--border);font-size:11px}
.ir:last-child{border-bottom:none}
.ik{color:var(--txt3);font-size:10px}
.iv{font-weight:500}
.reset{width:100%}

@media(max-width:900px){
  .cards{grid-template-columns:repeat(2,1fr)}
  .main{flex-direction:column}
  .panel{width:100%;border-left:none;border-top:0.5px solid var(--border-s);max-height:52%}
  select{max-width:100%;flex:1}
  .srch{flex:1}
  .srch input{width:100%}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="pt">
      <i class="ti ti-adjustments" style="color:var(--acc)"></i>발주 시뮬레이터
      <span class="tag">실제 DB · {{ items|length }}종 · 기준일 {{ base }}</span>
    </div>
    <button class="btn" onclick="reset()"><i class="ti ti-refresh"></i>권장값으로</button>
  </div>

  <div class="selbar">
    <label>품목</label>
    <div class="srch">
      <i class="ti ti-search"></i>
      <input id="q" type="search" placeholder="품번 · 품명 · 규격 · 협력사"
             oninput="fillSel()" autocomplete="off">
    </div>
    <select id="sel" onchange="pick()"></select>
    <span class="hit" id="hit"></span>
    <span id="chips"></span>
    <span class="meta" id="meta"></span>
  </div>

  <div class="main">
    <div class="left">
      <div id="verdict"></div>
      <div class="cards" id="cards"></div>
      <div class="chartbox">
        <div class="cbh">
          <i class="ti ti-chart-line" style="color:var(--acc)"></i>
          <span class="cbh-t">재고 추이 시뮬레이션</span>
          <span class="cbh-m">180일 예측</span>
        </div>
        <svg id="chart" viewBox="0 0 1000 210" preserveAspectRatio="none"></svg>
        <div class="leg">
          <span><i class="sw" style="background:#E24B4A"></i>발주 안 할 때</span>
          <span><i class="sw" style="background:#2a78d6"></i>발주할 때</span>
          <span><i class="swd" style="border-color:#EF9F27"></i>안전재고</span>
          <span><i class="swd" style="border-color:#1D9E75"></i>입고 시점</span>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="ph"><i class="ti ti-sliders"></i>조건 조절</div>
      <div class="pb">
        <div class="ctl">
          <div class="ctl-h"><span class="ctl-l">발주 수량</span>
            <span class="ctl-v" id="v-qty">0</span><span class="ctl-u">개</span></div>
          <input type="range" id="r-qty" min="0" max="100" value="50" oninput="sim()">
          <div class="ctl-r"><span>0</span><span id="m-qty">-</span></div>
          <div class="ctl-n" id="n-qty"></div>
        </div>

        <div class="ctl">
          <div class="ctl-h"><span class="ctl-l">발주 시점</span>
            <span class="ctl-v" id="v-day">0</span><span class="ctl-u">일 후</span></div>
          <input type="range" id="r-day" min="0" max="90" value="0" oninput="sim()">
          <div class="ctl-r"><span>즉시</span><span>90일 후</span></div>
          <div class="ctl-n">늦게 발주할수록 입고도 밀립니다.</div>
        </div>

        <div class="ctl">
          <div class="ctl-h"><span class="ctl-l">리드타임</span>
            <span class="ctl-v" id="v-lt">0</span><span class="ctl-u">일</span></div>
          <input type="range" id="r-lt" min="1" max="90" value="30" oninput="sim()">
          <div class="ctl-r"><span>1</span><span>90</span></div>
          <div class="ctl-n" id="n-lt"></div>
        </div>

        <div class="ctl">
          <div class="ctl-h"><span class="ctl-l">일평균 사용량</span>
            <span class="ctl-v" id="v-use">0</span><span class="ctl-u">개/일</span></div>
          <input type="range" id="r-use" min="0" max="100" value="50" oninput="sim()">
          <div class="ctl-r"><span>0</span><span id="m-use">-</span></div>
          <div class="ctl-n" id="n-use"></div>
        </div>

        <div class="base" id="base"></div>
        <button class="btn reset" onclick="reset()"><i class="ti ti-rotate"></i>실제값으로 되돌리기</button>
      </div>
    </div>
  </div>
</div>

<script>
const ITEMS = {{ items|tojson }};
const SPAN  = {{ span }};
const DAYS  = 180;

let cur = ITEMS[0];
const nf  = n => (n==null ? '-' : Math.round(Number(n)).toLocaleString());
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const won = n => n>=100000000 ? (n/100000000).toFixed(2)+'억' : (n>=10000 ? nf(n/10000)+'만' : nf(n));

// 품목 셀렉트
// option 의 value 는 배열 인덱스가 아니라 품번이다.
// 검색으로 목록을 거르면 인덱스가 밀려 엉뚱한 품목이 잡히기 때문이다.
function fillSel(){
  const q = (document.getElementById('q').value || '').trim().toLowerCase();
  const list = ITEMS.filter(function(it){
    if(!q) return true;
    const hay = (it.P_ID + ' ' + it.P_N + ' ' + (it.Spec||'') + ' '
               + (it.supplier||'') + ' ' + (it.grade||'') + ' ' + it.urgency).toLowerCase();
    return hay.indexOf(q) >= 0;
  });

  const sel = document.getElementById('sel');
  const hit = document.getElementById('hit');

  if(!list.length){
    // 결과가 없어도 현재 품목은 남겨둔다 — 시뮬레이션이 빈 화면이 되면 안 된다
    hit.textContent = '검색 결과 없음'; hit.className = 'hit none';
    sel.innerHTML = '<option value="' + cur.P_ID + '">' + optLabel(cur) + '</option>';
    sel.value = cur.P_ID;
    return;
  }

  hit.textContent = q ? list.length + '종' : ITEMS.length + '종';
  hit.className = 'hit';
  sel.innerHTML = list.map(function(it){
    return '<option value="' + it.P_ID + '">' + optLabel(it) + '</option>';
  }).join('');

  // 지금 보던 품목이 결과에 있으면 그대로 두고, 없으면 첫 결과로 옮긴다
  if(list.some(function(it){ return it.P_ID === cur.P_ID; })){
    sel.value = cur.P_ID;
  }else{
    sel.value = list[0].P_ID;
    pick();
  }
}
function optLabel(it){
  return it.P_ID + ' · ' + it.P_N + ' (' + it.urgency + ', 재고 ' + nf(it.stock) + ')';
}
fillSel();

function reset(){
  const it = cur;
  // 발주 수량 슬라이더 범위 — 권장 발주량의 3배까지
  const maxQ = Math.max(it.order_qty*3, it.safe_qty*4, (it.MinOrderQty||0)*2, 100);
  const rq=document.getElementById('r-qty');
  rq.max = maxQ; rq.value = it.order_qty || 0;
  document.getElementById('m-qty').textContent = nf(maxQ);

  document.getElementById('r-day').value = 0;

  const rl=document.getElementById('r-lt');
  rl.value = Math.min(Math.max(it.lead_time||1,1),90);

  const maxU = Math.max(Math.ceil((it.daily||0)*3), 10);
  const ru=document.getElementById('r-use');
  // 스텝이 너무 굵으면 실제값(예: 115.38)이 반올림돼 '가정값'으로 잘못 표시된다.
  ru.step = maxU > 500 ? 1 : (maxU > 50 ? 0.1 : 0.01);
  ru.max = maxU;
  ru.value = it.daily || 0;
  document.getElementById('m-use').textContent = nf(maxU);

  sim();
}

function pick(){
  const pid = document.getElementById('sel').value;
  cur = ITEMS.filter(function(it){ return it.P_ID === pid; })[0] || cur;
  document.getElementById('chips').innerHTML =
    (cur.grade ? '<span class="gr gr'+cur.grade+'">'+cur.grade+'</span> ' : '')
    + '<span class="chip c-' + cur.urgency + '">' + cur.urgency + '</span>';
  document.getElementById('meta').textContent =
    cur.supplier + (cur.is_foreign==='Y'?' (해외)':'') + ' · 불출 관측 ' + cur.out_cnt + '회 · 신뢰도 ' + cur.confidence;
  reset();
}

function sim(){
  const it = cur;
  const qty  = +document.getElementById('r-qty').value;
  const day  = +document.getElementById('r-day').value;
  const lt   = +document.getElementById('r-lt').value;
  const use  = +document.getElementById('r-use').value;

  document.getElementById('v-qty').textContent = nf(qty);
  document.getElementById('v-day').textContent = day;
  document.getElementById('v-lt').textContent  = lt;
  document.getElementById('v-use').textContent = use.toFixed(use<10 ? 2 : (use<100 ? 1 : 0));

  // 슬라이더 주석 — 실제값과 비교
  const pkg = it.PkgUnit||1, moq = it.MinOrderQty||0;
  document.getElementById('n-qty').innerHTML =
    '권장 ' + nf(it.order_qty) + '개 · MOQ ' + nf(moq) + ' · 포장 ' + nf(pkg)
    + (qty>0 && qty<moq ? ' <b style="color:var(--dn)">MOQ 미달</b>' : '')
    + (qty>0 && pkg>1 && qty%pkg ? ' <b style="color:var(--wn)">포장단위 안 맞음</b>' : '');
  document.getElementById('n-lt').innerHTML =
    '실제 ' + (it.lead_time||0) + '일' + (lt!==it.lead_time ? ' <b style="color:var(--wn)">가정값</b>' : '');
  document.getElementById('n-use').innerHTML =
    '실적 ' + (it.daily||0) + '개/일 (불출 ' + SPAN + '일 기준)'
    + (Math.abs(use-(it.daily||0)) > (+document.getElementById('r-use').step)/2 + 1e-9
       ? ' <b style="color:var(--wn)">가정값</b>' : '');

  // ── 재고 추이 계산 ──
  const arrive = day + lt;               // 입고일
  const noOrder = [], withOrder = [];
  for(let d=0; d<=DAYS; d++){
    const base = it.stock - use*d;
    noOrder.push(Math.max(base, 0));
    withOrder.push(Math.max(base + (d>=arrive ? qty : 0), 0));
  }
  // 결품 시작일 (0 이하가 되는 첫 날)
  const zeroNo = noOrder.findIndex(function(v,i){ return i>0 && v<=0; });
  const zeroWi = withOrder.findIndex(function(v,i){ return i>0 && v<=0; });
  // 안전재고 미달 기간
  const belowSafe = withOrder.filter(function(v){ return v < it.safe_qty; }).length;
  const cost = qty * (it.P_Price||0);

  drawChart(noOrder, withOrder, it.safe_qty, arrive, qty);
  drawCards(it, qty, cost, zeroNo, zeroWi, belowSafe, arrive, use, lt);
  drawBase(it);
}

function drawChart(a, b, safe, arrive, qty){
  const W=1000,H=210,pad={l:46,r:12,t:12,b:20};
  const iw=W-pad.l-pad.r, ih=H-pad.t-pad.b;
  const mx = Math.max(Math.max.apply(null,a), Math.max.apply(null,b), safe*1.3, 1);
  const X = d => pad.l + d/DAYS*iw;
  const Y = v => pad.t + (1 - v/mx)*ih;
  const path = arr => arr.map(function(v,i){ return (i?'L':'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1); }).join(' ');

  let g='';
  // y 격자
  for(let i=0;i<=4;i++){
    const v=mx*i/4;
    g += '<line x1="'+pad.l+'" y1="'+Y(v)+'" x2="'+(W-pad.r)+'" y2="'+Y(v)+'" stroke="#D4D3CE" stroke-width=".5"/>'
       + '<text x="'+(pad.l-5)+'" y="'+(Y(v)+3)+'" font-size="9" fill="#898781" text-anchor="end">'+nf(v)+'</text>';
  }
  // x 눈금
  [0,30,60,90,120,150,180].forEach(function(d){
    g += '<text x="'+X(d)+'" y="'+(H-5)+'" font-size="9" fill="#898781" text-anchor="middle">'+d+'일</text>';
  });
  // 안전재고 선
  if(safe>0){
    g += '<line x1="'+pad.l+'" y1="'+Y(safe)+'" x2="'+(W-pad.r)+'" y2="'+Y(safe)
       + '" stroke="#EF9F27" stroke-width="1.4" stroke-dasharray="5 3"/>'
       + '<text x="'+(W-pad.r-4)+'" y="'+(Y(safe)-4)+'" font-size="9" fill="#854F0B" text-anchor="end">안전재고 '+nf(safe)+'</text>';
  }
  // 입고 시점
  if(qty>0 && arrive<=DAYS){
    g += '<line x1="'+X(arrive)+'" y1="'+pad.t+'" x2="'+X(arrive)+'" y2="'+(pad.t+ih)
       + '" stroke="#1D9E75" stroke-width="1.4" stroke-dasharray="4 3"/>'
       + '<text x="'+(X(arrive)+4)+'" y="'+(pad.t+11)+'" font-size="9" fill="#1D6E52">입고 '+arrive+'일</text>';
  }
  g += '<path d="'+path(a)+'" fill="none" stroke="#E24B4A" stroke-width="1.6" opacity=".55"/>'
     + '<path d="'+path(b)+'" fill="none" stroke="#2a78d6" stroke-width="2"/>';
  document.getElementById('chart').innerHTML = g;
}

function drawCards(it, qty, cost, zeroNo, zeroWi, belowSafe, arrive, use, lt){
  const gain = (zeroWi<0 ? DAYS : zeroWi) - (zeroNo<0 ? DAYS : zeroNo);
  document.getElementById('cards').innerHTML =
    '<div class="card"><div class="c-l"><i class="ti ti-alert-triangle"></i>결품 시점</div>'
  +   '<div class="c-v ' + (zeroWi<0?'ok':'dn') + '">' + (zeroWi<0 ? '없음' : zeroWi+'일') + '<small>' + (zeroWi<0?'':' 후') + '</small></div>'
  +   '<div class="c-s">발주 안 하면 ' + (zeroNo<0 ? '180일 내 없음' : zeroNo+'일 후') + '</div></div>'
  + '<div class="card"><div class="c-l"><i class="ti ti-shield"></i>안전재고 미달</div>'
  +   '<div class="c-v ' + (belowSafe===0?'ok':(belowSafe>90?'dn':'wn')) + '">' + belowSafe + '<small>일</small></div>'
  +   '<div class="c-s">180일 중 미달 기간</div></div>'
  + '<div class="card"><div class="c-l"><i class="ti ti-truck-delivery"></i>입고 시점</div>'
  +   '<div class="c-v">' + (qty>0 ? arrive+'<small>일 후</small>' : '<small style="font-size:15px">발주 없음</small>') + '</div>'
  +   '<div class="c-s">' + (qty>0 ? nf(qty)+'개 입고' : '슬라이더로 수량 조절') + '</div></div>'
  + '<div class="card"><div class="c-l"><i class="ti ti-coin"></i>발주 비용</div>'
  +   '<div class="c-v">' + won(cost) + '<small>원</small></div>'
  +   '<div class="c-s">단가 ' + nf(it.P_Price) + '원</div></div>';

  let cls, msg;
  if(qty<=0){
    cls='v-dn';
    msg='<b>발주하지 않은 상태입니다.</b> 현재 재고 ' + nf(it.stock) + '개로 '
      + (zeroNo<0 ? '180일 내에는 버팁니다.' : '<b>' + zeroNo + '일 후 결품</b>됩니다.');
  } else if(zeroWi >= 0){
    cls='v-dn';
    msg='발주해도 <b>' + zeroWi + '일 후 결품</b>됩니다. '
      + (arrive > (zeroNo<0?DAYS:zeroNo)
         ? '입고(' + arrive + '일)가 결품 시점(' + zeroNo + '일)보다 늦기 때문입니다. 더 일찍 발주하거나 수량을 늘려야 합니다.'
         : '발주 수량이 부족합니다. 수량을 늘려보세요.');
  } else if(belowSafe > 0){
    cls='v-wn';
    msg='결품은 면하지만 <b>' + belowSafe + '일간 안전재고 아래</b>로 내려갑니다. '
      + '수량을 늘리거나 더 일찍 발주하면 개선됩니다.';
  } else {
    cls='v-ok';
    msg='<b>180일간 안전재고를 유지합니다.</b> 결품 위험 없음. 발주 비용 ' + nf(cost) + '원.';
  }
  document.getElementById('verdict').innerHTML =
    '<div class="verdict ' + cls + '"><i class="ti ti-info-circle"></i> ' + msg + '</div>';
}

function drawBase(it){
  document.getElementById('base').innerHTML =
    '<div class="ir"><span class="ik">현재고</span><span class="iv">' + nf(it.stock) + '개</span></div>'
  + '<div class="ir"><span class="ik">안전재고</span><span class="iv">' + nf(it.safe_qty) + '개 (' + (it.grade||'-') + '등급)</span></div>'
  + '<div class="ir"><span class="ik">실제 리드타임</span><span class="iv">' + (it.lead_time||0) + '일</span></div>'
  + '<div class="ir"><span class="ik">실적 일평균</span><span class="iv">' + (it.daily||0) + '개/일</span></div>'
  + '<div class="ir"><span class="ik">MOQ · 포장단위</span><span class="iv">' + nf(it.MinOrderQty) + ' · ' + nf(it.PkgUnit) + '</span></div>'
  + '<div class="ir"><span class="ik">단가</span><span class="iv">' + nf(it.P_Price) + '원</span></div>';
}

pick();
</script>
</body>
</html>
