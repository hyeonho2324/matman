<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>생산 실적</title>
<link rel="stylesheet" href="/static/vendor/tabler-icons.css">
<script src="/static/js/period.js"></script>
<script src="/static/js/timechart.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--s0:#F8F7F4;--s1:#EFEEEA;--s2:#E5E4DF;--border:#D4D3CE;--border-s:#B8B7B2;--acc:#2a78d6;--ok:#1D9E75;--wn:#EF9F27;--dn:#E24B4A;--txt:#1A1917;--txt2:#4A4946;--txt3:#898781;--r:6px;--bg-ok:rgba(29,158,117,.1);--bg-wn:rgba(239,159,39,.1);--bg-dn:rgba(224,75,74,.1);--bg-ac:rgba(42,120,214,.09)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;font-size:13px;color:var(--txt);background:var(--s0);height:100vh;display:flex;flex-direction:column;overflow:hidden}
.wrap{flex:1;display:flex;flex-direction:column;overflow:hidden}

.topbar{height:44px;background:var(--s1);border-bottom:0.5px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:8px;flex-shrink:0}
.pt{font-size:14px;font-weight:500;flex:1;display:flex;align-items:center;gap:6px}
.tag{font-size:10px;color:var(--txt3);font-weight:400}
.btn{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:var(--r);font-size:12px;cursor:pointer;border:0.5px solid var(--border-s);background:transparent;color:var(--txt);font-family:inherit;white-space:nowrap}
.btn:hover{background:var(--s2)}

.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:0.5px solid var(--border);flex-shrink:0}
.kpi{padding:9px 14px;border-right:0.5px solid var(--border)}
.kpi:last-child{border-right:none}
.kl{font-size:10px;color:var(--txt3);margin-bottom:3px;display:flex;align-items:center;gap:4px}
.kv{font-size:18px;font-weight:500;line-height:1.1}
.ks{font-size:10px;color:var(--txt3);margin-top:3px}
.kv.ok{color:var(--ok)}.kv.wn{color:var(--wn)}
.ku{font-size:11px;color:var(--txt3);margin-left:1px}

.chartbox{padding:9px 14px 4px;border-bottom:0.5px solid var(--border);flex-shrink:0}
.charthead{display:flex;align-items:center;gap:10px;margin-bottom:5px}
.charthead .t{font-size:11px;font-weight:500}
.leg{display:flex;gap:10px;margin-left:auto;font-size:10px;color:var(--txt3)}
.leg span{display:inline-flex;align-items:center;gap:4px}
.sw{width:9px;height:9px;border-radius:2px;display:inline-block}
svg{display:block;width:100%;height:88px}

.filter-bar{display:flex;align-items:center;gap:6px;padding:6px 14px;background:var(--s1);border-bottom:0.5px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.pill{padding:3px 10px;border-radius:99px;border:0.5px solid var(--border);font-size:11px;cursor:pointer;color:var(--txt2);background:transparent;font-family:inherit}
.pill:hover{background:var(--s2)}
.pill.on{background:var(--bg-ac);border-color:rgba(42,120,214,.3);color:var(--acc);font-weight:500}
select{padding:3px 8px;border-radius:var(--r);border:0.5px solid var(--border);font-size:11px;font-family:inherit;background:var(--s0);color:var(--txt)}
.search{margin-left:auto;display:flex;align-items:center;gap:5px;background:var(--s0);border:0.5px solid var(--border);border-radius:var(--r);padding:3px 8px}
.search input{border:none;outline:none;background:transparent;font-size:11px;font-family:inherit;width:150px;color:var(--txt)}
.cnt{font-size:11px;color:var(--txt3)}

.main{flex:1;display:flex;overflow:hidden;min-height:0}
.listwrap{flex:1;overflow:auto;min-width:0}
/* 좁아지면 열을 숨기는 대신 가로로 넘겨 본다 — 숨기면 그 값에 닿을 길이 없다.
   감싸는 컨테이너에 overflow:auto 가 이미 있어 표에 min-width 만 주면 된다. */
.listwrap table:not([class]){min-width:820px}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{position:sticky;top:0;background:var(--s1);border-bottom:0.5px solid var(--border-s);padding:7px 10px;text-align:left;font-weight:500;font-size:11px;color:var(--txt2);white-space:nowrap;cursor:pointer;user-select:none;z-index:2}
thead th:hover{background:var(--s2)}
thead th.num{text-align:right}
tbody td{padding:7px 10px;border-bottom:0.5px solid var(--border);white-space:nowrap}
tbody td.num{text-align:right}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--s1)}
tbody tr.on{background:var(--bg-ac)}
.wo{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--acc);font-weight:500}
.fg{font-size:12px}
.fgid{font-size:10px;color:var(--txt3);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.bg{display:inline-flex;align-items:center;gap:3px;padding:1px 6px;border-radius:99px;font-size:9px;font-weight:500}
.bac{background:var(--bg-ac);color:#185FA5}.bmu{background:var(--s2);color:var(--txt3);border:0.5px solid var(--border)}
.bdn{background:var(--bg-dn);color:#9B1C1C}.bwn{background:var(--bg-wn);color:#854F0B}.bok{background:var(--bg-ok);color:#1D6E52}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px}
.empty{padding:40px 20px;text-align:center;color:var(--txt3);font-size:12px}

.detail{width:344px;border-left:0.5px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;background:var(--s1)}
.dh{padding:10px 14px;border-bottom:0.5px solid var(--border);flex-shrink:0}
.dh-t{font-size:12px;font-weight:500;margin-bottom:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dh-s{font-size:10px;color:var(--txt3);line-height:1.5}
.dbody{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:9px}
.pn{background:var(--s0);border:0.5px solid var(--border);border-radius:8px;overflow:hidden}
.pnh{padding:6px 10px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;gap:5px;background:var(--s2)}
.pnh-t{font-size:11px;font-weight:500;flex:1}
.ir{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 10px;border-bottom:0.5px solid var(--border);font-size:11px}
.ir:last-child{border-bottom:none}
.ik{color:var(--txt3);font-size:10px;flex-shrink:0}
.iv{font-weight:500;text-align:right;word-break:break-all}
.note{padding:7px 10px;font-size:10px;color:var(--txt3);line-height:1.6}

/* BOM 대비 비교표 */
.cmp{width:100%;border-collapse:collapse;font-size:10px}
.cmp th{background:var(--s1);padding:4px 7px;text-align:left;font-weight:500;color:var(--txt3);border-bottom:0.5px solid var(--border);white-space:nowrap}
.cmp td{padding:4px 7px;border-bottom:0.5px solid var(--border);white-space:nowrap}
.cmp tr:last-child td{border-bottom:none}
.cmp .num{text-align:right}
.cmp tr.v-대체{background:var(--bg-ac)}
.cmp tr.v-차이{background:rgba(224,75,74,.05)}
.vd{display:inline-block;padding:0 5px;border-radius:99px;font-size:9px;font-weight:500}
.vd-일치{background:var(--bg-ok);color:#1D6E52}
.vd-대체{background:var(--bg-ac);color:#185FA5}
.vd-차이{background:var(--bg-dn);color:#9B1C1C}
.vd-미등록{background:var(--s2);color:var(--txt3)}

@media(max-width:820px){
  .kpi-row{grid-template-columns:repeat(3,1fr)}
  .kpi:nth-child(n+4){border-top:0.5px solid var(--border)}
  .main{flex-direction:column}
  .detail{width:100%;max-height:48%;border-left:none;border-top:0.5px solid var(--border-s)}
  .search{margin-left:0;width:100%}
  .search input{width:100%}
  svg{height:72px}
}
/* ── 생산 실적 등록 ───────────────────────────────────────── */
.pvl{position:fixed;inset:0;background:rgba(26,25,23,.42);display:none;align-items:center;justify-content:center;padding:20px;z-index:60}
.pvl.on{display:flex}
.pbox{background:var(--s0);border-radius:12px;width:100%;max-width:880px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.22)}
.ph{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:0.5px solid var(--border);background:var(--s1);flex-shrink:0}
.ph-t{font-size:14px;font-weight:600;flex:1}
.px{border:none;background:none;cursor:pointer;color:var(--txt3);font-size:16px;padding:2px 6px}
.px:hover{color:var(--txt)}
.pb{flex:1;overflow:auto;min-height:0;padding:14px 16px}
.pf{display:flex;align-items:center;gap:8px;padding:11px 16px;border-top:0.5px solid var(--border);background:var(--s1);flex-shrink:0}
.pf .m{flex:1;font-size:11px;color:var(--txt3);line-height:1.5}
.btnp{background:var(--acc);color:#fff;border-color:transparent}
.btnp:hover:not(:disabled){background:#2268bd}
.btnp:disabled{opacity:.45;cursor:not-allowed}
.frow{display:flex;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:wrap}
.frow label{font-size:11px;color:var(--txt3);width:74px;flex-shrink:0}
.pbox select,.pbox input,.pbox textarea{font-family:inherit;font-size:12px;color:var(--txt);background:var(--s0);border:0.5px solid var(--border-s);border-radius:var(--r);padding:5px 8px}
.pbox select:focus,.pbox input:focus,.pbox textarea:focus{outline:none;border-color:var(--acc)}
.pbox select{flex:1;min-width:0}
.pbox input[type=number]{width:110px;text-align:right;font-variant-numeric:tabular-nums}
.pbox input[type=text]{flex:1;min-width:140px}
.cap{font-size:11px;color:var(--txt3)}
.cap b{color:var(--acc);font-size:13px}
.pmsg{border-radius:8px;padding:9px 11px;font-size:11px;line-height:1.7;margin-top:10px;display:none}
.pmsg.on{display:block}
.pmsg.err{background:var(--bg-dn);color:#9B1C1C}
.pmsg.ok{background:var(--bg-ok);color:#1D6E52}
.pmsg ul{margin:3px 0 0 16px}
.psum{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:10px 0}
.pc{background:var(--s0);border:0.5px solid var(--border);border-radius:8px;padding:9px 11px}
.pc-l{font-size:10px;color:var(--txt3);margin-bottom:2px}
.pc-v{font-size:17px;font-weight:600}
.pc-s{font-size:10px;color:var(--txt3);margin-top:2px}
.ptb{border:0.5px solid var(--border);border-radius:8px;overflow:auto;max-height:44vh}
.ptb table{min-width:640px}
.lid2{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;color:var(--txt2)}
.pnote{font-size:10px;color:var(--txt3);line-height:1.7;margin-top:9px}
@media(max-width:700px){ .psum{grid-template-columns:repeat(2,1fr)} }
.tc-unit{display:inline-flex;gap:0;border:0.5px solid var(--border);border-radius:5px;overflow:hidden}
.tc-u{border:none;background:var(--s0);color:var(--txt3);font-family:inherit;font-size:10px;padding:2px 7px;cursor:pointer;line-height:1.5}
.tc-u+.tc-u{border-left:0.5px solid var(--border)}
.tc-u:hover{background:var(--s2);color:var(--txt)}
.tc-u.on{background:var(--acc);color:#fff}
</style>
<link rel="stylesheet" href="/static/css/embed-mobile.css">
<script defer src="/static/js/embed-mobile.js"></script>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="pt">
      <i class="ti ti-tool" style="color:var(--acc)"></i>생산 실적 · BOM 검증
      <span class="tag">실제 DB · 작업지시 {{ summary.wo_cnt }}건 · {{ summary.date_from }} ~ {{ summary.date_to }}</span>
    </div>
    <button class="btn" onclick="dl()"><i class="ti ti-download"></i>CSV</button>
    <button class="btn btnp" onclick="pOpen()"><i class="ti ti-plus"></i>생산 실적 등록</button>
  </div>

  <div class="kpi-row" id="kpis"></div>

  <div class="chartbox">
    <div class="charthead">
      <span class="t" id="ctitle">월별 생산 추이</span>
      <span class="leg">
        <span><i class="sw" style="background:#2a78d6"></i>작업지시 건수</span>
        <span><i class="sw" style="background:#1D9E75"></i>투입 자재비</span>
      </span>
      <span id="cunit" style="margin-left:auto"></span>
    </div>
    <svg id="chart" viewBox="0 0 1000 88" preserveAspectRatio="none"></svg>
  </div>

  <div class="filter-bar">
    <button class="pill on" data-f="all"  onclick="setF('all')">전체</button>
    <button class="pill"    data-f="alt"  onclick="setF('alt')">대체품 사용</button>
    <button class="pill"    data-f="diff" onclick="setF('diff')">BOM 불일치</button>
    <select id="fg" onchange="render()"><option value="">전체 완제품</option></select>
    <select id="ym" onchange="render()"></select>
    <span class="cnt" id="cnt"></span>
    <div class="search">
      <i class="ti ti-search" style="font-size:12px;color:var(--txt3)"></i>
      <input id="q" placeholder="작업지시 · 완제품 · 담당자" oninput="render()">
    </div>
  </div>

  <div class="main">
    <div class="listwrap">
      <table>
        <thead><tr>
          <th onclick="sortBy('date')">생산일</th>
          <th onclick="sortBy('wo')">작업지시</th>
          <th onclick="sortBy('FG_N')">완제품</th>
          <th class="num" onclick="sortBy('units')">생산</th>
          <th class="num" onclick="sortBy('line_cnt')">자재</th>
          <th class="num hide-sm" onclick="sortBy('amount')">자재비</th>
          <th>BOM 검증</th>
          <th class="hide-sm" onclick="sortBy('worker')">담당</th>
        </tr></thead>
        <tbody id="tb"></tbody>
      </table>
    </div>

    <div class="detail">
      <div class="dh">
        <div class="dh-t" id="dt">작업지시를 선택하세요</div>
        <div class="dh-s" id="ds">행을 클릭하면 투입 자재를 BOM 표준과 대조한 결과가 표시됩니다.</div>
      </div>
      <div class="dbody" id="db"></div>
    </div>
  </div>
</div>

<!-- 생산 실적 등록 -->
<div class="pvl" id="pvl">
  <div class="pbox">
    <div class="ph"><i class="ti ti-tool" style="color:var(--acc)"></i>
      <span class="ph-t">생산 실적 등록</span>
      <button class="px" onclick="pClose()"><i class="ti ti-x"></i></button></div>
    <div class="pb" id="pbody"></div>
    <div class="pf">
      <span class="m" id="pfm"></span>
      <button class="btn" onclick="pClose()">닫기</button>
      <button class="btn btnp" id="pgo" onclick="pSubmit()">
        <i class="ti ti-check"></i>등록</button>
    </div>
  </div>
</div>

<script>
const ORD   = {{ orders|tojson }};
const PRODS = {{ prods|tojson }};   // P_ID → {P_N, Spec}
const EMPTY = {};
function P(pid){ return PRODS[pid] || EMPTY; }
const MON = {{ monthly|tojson }};
const SUM = {{ summary|tojson }};
// 기준일 = 데이터의 마지막 생산일 ('오늘'이 아니다 — 더미데이터 시간축과 어긋난다)
const PBASE = ORD.map(function(o){return o.date||'';}).filter(Boolean).sort().slice(-1)[0] || '';

let filter='all', sortKey='date', sortAsc=false, sel=null;

// ── 생산 실적 등록 ───────────────────────────────────────────
// 투입은 '현장에 나가 있는 LOT' 에서만 뽑는다. 창고에서 바로 빼면 불출 기록 없이
// 재고가 줄어 흐름이 깨진다. 서버가 같은 규칙으로 다시 계산한다.
const SRC = {{ src|tojson }};
let pPlan = null, pBusy = false;
const nf  = n => (n==null ? '-' : Math.round(Number(n)).toLocaleString());
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const won = n => n>=100000000 ? (n/100000000).toFixed(2)+'억' : (n>=10000 ? nf(n/10000)+'만' : nf(n));

// 필터 옵션
(function(){
  const fgs={};
  ORD.forEach(function(o){ fgs[o.FG_ID]=o.FG_N; });
  const fs=document.getElementById('fg');
  Object.keys(fgs).sort().forEach(function(k){
    fs.innerHTML+='<option value="'+k+'">'+k+' '+fgs[k]+'</option>';
  });
  const ys=document.getElementById('ym');
  Period.fill(ys, MON);   // 전체 / 최근 1년·6개월·3개월·1개월 / 특정 월
})();

// 월별 차트 — 작업지시 건수(막대) + 자재비(선)
// 집계 단위(월/분기/연)는 데이터 길이가 정한다 — static/js/timechart.js
let chartUnit = 'auto';
function setChartUnit(u){ chartUnit = u; drawChart(); }

function drawChart(){
  const W=1000,H=88,pad={t:12,b:15};
  const info=TimeChart.prep(MON,{width:W,unit:chartUnit});
  const R=info.rows, n=info.n;
  const gw=W/n, bw=Math.min(gw*0.42,44);
  const mxC=Math.max.apply(null,R.map(function(m){return m.wo_cnt;}))||1;
  const mxA=Math.max.apply(null,R.map(function(m){return m.amount;}))||1;
  const ph=H-pad.t-pad.b;
  let bars='', line='', dots='';
  R.forEach(function(m,i){
    const cx=gw*i+gw/2;
    const bh=m.wo_cnt/mxC*ph;
    bars+='<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+(pad.t+ph-bh).toFixed(1)+'" width="'+bw.toFixed(1)
        + '" height="'+Math.max(bh,0.5).toFixed(1)+'" fill="#2a78d6" opacity=".8" rx="1">'
        + '<title>'+m.full+' 작업지시 '+m.wo_cnt+'건 · 자재비 '+won(m.amount)+'원</title></rect>';
    const py=(pad.t+ph-(m.amount/mxA*ph)).toFixed(1);
    line+=(i?' L':'M')+cx.toFixed(1)+' '+py;
    dots+='<circle cx="'+cx.toFixed(1)+'" cy="'+py+'" r="2.2" fill="#1D9E75"/>';
    // 라벨은 들어갈 자리가 있을 때만 — 안 그러면 겹쳐서 뭉갠다
    if(i%info.step===0)
      bars+='<text x="'+cx.toFixed(1)+'" y="'+(H-3)+'" font-size="9" fill="#898781" text-anchor="middle">'+m.label+'</text>';
  });
  const marks=TimeChart.yearMarks(info,W,pad.t,pad.t+ph);
  document.getElementById('chart').innerHTML =
      marks + bars
    + '<path d="'+line+'" fill="none" stroke="#1D9E75" stroke-width="1.5"/>'
    + dots
    + '<line x1="0" y1="'+(pad.t+ph)+'" x2="'+W+'" y2="'+(pad.t+ph)+'" stroke="#D4D3CE" stroke-width="1"/>';
  document.getElementById('ctitle').textContent=info.unitLabel+' 생산 추이';
  document.getElementById('cunit').innerHTML=TimeChart.picker(info,chartUnit,'setChartUnit');
}

function view(){
  const q=(document.getElementById('q').value||'').trim().toLowerCase();
  const fg=document.getElementById('fg').value;
  const ym=document.getElementById('ym').value;
  let r=ORD.filter(function(o){
    if(filter==='alt'  && !o.alt_used) return false;
    if(filter==='diff' && !o.diff)     return false;
    if(fg && o.FG_ID!==fg)             return false;
    if(ym && !Period.has(o.date, ym, PBASE)) return false;
    if(q){
      const hay=(o.wo+' '+o.FG_ID+' '+(o.FG_N||'')+' '+(o.worker||'')).toLowerCase();
      if(hay.indexOf(q)<0) return false;
    }
    return true;
  });
  r.sort(function(a,b){
    let x=a[sortKey], y=b[sortKey];
    if(typeof x==='string'||typeof y==='string'){
      x=(x||'')+''; y=(y||'')+'';
      return sortAsc ? x.localeCompare(y) : y.localeCompare(x);
    }
    x=x||0; y=y||0;
    return sortAsc ? (x-y) : (y-x);
  });
  return r;
}

function render(){
  // KPI 는 '어느 범위를 보는가'(기간·완제품)만 따른다.
  // 대체품·차이 pill 이나 검색어까지 반영하면 BOM 일치율의 분모가 한쪽으로 쏠린다
  // (차이 건만 골라 보면 일치율이 0% 가 된다).
  const pv=document.getElementById('ym').value, fg0=document.getElementById('fg').value;
  drawKpi(ORD.filter(function(o){
    if(pv && !Period.has(o.date, pv, PBASE)) return false;
    if(fg0 && o.FG_ID!==fg0)                 return false;
    return true;
  }), pv, fg0);

  const r=view();
  document.getElementById('cnt').textContent=r.length+'건';
  const tb=document.getElementById('tb');
  if(!r.length){
    tb.innerHTML='<tr><td colspan="8"><div class="empty">조건에 맞는 작업지시가 없습니다.</div></td></tr>';
    return;
  }
  tb.innerHTML=r.slice(0,300).map(function(o){
    let vd;
    if(o.diff)          vd='<span class="bg bdn">불일치 '+o.diff+'</span>';
    else if(o.alt_used) vd='<span class="bg bac">대체 '+o.alt_used+'</span>';
    else                vd='<span class="bg bok">전량 일치</span>';
    return '<tr onclick="pick(\'' + o.wo + '\')" class="' + (sel===o.wo?'on':'') + '">'
      + '<td class="mono">' + o.date + '</td>'
      + '<td><span class="wo">' + esc(o.wo) + '</span></td>'
      + '<td><div class="fg">' + esc(o.FG_N) + '</div><div class="fgid">' + o.FG_ID + '</div></td>'
      + '<td class="num">' + nf(o.units) + '대</td>'
      + '<td class="num">' + o.line_cnt + '종</td>'
      + '<td class="num hide-sm">' + won(o.amount) + '원</td>'
      + '<td>' + vd + '</td>'
      + '<td class="hide-sm">' + esc(o.worker||'-') + '</td>'
      + '</tr>';
  }).join('') + (r.length>300
    ? '<tr><td colspan="8"><div class="empty">상위 300건만 표시 중 (전체 '+r.length+'건)</div></td></tr>'
    : '');
}

function pick(wo){
  sel=wo;
  const o=ORD.filter(function(v){return v.wo===wo;})[0];
  render();

  document.getElementById('dt').innerHTML =
    '<span class="wo">' + esc(o.wo) + '</span> ' + esc(o.FG_N)
    + (o.diff ? ' <span class="bg bdn">불일치 '+o.diff+'</span>' : '')
    + (o.alt_used ? ' <span class="bg bac">대체 '+o.alt_used+'</span>' : '');
  document.getElementById('ds').innerHTML =
    o.date + ' · ' + o.FG_ID + ' · 담당 ' + esc(o.worker||'-')
    + '<br>추정 생산 ' + nf(o.units) + '대 · 투입 자재 ' + o.line_cnt + '종 · 자재비 ' + nf(o.amount) + '원';

  const rows = o.items.map(function(i){
    return '<tr class="v-' + i.verdict + '">'
      + '<td>' + i.P_ID + (i.lot_n>1 ? ' <span class="bg bmu">'+i.lot_n+'LOT</span>' : '') + '</td>'
      + '<td>' + esc((P(i.P_ID).P_N||'').slice(0,11)) + '</td>'
      + '<td class="num">' + nf(i.qty) + '</td>'
      + '<td class="num">' + i.per + '</td>'
      + '<td class="num">' + (i.bom_qty==null ? '-' : i.bom_qty) + '</td>'
      + '<td><span class="vd vd-' + i.verdict + '">' + i.verdict + '</span>'
      +   (i.alt_for ? '<div style="font-size:9px;color:var(--txt3)">→'+i.alt_for+'</div>' : '') + '</td>'
      + '</tr>';
  }).join('');

  document.getElementById('db').innerHTML =
    '<div class="pn">'
  +   '<div class="pnh"><i class="ti ti-git-compare"></i><span class="pnh-t">BOM 표준 대비 실제 투입</span>'
  +     '<span class="bg ' + (o.diff?'bdn':'bok') + '">' + o.match + '/' + o.line_cnt + ' 일치</span></div>'
  +   '<table class="cmp"><thead><tr>'
  +     '<th>자재</th><th>품명</th><th class="num">투입</th><th class="num">/대</th><th class="num">BOM</th><th>판정</th>'
  +   '</tr></thead><tbody>' + rows + '</tbody></table>'
  +   '<div class="note">'
  +     '<b>/대</b> = 실제 투입량 ÷ 추정 생산대수. 이 값이 BOM 소요량과 같으면 <b>일치</b>.<br>'
  +     '<b>대체</b>는 BOM에 대체품으로 등록된 자재가 투입된 경우이고, <b>차이</b>는 표준과 다르게 투입된 경우입니다.'
  +   '</div>'
  + '</div>'

  + '<div class="pn">'
  +   '<div class="pnh"><i class="ti ti-calculator"></i><span class="pnh-t">생산 대수 추정</span></div>'
  +   '<div class="ir"><span class="ik">추정 생산량</span><span class="iv">' + nf(o.units) + '대</span></div>'
  +   '<div class="ir"><span class="ik">투입 자재</span><span class="iv">' + o.line_cnt + '종 (원본 ' + o.raw_cnt + '행)</span></div>'
  +   '<div class="ir"><span class="ik">대당 자재비</span><span class="iv">' + nf(o.amount/(o.units||1)) + '원</span></div>'
  +   '<div class="note">완제품 생산 수량이 원본 데이터에 없어, 표준 BOM 자재들의 (실투입 ÷ 소요량) <b>중앙값</b>으로 추정합니다. 일부 자재가 대체품으로 빠져도 중앙값이라 흔들리지 않습니다.</div>'
  + '</div>'

  + '<div class="pn">'
  +   '<div class="pnh"><i class="ti ti-info-circle"></i><span class="pnh-t">검증 요약</span></div>'
  +   '<div class="ir"><span class="ik">BOM 일치</span><span class="iv">' + o.match + '종</span></div>'
  +   '<div class="ir"><span class="ik">대체품 투입</span><span class="iv">' + o.alt_used + '종</span></div>'
  +   '<div class="ir"><span class="ik">표준과 차이</span><span class="iv ' + (o.diff?'':'') + '">' + o.diff + '종</span></div>'
  +   '<div class="ir"><span class="ik">BOM 미등록</span><span class="iv">' + o.extra + '종</span></div>'
  + '</div>';
}

function setF(f){
  filter=f;
  const ps=document.querySelectorAll('.pill');
  for(let i=0;i<ps.length;i++) ps[i].classList.toggle('on', ps[i].dataset.f===f);
  render();
}
function sortBy(k){
  if(sortKey===k){ sortAsc=!sortAsc; } else { sortKey=k; sortAsc=false; }
  render();
}
function pOpen(){
  document.getElementById('pvl').classList.add('on');
  pPlan = null;
  pDraw();
}
function pClose(){ document.getElementById('pvl').classList.remove('on'); }

function pVal(id){ const e = document.getElementById(id); return e ? e.value : ''; }

function pDraw(){
  const fgs = SRC.fgs;
  document.getElementById('pbody').innerHTML =
    '<div class="frow"><label>완제품</label>'
  +   '<select id="p-fg" onchange="pPlanNow()">'
  +     fgs.map(function(f){
        return '<option value="' + esc(f.FG_ID) + '"' + (f.capacity ? '' : ' disabled') + '>'
          + esc(f.FG_ID) + ' ' + esc(f.FG_N||'') + ' — 현장 보유로 '
          + (f.capacity ? nf(f.capacity) + '대 가능' : '생산 불가 (자재 ' + f.short_cnt + '종 없음)')
          + '</option>'; }).join('')
  +   '</select></div>'
  + '<div class="frow"><label>생산 대수</label>'
  +   '<input type="number" id="p-qty" min="1" step="1" value="10" oninput="pPlanNow()">'
  +   '<span class="cap" id="p-cap"></span></div>'
  + '<div class="frow"><label>작업지시</label>'
  +   '<select id="p-wo">'
  +     '<option value="">자동 채번 (WO + 날짜 + 순번)</option>'
  +     SRC.work_orders.map(function(w){
        return '<option value="' + esc(w.Work_Order) + '">' + esc(w.Work_Order) + ' · '
          + esc(w.FG_N||w.FG_ID||'') + ' ' + nf(w.Plan_Qty) + '대'
          + (w.prod_rows ? ' (실적 ' + w.prod_rows + '행 있음)' : '') + '</option>'; }).join('')
  +   '</select></div>'
  + '<div class="frow"><label>담당자</label>'
  +   '<select id="p-ep">' + SRC.workers.map(function(w){
        return '<option value="' + esc(w.EP_ID) + '">' + esc(w.Name) + ' '
          + esc(w.Position||'') + '</option>'; }).join('') + '</select></div>'
  + '<div class="frow"><label>메모</label>'
  +   '<input type="text" id="p-note" placeholder="예) 2라인 주간조"></div>'
  + '<div id="p-plan"></div>'
  + '<div class="pmsg" id="p-msg"></div>';
  pPlanNow();
}

async function pPlanNow(){
  const fg = pVal('p-fg'), qty = parseInt(pVal('p-qty'), 10);
  const cap = (SRC.fgs.filter(function(f){ return f.FG_ID === fg; })[0] || {}).capacity || 0;
  const capEl = document.getElementById('p-cap');
  if(capEl) capEl.innerHTML = '대 · 현장 보유로 최대 <b>' + nf(cap) + '</b>대';
  const box = document.getElementById('p-plan');
  if(!box) return;
  if(!fg || !qty || qty <= 0){ box.innerHTML = ''; pPlan = null; pFoot(); return; }

  const r = await fetch('/api/production/plan', {method:'POST',
    headers:{'Content-Type':'application/json'}, body: JSON.stringify({FG_ID:fg, qty:qty})});
  const d = await r.json();
  if(!d.ok){ box.innerHTML = ''; pPlan = null; pSay('err', pErr(d.errors)); pFoot(); return; }
  pPlan = d.plan;
  pSay('', '');

  box.innerHTML =
    '<div class="psum">'
  +   '<div class="pc"><div class="pc-l">투입 자재</div><div class="pc-v">' + pPlan.line_cnt
  +     '<small style="font-size:11px;color:var(--txt3)">종</small></div>'
  +     '<div class="pc-s">BOM 표준</div></div>'
  +   '<div class="pc"><div class="pc-l">투입 수량</div><div class="pc-v">' + nf(pPlan.total_qty)
  +     '<small style="font-size:11px;color:var(--txt3)">개</small></div>'
  +     '<div class="pc-s">현장에서 빠진다</div></div>'
  +   '<div class="pc"><div class="pc-l">기록 행</div><div class="pc-v">'
  +     pPlan.items.reduce(function(a,i){ return a + i.lot_cnt; }, 0)
  +     '<small style="font-size:11px;color:var(--txt3)">행</small></div>'
  +     '<div class="pc-s">자재 x LOT</div></div>'
  +   '<div class="pc"><div class="pc-l">현장 부족</div>'
  +     '<div class="pc-v" style="color:' + (pPlan.short_cnt ? 'var(--dn)' : 'var(--ok)') + '">'
  +     pPlan.short_cnt + '<small style="font-size:11px;color:var(--txt3)">종</small></div>'
  +     '<div class="pc-s">' + (pPlan.short_cnt ? '불출이 먼저입니다' : '전량 확보') + '</div></div>'
  + '</div>'
  + '<div class="ptb"><table><thead><tr>'
  +   '<th>품번</th><th>품명</th><th class="num">1대당</th><th class="num">소요</th>'
  +   '<th>투입 LOT</th><th class="num">투입</th><th class="num">현장 보유</th>'
  + '</tr></thead><tbody>'
  + pPlan.items.map(function(i){
      if(!i.alloc.length)
        return '<tr><td><span class="pid">' + esc(i.P_ID) + '</span></td>'
          + '<td>' + esc(i.P_N||'-') + '</td>'
          + '<td class="num">' + nf(i.bom_qty) + '</td>'
          + '<td class="num">' + nf(i.need) + '</td>'
          + '<td colspan="3" style="color:var(--dn)">현장에 없습니다 — 불출이 먼저입니다</td></tr>';
      return i.alloc.map(function(a, k){
        return '<tr>'
          + (k ? '<td></td><td></td><td></td><td></td>'
               : '<td><span class="pid">' + esc(i.P_ID) + '</span></td>'
                 + '<td>' + esc(i.P_N||'-') + '</td>'
                 + '<td class="num">' + nf(i.bom_qty) + '</td>'
                 + '<td class="num">' + nf(i.need)
                 + (i.lot_cnt > 1 ? '<div style="font-size:9px;color:var(--txt3)">LOT '
                     + i.lot_cnt + '개</div>' : '') + '</td>')
          + '<td><span class="lid2">' + esc(a.Lot_ID) + '</span>'
          +   '<div style="font-size:9px;color:var(--txt3)">' + esc(a.Lot_Date) + ' 입고'
          +   (a.last_out ? ' · ' + esc(a.last_out) + ' 불출' : '') + '</div></td>'
          + '<td class="num"><b>' + nf(a.take) + '</b></td>'
          + '<td class="num" style="color:var(--txt3)">' + nf(a.site) + '</td>'
          + '</tr>';
      }).join('');
    }).join('')
  + '</tbody></table></div>'
  + '<div class="pnote">투입은 <b>현장에 나가 있는 LOT</b> 에서만 뽑습니다 — 창고 재고에서 바로 빼면 '
  +   '불출 기록 없이 재고가 줄어 흐름이 깨집니다. 같은 자재가 여러 LOT 에 걸치면 <b>FIFO</b> 로 나뉩니다.<br>'
  +   '생산일은 <b>' + esc(SRC.entry) + '</b> 로 기록됩니다. LOT 입고일·불출일보다 앞선 날짜는 서버가 막습니다.</div>';
  pFoot();
}

function pFoot(){
  const ok = pPlan && !pPlan.short_cnt;
  document.getElementById('pgo').disabled = !ok || pBusy;
  document.getElementById('pfm').innerHTML = pPlan
    ? (pPlan.short_cnt
        ? '<b style="color:var(--dn)">현장에 없는 자재가 ' + pPlan.short_cnt + '종</b> 있어 등록할 수 없습니다.'
        : esc(pPlan.FG_N||'') + ' ' + nf(pPlan.qty) + '대 · 투입 ' + nf(pPlan.total_qty) + '개')
    : '완제품과 생산 대수를 정하세요.';
}

function pErr(errs){ return '<b>등록할 수 없습니다</b><ul>'
  + errs.map(function(e){ return '<li>' + esc(e) + '</li>'; }).join('') + '</ul>'; }
function pSay(cls, html){
  const m = document.getElementById('p-msg');
  if(!m) return;
  if(!html){ m.className = 'pmsg'; m.innerHTML = ''; return; }
  m.className = 'pmsg on ' + cls; m.innerHTML = html;
}

async function pSubmit(){
  if(pBusy || !pPlan) return;
  pBusy = true; pFoot();
  const body = {FG_ID: pVal('p-fg'), qty: parseInt(pVal('p-qty'), 10),
                EP_ID: pVal('p-ep'), Work_Order: pVal('p-wo'),
                note: pVal('p-note'), date: SRC.entry};
  try{
    const r = await fetch('/api/production', {method:'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    const d = await r.json();
    if(!d.ok){ pBusy = false; pFoot(); pSay('err', pErr(d.errors)); return; }
    const p = d.plan;
    pSay('ok', '<b><i class="ti ti-check"></i> 등록 완료</b> — 작업지시 ' + esc(p.Work_Order)
      + ' · ' + esc(p.FG_N||'') + ' ' + nf(p.qty) + '대 · 투입 ' + nf(p.total_qty) + '개 · '
      + p.row_cnt + '행<br>현장 보유가 그만큼 줄었습니다. 잠시 후 목록을 새로 고칩니다.');
    setTimeout(function(){ location.reload(); }, 1600);
  }catch(e){
    pBusy = false; pFoot();
    pSay('err', '서버에 연결하지 못했습니다: ' + esc(e.message || e));
  }
}

document.addEventListener('keydown', function(e){ if(e.key === 'Escape') pClose(); });

function dl(){
  const r=view();
  const head=['생산일','작업지시','완제품코드','완제품명','추정생산대수','투입자재종수','자재비','BOM일치','대체품','불일치','담당자'];
  const lines=[head.join(',')];
  r.forEach(function(o){
    lines.push([o.date,o.wo,o.FG_ID,o.FG_N,o.units,o.line_cnt,o.amount,o.match,o.alt_used,o.diff,o.worker]
      .map(function(v){ return '"' + (v==null?'':String(v).replace(/"/g,'""')) + '"'; }).join(','));
  });
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['﻿'+lines.join('\n')],{type:'text/csv;charset=utf-8'}));
  a.download='생산실적_BOM검증.csv';
  a.click();
}

drawChart();
render();


// ── 기간 KPI ──────────────────────────────────────────────
// 전체 누적만 보면 데이터가 쌓일수록 최근 생산 품질이 묻힌다.
// 이번 분기 BOM 일치율이 떨어져도 누적값은 잘 안 움직이기 때문이다.
function drawKpi(list, pv, fg){
  let units=0, amount=0, lineCnt=0, match=0, diff=0, altUsed=0, altWo=0;
  const fgs={};
  list.forEach(function(o){
    units   += o.units  || 0;
    amount  += o.amount || 0;
    lineCnt += o.line_cnt || 0;
    match   += o.match  || 0;
    diff    += o.diff   || 0;
    altUsed += o.alt_used || 0;
    if(o.alt_used) altWo++;
    if(o.FG_ID) fgs[o.FG_ID]=1;
  });
  // BOM 일치율 분모 = 판정이 끝난 투입 자재(일치 + 대체 + 차이)
  const judged = match + altUsed + diff;
  const tag=document.getElementById('ptag');
  if(tag) tag.textContent = '실제 DB · ' + Period.label(pv, PBASE)
                          + (fg ? ' · ' + fg : '') + ' · ' + list.length + '건';

  document.getElementById('kpis').innerHTML =
      '<div class="kpi"><div class="kl"><i class="ti ti-clipboard-list"></i>작업지시</div>'
    +   '<div class="kv">' + nf(list.length) + '<span class="ku">건</span></div>'
    +   '<div class="ks">완제품 ' + Object.keys(fgs).length + '종</div></div>'

    + '<div class="kpi"><div class="kl"><i class="ti ti-box-multiple"></i>생산 수량</div>'
    +   '<div class="kv">' + nf(units) + '<span class="ku">대</span></div>'
    +   '<div class="ks">투입 기준 추정</div></div>'

    + '<div class="kpi"><div class="kl"><i class="ti ti-coin"></i>투입 자재비</div>'
    +   '<div class="kv">' + (amount/100000000).toFixed(1) + '<span class="ku">억원</span></div>'
    +   '<div class="ks">' + nf(lineCnt) + '개 자재 투입</div></div>'

    + '<div class="kpi"><div class="kl"><i class="ti ti-circle-check"></i>BOM 일치율</div>'
    +   '<div class="kv ok">' + (judged ? Period.pct(match, judged) : '-') + '<span class="ku">%</span></div>'
    +   '<div class="ks">불일치 ' + nf(diff) + '건 · 대체 ' + nf(altUsed) + '건</div></div>'

    + '<div class="kpi"><div class="kl"><i class="ti ti-replace"></i>대체품 사용</div>'
    +   '<div class="kv wn">' + (list.length ? Period.pct(altWo, list.length) : '-') + '<span class="ku">%</span></div>'
    +   '<div class="ks">' + nf(altWo) + '개 WO · ' + nf(altUsed) + '건</div></div>';
}
