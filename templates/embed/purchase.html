<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>구매 발주</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.14.0/dist/tabler-icons.min.css">
<script src="/static/js/period.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--s0:#F8F7F4;--s1:#EFEEEA;--s2:#E5E4DF;--border:#D4D3CE;--border-s:#B8B7B2;--acc:#2a78d6;--ok:#1D9E75;--wn:#EF9F27;--dn:#E24B4A;--txt:#1A1917;--txt2:#4A4946;--txt3:#898781;--r:6px;--bg-ok:rgba(29,158,117,.1);--bg-wn:rgba(239,159,39,.1);--bg-dn:rgba(224,75,74,.1);--bg-ac:rgba(42,120,214,.09)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;font-size:13px;color:var(--txt);background:var(--s0);height:100vh;display:flex;flex-direction:column;overflow:hidden}
.wrap{flex:1;display:flex;flex-direction:column;overflow:hidden}

.topbar{height:44px;background:var(--s1);border-bottom:0.5px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:8px;flex-shrink:0}
.pt{font-size:14px;font-weight:500;flex:1;display:flex;align-items:center;gap:6px}
.tag{font-size:10px;color:var(--txt3);font-weight:400}
.btn{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:var(--r);font-size:12px;cursor:pointer;border:0.5px solid var(--border-s);background:transparent;color:var(--txt);font-family:inherit;white-space:nowrap}
.btn:hover{background:var(--s2)}
.btnp{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:500}
.btnp:hover{background:#2168bd}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:disabled:hover{background:transparent}
.btnp:disabled:hover{background:var(--acc)}

/* ── 발주 워크플로우 ── */
.po-ovl{position:fixed;inset:0;background:rgba(26,25,23,.42);z-index:60;display:none;align-items:center;justify-content:center;padding:18px}
.po-ovl.on{display:flex}
.po-modal{background:var(--s0);border-radius:10px;width:min(980px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.26)}
.po-head{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:0.5px solid var(--border);background:var(--s1);flex-shrink:0}
.po-title{font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px;white-space:nowrap}
.po-steps{display:flex;gap:5px;margin-left:auto;flex-wrap:wrap}
.po-st{font-size:10px;padding:3px 9px;border-radius:99px;background:var(--s2);color:var(--txt3);white-space:nowrap}
.po-st.on{background:var(--acc);color:#fff;font-weight:500}
.po-st.done{background:var(--bg-ok);color:var(--ok)}
.po-x{background:none;border:none;cursor:pointer;color:var(--txt3);font-size:17px;line-height:1;padding:2px}
.po-x:hover{color:var(--txt)}
.po-body{flex:1;overflow:auto;padding:12px 14px;min-height:220px}
.po-foot{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:0.5px solid var(--border);background:var(--s1);flex-shrink:0}
.po-sum{flex:1;font-size:11px;color:var(--txt2);line-height:1.5}
.po-sum b{color:var(--txt);font-weight:600}

.po-bar{display:flex;align-items:center;gap:6px;margin-bottom:9px;flex-wrap:wrap}
.po-bar input[type=search]{padding:4px 9px;border-radius:var(--r);border:0.5px solid var(--border);font-size:11px;font-family:inherit;background:var(--s0);color:var(--txt);width:190px}
.po-bar input[type=date]{padding:4px 8px;border-radius:var(--r);border:0.5px solid var(--border);font-size:11px;font-family:inherit;background:var(--s0);color:var(--txt)}
.po-lbl{font-size:11px;color:var(--txt3)}

.po-tb{width:100%;border-collapse:collapse;font-size:11px}
.po-tb th{text-align:left;padding:5px 7px;background:var(--s1);border-bottom:0.5px solid var(--border);font-weight:500;color:var(--txt2);position:sticky;top:0;white-space:nowrap}
.po-tb td{padding:5px 7px;border-bottom:0.5px solid var(--border)}
.po-tb tr.pick{background:var(--bg-ac)}
.po-tb .num{text-align:right;font-variant-numeric:tabular-nums}
.po-tb tbody tr:hover{background:var(--s1)}
.po-tb tbody tr.pick:hover{background:var(--bg-ac)}
.po-nm{font-size:11px}
.po-sp{font-size:10px;color:var(--txt3)}
.po-q{width:86px;padding:3px 6px;border-radius:var(--r);border:0.5px solid var(--border-s);font-size:11px;font-family:inherit;text-align:right;background:var(--s0);color:var(--txt)}
.po-q:focus{outline:none;border-color:var(--acc)}
.po-q.warn{border-color:var(--wn);background:var(--bg-wn)}

.u{font-size:10px;padding:1px 6px;border-radius:99px;white-space:nowrap}
.u-0{background:var(--bg-dn);color:#9B1C1C;font-weight:500}
.u-1{background:var(--bg-wn);color:#854F0B}
.u-2{background:var(--bg-ac);color:#185FA5}
.u-3{background:var(--s2);color:var(--txt3)}

.po-card{border:0.5px solid var(--border);border-radius:8px;margin-bottom:9px;overflow:hidden;background:var(--s0)}
.po-ch{display:flex;align-items:center;gap:8px;padding:8px 11px;background:var(--s1);border-bottom:0.5px solid var(--border);flex-wrap:wrap}
.po-cn{font-size:12px;font-weight:500}
.po-cm{font-size:10px;color:var(--txt3)}
.po-camt{margin-left:auto;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.po-note{font-size:10px;color:var(--txt3);padding:6px 11px;background:var(--s1);border-top:0.5px solid var(--border);line-height:1.55}
.po-warn{font-size:10px;color:#854F0B;background:var(--bg-wn);border-radius:var(--r);padding:6px 9px;margin-bottom:8px;line-height:1.55}
.po-err{font-size:11px;color:#9B1C1C;background:var(--bg-dn);border-radius:var(--r);padding:7px 10px;margin-bottom:8px;line-height:1.55}
.po-info{font-size:10px;color:var(--txt3);line-height:1.6;margin-bottom:9px;padding:7px 10px;background:var(--s1);border-radius:var(--r)}
.po-empty{text-align:center;padding:34px 12px;color:var(--txt3);font-size:11px;line-height:1.7}
.po-ok{text-align:center;padding:20px 12px}
.po-ok i{font-size:36px;color:var(--ok)}
.po-ok .t{font-size:15px;font-weight:500;margin:8px 0 3px}
.po-ok .s{font-size:11px;color:var(--txt3);margin-bottom:12px}
.po-hid{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--acc)}
.po-dup{font-size:10px;color:#854F0B}
@media(max-width:700px){
  .po-steps{width:100%;margin-left:0;order:3}
  .po-tb .hide-s{display:none}
  /* 품명 열을 줄여 '권장 발주'까지 화면에 들어오게 한다 (품명은 줄바꿈) */
  .po-tb th,.po-tb td{padding:5px 4px}
  .po-tb td:nth-child(2){max-width:132px}
  .po-nm{word-break:break-all}
  .po-bar input[type=search]{width:100%}
}

.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:0.5px solid var(--border);flex-shrink:0}
.kpi{padding:9px 14px;border-right:0.5px solid var(--border)}
.kpi:last-child{border-right:none}
.kl{font-size:10px;color:var(--txt3);margin-bottom:3px;display:flex;align-items:center;gap:4px}
.kv{font-size:18px;font-weight:500;line-height:1.1}
.ks{font-size:10px;color:var(--txt3);margin-top:3px}
.kv.ok{color:var(--ok)}.kv.wn{color:var(--wn)}.kv.ac{color:var(--acc)}
.ku{font-size:11px;color:var(--txt3);margin-left:1px}

.chartbox{padding:9px 14px 4px;border-bottom:0.5px solid var(--border);flex-shrink:0}
.charthead{display:flex;align-items:center;gap:10px;margin-bottom:5px}
.charthead .t{font-size:11px;font-weight:500}
.leg{display:flex;gap:10px;margin-left:auto;font-size:10px;color:var(--txt3)}
.leg span{display:inline-flex;align-items:center;gap:4px}
.sw{width:9px;height:9px;border-radius:2px;display:inline-block}
svg{display:block;width:100%;height:88px}

.filter-bar{display:flex;align-items:center;gap:6px;padding:6px 14px;background:var(--s1);border-bottom:0.5px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.pill{padding:3px 10px;border-radius:99px;border:0.5px solid var(--border);font-size:11px;cursor:pointer;color:var(--txt2);background:transparent;font-family:inherit}
.pill:hover{background:var(--s2)}
.pill.on{background:var(--bg-ac);border-color:rgba(42,120,214,.3);color:var(--acc);font-weight:500}
select{padding:3px 8px;border-radius:var(--r);border:0.5px solid var(--border);font-size:11px;font-family:inherit;background:var(--s0);color:var(--txt);max-width:150px}
.search{margin-left:auto;display:flex;align-items:center;gap:5px;background:var(--s0);border:0.5px solid var(--border);border-radius:var(--r);padding:3px 8px}
.search input{border:none;outline:none;background:transparent;font-size:11px;font-family:inherit;width:150px;color:var(--txt)}
.cnt{font-size:11px;color:var(--txt3)}

.main{flex:1;display:flex;overflow:hidden;min-height:0}
.listwrap{flex:1;overflow:auto;min-width:0}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{position:sticky;top:0;background:var(--s1);border-bottom:0.5px solid var(--border-s);padding:7px 10px;text-align:left;font-weight:500;font-size:11px;color:var(--txt2);white-space:nowrap;cursor:pointer;user-select:none;z-index:2}
thead th:hover{background:var(--s2)}
thead th.num{text-align:right}
tbody td{padding:7px 10px;border-bottom:0.5px solid var(--border);white-space:nowrap}
tbody td.num{text-align:right}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--s1)}
tbody tr.on{background:var(--bg-ac)}
.hid{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--acc);font-weight:500}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px}
.bg{display:inline-flex;align-items:center;gap:3px;padding:1px 6px;border-radius:99px;font-size:9px;font-weight:500}
.bac{background:var(--bg-ac);color:#185FA5}.bmu{background:var(--s2);color:var(--txt3);border:0.5px solid var(--border)}
.bdn{background:var(--bg-dn);color:#9B1C1C}.bwn{background:var(--bg-wn);color:#854F0B}.bok{background:var(--bg-ok);color:#1D6E52}
.gr{display:inline-block;width:16px;height:16px;line-height:16px;text-align:center;border-radius:4px;font-size:9px;font-weight:600}
.grA{background:var(--bg-dn);color:#9B1C1C}.grB{background:var(--bg-wn);color:#854F0B}.grC{background:var(--bg-ok);color:#1D6E52}
.empty{padding:40px 20px;text-align:center;color:var(--txt3);font-size:12px}

.detail{width:346px;border-left:0.5px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;background:var(--s1)}
.dh{padding:10px 14px;border-bottom:0.5px solid var(--border);flex-shrink:0}
.dh-t{font-size:12px;font-weight:500;margin-bottom:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dh-s{font-size:10px;color:var(--txt3);line-height:1.5}
.dbody{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:9px}
.pn{background:var(--s0);border:0.5px solid var(--border);border-radius:8px;overflow:hidden}
.pnh{padding:6px 10px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;gap:5px;background:var(--s2)}
.pnh-t{font-size:11px;font-weight:500;flex:1}
.ir{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 10px;border-bottom:0.5px solid var(--border);font-size:11px}
.ir:last-child{border-bottom:none}
.ik{color:var(--txt3);font-size:10px;flex-shrink:0}
.iv{font-weight:500;text-align:right;word-break:break-all}
.note{padding:7px 10px;font-size:10px;color:var(--txt3);line-height:1.6}

/* 발주 vs 입고 대조표 */
.cmp{width:100%;border-collapse:collapse;font-size:10px}
.cmp th{background:var(--s1);padding:4px 7px;text-align:left;font-weight:500;color:var(--txt3);border-bottom:0.5px solid var(--border);white-space:nowrap}
.cmp td{padding:4px 7px;border-bottom:0.5px solid var(--border);white-space:nowrap}
.cmp tr:last-child td{border-bottom:none}
.cmp .num{text-align:right}
.cmp tr.st-부족{background:rgba(224,75,74,.06)}
.cmp tr.st-미입고{background:var(--s1)}
.st{display:inline-block;padding:0 5px;border-radius:99px;font-size:9px;font-weight:500}
.st-v-일치{background:var(--bg-ok);color:#1D6E52}
.st-v-부족{background:var(--bg-dn);color:#9B1C1C}
.st-v-초과{background:var(--bg-wn);color:#854F0B}
.st-v-미입고{background:var(--s2);color:var(--txt3)}

/* 진행 흐름 */
.flow{display:flex;align-items:center;gap:0;padding:9px 10px;background:var(--s1);border-bottom:0.5px solid var(--border)}
.fstep{flex:1;text-align:center}
.fdot{width:20px;height:20px;border-radius:50%;margin:0 auto 4px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;background:var(--acc)}
.fdot.done{background:var(--ok)}
.flbl{font-size:9px;color:var(--txt3);line-height:1.4}
.flbl b{display:block;color:var(--txt);font-size:10px}
.fline{height:1.5px;background:var(--border);flex:0 0 16px;margin-bottom:20px}

@media(max-width:820px){
  .kpi-row{grid-template-columns:repeat(3,1fr)}
  .kpi:nth-child(n+4){border-top:0.5px solid var(--border)}
  .main{flex-direction:column}
  .detail{width:100%;max-height:48%;border-left:none;border-top:0.5px solid var(--border-s)}
  .search{margin-left:0;width:100%}
  .search input{width:100%}
  .hide-sm{display:none}
  svg{height:72px}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="pt">
      <i class="ti ti-truck-delivery" style="color:var(--acc)"></i>구매 발주 · 입고 대조
      <span class="tag" id="ptag">실제 DB</span>
    </div>
    <button class="btn btnp" onclick="poOpen()"><i class="ti ti-file-plus"></i>발주하기</button>
    <button class="btn" onclick="dl()"><i class="ti ti-download"></i>CSV</button>
  </div>

  <div class="kpi-row" id="kpis"></div>

  <div class="chartbox">
    <div class="charthead">
      <span class="t">월별 발주 추이</span>
      <span class="leg">
        <span><i class="sw" style="background:#2a78d6"></i>발주 건수</span>
        <span><i class="sw" style="background:#1D9E75"></i>발주 금액</span>
      </span>
    </div>
    <svg id="chart" viewBox="0 0 1000 88" preserveAspectRatio="none"></svg>
  </div>

  <div class="filter-bar">
    <button class="pill on" data-f="all"     onclick="setF('all')">전체</button>
    <button class="pill"    data-f="short"   onclick="setF('short')">부족 입고</button>
    <button class="pill"    data-f="foreign" onclick="setF('foreign')">해외</button>
    <select id="sup" onchange="render()"><option value="">전체 협력사</option></select>
    <select id="ym" onchange="render()"></select>
    <span class="cnt" id="cnt"></span>
    <div class="search">
      <i class="ti ti-search" style="font-size:12px;color:var(--txt3)"></i>
      <input id="q" placeholder="발주번호 · 협력사" oninput="render()">
    </div>
  </div>

  <div class="main">
    <div class="listwrap">
      <table>
        <thead><tr>
          <th onclick="sortBy('date')">발주일</th>
          <th onclick="sortBy('H_ID')">발주번호</th>
          <th onclick="sortBy('supplier')">협력사</th>
          <th class="num" onclick="sortBy('line_cnt')">품목</th>
          <th class="num" onclick="sortBy('amount')">발주금액</th>
          <th>입고</th>
          <th class="num hide-sm" onclick="sortBy('lead_days')">리드타임</th>
          <th class="hide-sm">입고일</th>
        </tr></thead>
        <tbody id="tb"></tbody>
      </table>
    </div>

    <div class="detail">
      <div class="dh">
        <div class="dh-t" id="dt">발주를 선택하세요</div>
        <div class="dh-s" id="ds">행을 클릭하면 발주 수량과 실제 입고 수량을 대조한 결과가 표시됩니다.</div>
      </div>
      <div class="dbody" id="db"></div>
    </div>
  </div>
</div>

<!-- ── 발주 워크플로우 ── -->
<div class="po-ovl" id="poOvl">
  <div class="po-modal">
    <div class="po-head">
      <div class="po-title"><i class="ti ti-file-plus" style="color:var(--acc)"></i>발주하기</div>
      <div class="po-steps" id="poSteps"></div>
      <button class="po-x" onclick="poClose()"><i class="ti ti-x"></i></button>
    </div>
    <div class="po-body" id="poBody"></div>
    <div class="po-foot">
      <div class="po-sum" id="poSum"></div>
      <button class="btn" id="poPrev" onclick="poGo(-1)">이전</button>
      <button class="btn btnp" id="poNext" onclick="poGo(1)">다음</button>
    </div>
  </div>
</div>

<script>
const ORD   = {{ orders|tojson }};
const MON   = {{ monthly|tojson }};
const PRODS = {{ prods|tojson }};
const EMPTY = {};
// 기준일 = 데이터의 마지막 발주일
const PBASE = ORD.map(function(o){return o.date||'';}).filter(Boolean).sort().slice(-1)[0] || '';
const CANDS = {{ cands|tojson }};      // 발주 후보 200종 (권장 발주량 포함)
const BASE  = {{ base_date|tojson }};  // 데이터 기준일
function P(pid){ return PRODS[pid] || EMPTY; }

let filter='all', sortKey='date', sortAsc=false, sel=null;
const nf  = n => (n==null ? '-' : Math.round(Number(n)).toLocaleString());
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const won = n => n>=100000000 ? (n/100000000).toFixed(2)+'억' : (n>=10000 ? nf(n/10000)+'만' : nf(n));

// 필터 옵션
(function(){
  const sup={};
  ORD.forEach(function(o){ if(o.supplier) sup[o.supplier]=1; });
  const ss=document.getElementById('sup');
  Object.keys(sup).sort().forEach(function(k){ ss.innerHTML+='<option value="'+k+'">'+k+'</option>'; });
  // 기간 선택 — 최근 N개월은 '오늘'이 아니라 데이터의 마지막 발주일 기준이다.
  // 더미데이터의 시간축(~2025-12-30)과 실제 오늘이 달라 오늘 기준으로 하면 전부 0건이 된다.
  Period.fill(document.getElementById('ym'), MON);
})();

function drawChart(){
  const W=1000,H=88,pad={t:12,b:15},n=MON.length;
  const gw=W/n, bw=Math.min(gw*0.42,44);
  const mxC=Math.max.apply(null,MON.map(function(m){return m.order_cnt;}))||1;
  const mxA=Math.max.apply(null,MON.map(function(m){return m.amount;}))||1;
  const ph=H-pad.t-pad.b;
  let bars='', line='', dots='';
  MON.forEach(function(m,i){
    const cx=gw*i+gw/2, bh=m.order_cnt/mxC*ph;
    bars+='<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+(pad.t+ph-bh).toFixed(1)+'" width="'+bw.toFixed(1)
        + '" height="'+Math.max(bh,0.5).toFixed(1)+'" fill="#2a78d6" opacity=".8" rx="1">'
        + '<title>'+m.ym+' 발주 '+m.order_cnt+'건 · '+won(m.amount)+'원</title></rect>';
    const py=(pad.t+ph-(m.amount/mxA*ph)).toFixed(1);
    line+=(i?' L':'M')+cx.toFixed(1)+' '+py;
    dots+='<circle cx="'+cx.toFixed(1)+'" cy="'+py+'" r="2.2" fill="#1D9E75"/>';
    bars+='<text x="'+cx.toFixed(1)+'" y="'+(H-3)+'" font-size="9" fill="#898781" text-anchor="middle">'+m.ym.slice(2)+'</text>';
  });
  document.getElementById('chart').innerHTML =
      bars + '<path d="'+line+'" fill="none" stroke="#1D9E75" stroke-width="1.5"/>' + dots
    + '<line x1="0" y1="'+(pad.t+ph)+'" x2="'+W+'" y2="'+(pad.t+ph)+'" stroke="#D4D3CE" stroke-width="1"/>';
}

function view(){
  const q=(document.getElementById('q').value||'').trim().toLowerCase();
  const sup=document.getElementById('sup').value;
  const ym=document.getElementById('ym').value;
  let r=ORD.filter(function(o){
    if(filter==='short'   && !o.short)            return false;
    if(filter==='foreign' && o.is_foreign!=='Y')  return false;
    if(sup && o.supplier!==sup)                   return false;
    if(ym && !inPeriod(o.date, ym))               return false;
    if(q){
      const hay=(o.H_ID+' '+(o.supplier||'')+' '+o.BRN).toLowerCase();
      if(hay.indexOf(q)<0) return false;
    }
    return true;
  });
  r.sort(function(a,b){
    let x=a[sortKey], y=b[sortKey];
    if(typeof x==='string'||typeof y==='string'){
      x=(x||'')+''; y=(y||'')+'';
      return sortAsc ? x.localeCompare(y) : y.localeCompare(x);
    }
    x=x||0; y=y||0;
    return sortAsc ? (x-y) : (y-x);
  });
  return r;
}

function render(){
  const pv  = document.getElementById('ym').value;
  const sup = document.getElementById('sup').value;
  // KPI 는 '어느 범위를 보는가'(기간·협력사)만 따른다.
  // 부족입고·해외 pill 이나 검색어까지 반영하면 분모가 한쪽으로 쏠려
  // 일치율 같은 비율 지표가 왜곡된다(부족만 걸러 보면 일치율 0%).
  drawKpi(ORD.filter(function(o){
    if(pv && !inPeriod(o.date, pv))  return false;
    if(sup && o.supplier!==sup)      return false;
    return true;
  }), pv, sup);

  const r=view();
  document.getElementById('cnt').textContent=r.length+'건';
  const tb=document.getElementById('tb');
  if(!r.length){
    tb.innerHTML='<tr><td colspan="8"><div class="empty">조건에 맞는 발주가 없습니다.</div></td></tr>';
    return;
  }
  tb.innerHTML=r.slice(0,300).map(function(o){
    let st;
    if(o.pending)    st='<span class="bg bmu">미입고 '+o.pending+'</span>';
    else if(o.short) st='<span class="bg bdn">부족 '+o.short+'/'+o.line_cnt+'</span>';
    else             st='<span class="bg bok">전량 입고</span>';
    return '<tr onclick="pick(\'' + o.H_ID + '\')" class="' + (sel===o.H_ID?'on':'') + '">'
      + '<td class="mono">' + o.date + '</td>'
      + '<td><span class="hid">' + o.H_ID + '</span></td>'
      + '<td>' + esc(o.supplier||'-')
      +   (o.is_foreign==='Y' ? ' <span class="bg bac">해외</span>' : '') + '</td>'
      + '<td class="num">' + o.line_cnt + '</td>'
      + '<td class="num">' + won(o.amount) + '원</td>'
      + '<td>' + st + '</td>'
      + '<td class="num hide-sm">' + (o.lead_days!=null ? o.lead_days+'일' : '-') + '</td>'
      + '<td class="hide-sm mono">' + (o.recv_date||'-') + '</td>'
      + '</tr>';
  }).join('') + (r.length>300
    ? '<tr><td colspan="8"><div class="empty">상위 300건만 표시 중 (전체 '+r.length+'건)</div></td></tr>'
    : '');
}

function sortBy(k){

}

// ══════════════════════════════════════════════════════════
//  발주 워크플로우
//  ① 대상 선정  → ② 수량 확정 → ③ 발주서 확인 → 등록
//
//  발주서 1장은 협력사 1곳 앞으로 나간다. 자재마다 공급처가 정해져
//  있으므로, 여러 자재를 한 번에 담으면 3단계에서 공급처 기준으로
//  발주서가 자동 분리된다.
// ══════════════════════════════════════════════════════════
const U_RANK = {'재고소진':0,'발주지연':0,'발주임박':1,'주의':2,'여유':3,'예측불가':3};
const STEPS  = ['대상 선정','수량 확정','발주서 확인'];

let poStep = 1;      // 1~3, 4 = 등록 완료
let poQty  = {};     // P_ID → 수량
let poFilt = 'urgent';
let poQ    = '';
let poDate = '';
let poGrp  = [];     // 3단계 미리보기 결과
let poErr  = [];
let poRes  = null;   // 등록 결과
let poBusy = false;

function poNextDay(d){
  // toISOString() 은 UTC 로 바꿔버려 한국 시간대에서는 하루 밀린다.
  // 날짜 문자열을 직접 만든다.
  const t = new Date(d + 'T00:00:00');
  t.setDate(t.getDate() + 1);
  const z = n => String(n).padStart(2,'0');
  return t.getFullYear() + '-' + z(t.getMonth()+1) + '-' + z(t.getDate());
}

function poOpen(){
  poStep=1; poQty={}; poFilt='urgent'; poQ=''; poGrp=[]; poErr=[]; poRes=null;
  poDate = poNextDay(BASE);
  document.getElementById('poOvl').classList.add('on');
  poRender();
}
function poClose(reload){
  document.getElementById('poOvl').classList.remove('on');
  if(reload) location.reload();      // 등록분을 목록에 반영
}
document.addEventListener('keydown', function(e){
  if(e.key==='Escape' && document.getElementById('poOvl').classList.contains('on')) poClose();
});

function poPicked(){ return Object.keys(poQty).filter(k=>poQty[k]>0); }
function poCand(pid){ return CANDS.filter(c=>c.P_ID===pid)[0]; }
function poTotal(){
  return poPicked().reduce((a,p)=>a + poQty[p]*(poCand(p).P_Price||0), 0);
}

function poGo(dir){
  if(poBusy) return;
  if(poStep===4){ poClose(true); return; }
  const n = poStep + dir;
  if(n<1) return;
  if(n>3){ poSubmit(); return; }
  if(dir>0 && poStep===1 && !poPicked().length) return;
  poStep = n;
  if(poStep===3) poPreview(); else poRender();
}

// ── 3단계: 서버에 미리보기 요청 (협력사별 분리는 서버가 판단) ──
async function poPreview(){
  poBusy=true; poGrp=[]; poErr=[]; poRender();
  try{
    const r = await fetch('/api/purchase/preview', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({date:poDate, items:poPicked().map(p=>({P_ID:p, qty:poQty[p]}))})
    });
    const d = await r.json();
    poGrp = d.groups || []; poErr = d.errors || [];
  }catch(e){ poErr=['서버와 통신하지 못했습니다: ' + e.message]; }
  poBusy=false; poRender();
}

// ── 등록 ──
async function poSubmit(){
  poBusy=true; poRender();
  try{
    const r = await fetch('/api/purchase', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({date:poDate, items:poPicked().map(p=>({P_ID:p, qty:poQty[p]}))})
    });
    const d = await r.json();
    if(d.ok){ poRes = d.orders; poStep = 4; poErr=[]; }
    else poErr = d.errors || ['발주 등록에 실패했습니다.'];
  }catch(e){ poErr=['서버와 통신하지 못했습니다: ' + e.message]; }
  poBusy=false; poRender();
}

function poRender(){
  // 단계 표시
  document.getElementById('poSteps').innerHTML = STEPS.map(function(t,i){
    const n=i+1;
    const cls = poStep>n || poStep===4 ? 'done' : (poStep===n ? 'on' : '');
    return '<span class="po-st ' + cls + '">' + n + ' ' + t + '</span>';
  }).join('');

  const body = document.getElementById('poBody');
  const sum  = document.getElementById('poSum');
  const prev = document.getElementById('poPrev');
  const next = document.getElementById('poNext');

  if(poStep===1)      { body.innerHTML = poView1(); }
  else if(poStep===2) { body.innerHTML = poView2(); }
  else if(poStep===3) { body.innerHTML = poView3(); }
  else                { body.innerHTML = poView4(); }

  const n = poPicked().length;
  if(poStep===4){
    sum.innerHTML = '';
    prev.style.display='none';
    next.textContent='목록에서 확인'; next.disabled=false;
  }else{
    sum.innerHTML = n ? ('<b>' + n + '</b>개 품목 선택 · 예상 <b>' + won(poTotal()) + '원</b>')
                      : '발주할 자재를 선택하세요.';
    prev.style.display = poStep>1 ? '' : 'none';
    prev.disabled = poBusy;
    next.textContent = poBusy ? '처리 중…' : (poStep===3 ? '발주 등록' : '다음');
    next.disabled = poBusy || !n || (poStep===3 && (!poGrp.length || poErr.length));
  }
}

// ── 1단계: 대상 선정 ──
function poView1(){
  const list = CANDS.filter(function(c){
    if(poFilt==='urgent' && U_RANK[c.urgency]>1) return false;
    if(poFilt==='rec'    && !(c.order_qty>0))    return false;
    if(poQ){
      const t=(c.P_ID+' '+c.P_N+' '+(c.Spec||'')+' '+(c.supplier||'')).toLowerCase();
      if(t.indexOf(poQ)<0) return false;
    }
    return true;
  }).sort(function(a,b){
    const d=U_RANK[a.urgency]-U_RANK[b.urgency];
    return d || (b.order_amt||0)-(a.order_amt||0);
  });

  let h = '<div class="po-info">'
    + '<b>권장 발주량</b>은 수요 예측과 같은 계산입니다 — '
    + '<code>일평균 사용량 × 리드타임 + 안전재고 − 현재고</code>를 '
    + '최소발주수량(MOQ)과 포장단위로 올린 값입니다. 다음 단계에서 수량을 고칠 수 있습니다.'
    + '</div>';

  h += '<div class="po-bar">'
    + poPill('urgent','긴급만') + poPill('rec','권장 발주 있음') + poPill('all','전체 200종')
    + '<input type="search" placeholder="품번 · 품명 · 협력사" value="' + esc(poQ) + '" oninput="poSearch(this.value)">'
    + '<span class="po-lbl" style="margin-left:auto">' + list.length + '종</span>'
    + '</div>';

  if(!list.length) return h + '<div class="po-empty">조건에 맞는 자재가 없습니다.</div>';

  h += '<table class="po-tb"><thead><tr>'
    + '<th style="width:26px"></th><th>품번 · 품명</th>'
    + '<th class="hide-s">등급</th><th class="num">현재고</th><th class="num hide-s">안전재고</th>'
    + '<th>긴급도</th><th class="num">권장 발주</th><th class="hide-s">협력사</th>'
    + '</tr></thead><tbody>';

  list.forEach(function(c){
    const on = poQty[c.P_ID]>0;
    h += '<tr class="' + (on?'pick':'') + '" onclick="poToggle(&quot;' + c.P_ID + '&quot;)">'
      + '<td><input type="checkbox" ' + (on?'checked':'') + ' onclick="event.stopPropagation();poToggle(&quot;' + c.P_ID + '&quot;)"></td>'
      + '<td><div class="po-nm">' + esc(c.P_N) + '</div>'
      +   '<div class="po-sp">' + c.P_ID + ' · ' + esc(c.Spec||'') + '</div>'
      +   (c.open_qty>0 ? '<div class="po-dup"><i class="ti ti-alert-circle"></i> 미입고 발주 '
            + nf(c.open_qty) + '개 (' + c.open_po.map(function(o){return o.H_ID;}).join(', ') + ')</div>' : '')
      + '</td>'
      + '<td class="hide-s">' + (c.grade||'-') + '</td>'
      + '<td class="num">' + nf(c.stock) + '</td>'
      + '<td class="num hide-s">' + nf(c.safe_qty) + '</td>'
      + '<td><span class="u u-' + U_RANK[c.urgency] + '">' + c.urgency + '</span></td>'
      + '<td class="num">' + (c.order_qty>0 ? nf(c.order_qty) : '-') + '</td>'
      + '<td class="hide-s">' + esc(c.supplier||'-')
      +   (c.is_foreign==='Y' ? ' <span class="po-sp">해외</span>' : '') + '</td>'
      + '</tr>';
  });
  return h + '</tbody></table>';
}
function poPill(v,t){
  return '<button class="pill ' + (poFilt===v?'on':'') + '" onclick="poSetF(&quot;' + v + '&quot;)">' + t + '</button>';
}
function poSetF(v){ poFilt=v; poRender(); }
function poSearch(v){ poQ=(v||'').trim().toLowerCase(); poRender(); }
function poToggle(pid){
  if(poQty[pid]>0) delete poQty[pid];
  else{
    const c=poCand(pid);
    // 권장 발주량이 0이면(=아직 여유) 최소 발주 단위로 시작한다
    poQty[pid] = c.order_qty>0 ? c.order_qty : Math.max(c.MinOrderQty||0, c.PkgUnit||1);
  }
  poRender();
}

// ── 2단계: 수량 확정 ──
function poView2(){
  let h = '<div class="po-bar">'
    + '<span class="po-lbl">발주일</span>'
    + '<input type="date" value="' + poDate + '" onchange="poDate=this.value;poRender()">'
    + '<span class="po-lbl">데이터 기준일 ' + BASE + ' 다음 날로 잡았습니다</span>'
    + '</div>';

  const dup = poPicked().filter(function(p){ return poCand(p).open_qty>0; });
  if(dup.length){
    h += '<div class="po-warn"><i class="ti ti-alert-triangle"></i> '
      + '<b>' + dup.length + '개 품목은 이미 나가 있는 발주가 있습니다.</b> '
      + '아직 입고되지 않은 발주분을 감안해 수량을 정하세요 — '
      + '현장에서 가장 흔한 사고가 발주한 줄 모르고 다시 발주하는 것입니다.</div>';
  }

  h += '<table class="po-tb"><thead><tr>'
    + '<th>품번 · 품명</th><th class="num hide-s">현재고</th><th class="num hide-s">권장</th>'
    + '<th class="num">발주 수량</th><th class="hide-s">발주 단위</th>'
    + '<th class="num">금액</th><th style="width:26px"></th>'
    + '</tr></thead><tbody>';

  poPicked().forEach(function(p){
    const c=poCand(p), q=poQty[p];
    const pkg=c.PkgUnit||1, moq=c.MinOrderQty||0;
    const bad = (q<moq) || (pkg>1 && q%pkg!==0);
    h += '<tr>'
      + '<td><div class="po-nm">' + esc(c.P_N) + '</div>'
      +   '<div class="po-sp">' + c.P_ID + ' · ' + esc(c.supplier||'-') + '</div>'
      +   (c.open_qty>0 ? '<div class="po-dup"><i class="ti ti-alert-circle"></i> 미입고 '
            + nf(c.open_qty) + '개</div>' : '')
      + '</td>'
      + '<td class="num hide-s">' + nf(c.stock) + '</td>'
      + '<td class="num hide-s">' + (c.order_qty>0 ? nf(c.order_qty) : '-') + '</td>'
      + '<td class="num"><input class="po-q ' + (bad?'warn':'') + '" type="number" min="1" step="1" value="' + q + '"'
      +   ' onchange="poSetQ(&quot;' + p + '&quot;, this.value)"></td>'
      + '<td class="hide-s"><span class="po-sp">MOQ ' + nf(moq) + ' · 포장 ' + nf(pkg) + '</span>'
      +   (bad ? '<br><a href="#" onclick="poFix(&quot;' + p + '&quot;);return false" style="font-size:10px;color:var(--acc)">'
                 + nf(poRound(q,moq,pkg)) + '개로 맞추기</a>' : '') + '</td>'
      + '<td class="num">' + nf(q*(c.P_Price||0)) + '</td>'
      + '<td><button class="po-x" onclick="poToggle(&quot;' + p + '&quot;)"><i class="ti ti-x"></i></button></td>'
      + '</tr>';
  });
  h += '</tbody></table>';
  h += '<div class="po-note" style="border:0.5px solid var(--border);border-radius:var(--r);margin-top:9px">'
    + '발주 수량은 <b>최소발주수량 이상</b>이면서 <b>포장단위의 배수</b>여야 합니다. '
    + '상자 단위로 출하되므로 낱개 발주가 되지 않습니다. '
    + '조건에 맞지 않는 수량은 노란색으로 표시했습니다.</div>';
  return h;
}
function poRound(need,moq,pkg){
  need=Math.max(parseInt(need,10)||0,0);
  if(need<=0) return 0;
  need=Math.max(need,moq||0);
  pkg=pkg||1;
  return pkg>1 ? Math.ceil(need/pkg)*pkg : need;
}
function poSetQ(pid,v){
  const q=parseInt(v,10);
  if(!q || q<1){ poRender(); return; }
  poQty[pid]=q; poRender();
}
function poFix(pid){
  const c=poCand(pid);
  poQty[pid]=poRound(poQty[pid], c.MinOrderQty||0, c.PkgUnit||1);
  poRender();
}

// ── 3단계: 발주서 확인 ──

    });

      + '<div class="po-note">예상 입고일은 이 발주서에서 <b>가장 리드타임이 긴 자재</b> 기준입니다. '
      + '한 장에 묶인 품목은 함께 들어오는 것을 전제로 합니다.</div></div>';

  const tot = poGrp.reduce(function(a,g){return a+g.amount;},0);

    + '<b>' + nf(tot) + '원</b> (' + won(tot) + '원)<br>'

// ══════════════════════════════════════════════════════════
//  기간별 KPI
//
//  전체 누적으로만 보여주면 데이터가 쌓일수록 최근 상황이 묻힌다.
//  (작년에 잘했으면 이번 달 납품이 엉망이어도 일치율이 좋아 보인다)
//  그래서 KPI를 화면에서 계산해 기간 선택을 따라가게 한다.
// ══════════════════════════════════════════════════════════

// 기간 계산은 공통 모듈(static/js/period.js)을 쓴다 — 화면마다 같은 구분을 유지하기 위해
function inPeriod(date, v){ return Period.has(date, v, PBASE); }
function periodLabel(v){ return Period.label(v, PBASE); }

function calcKpi(list){
  const lines = [];
  list.forEach(function(o){ (o.items||[]).forEach(function(i){ lines.push(i); }); });
  const ok      = lines.filter(function(i){return i.status==='일치';}).length;
  const shorts  = lines.filter(function(i){return i.status==='부족';});
  const pending = lines.filter(function(i){return i.status==='미입고';}).length;
  const recv    = lines.length - pending;        // 입고 판정이 끝난 품목만 분모
  const lds     = list.map(function(o){return o.lead_days;}).filter(function(v){return v!=null;});
  const dates   = list.map(function(o){return o.date||'';}).filter(Boolean).sort();
  return {
    order_cnt: list.length,
    line_cnt : lines.length,
    recv_cnt : recv,
    pending  : pending,
    suppliers: new Set(list.map(function(o){return o.BRN;})).size,
    amount   : list.reduce(function(a,o){return a+(o.amount||0);},0),
    in_amount: list.reduce(function(a,o){return a+(o.in_amount||0);},0),
    ok       : ok,
    ok_pct   : Period.pct(ok, recv),
    short    : shorts.length,
    short_qty: shorts.reduce(function(a,i){return a+Math.abs(i.gap||0);},0),
    short_orders: list.filter(function(o){return o.short;}).length,
    lead_avg : lds.length ? Math.round(lds.reduce(function(a,b){return a+b;},0)/lds.length*10)/10 : null,
    from     : dates[0] || '-',
    to       : dates[dates.length-1] || '-'
  };
}

function drawKpi(list, pv, sup){
  const k = calcKpi(list);
  const eok = n => n==null ? '-' : n;
  document.getElementById('ptag').textContent =
    '실제 DB · ' + periodLabel(pv) + (sup ? ' · ' + sup : '') + ' · ' + k.order_cnt + '건';

  document.getElementById('kpis').innerHTML =
      '<div class="kpi"><div class="kl"><i class="ti ti-file-text"></i>발주</div>'
    +   '<div class="kv">' + nf(k.order_cnt) + '<span class="ku">건</span></div>'
    +   '<div class="ks">' + nf(k.line_cnt) + '개 품목 · 협력사 ' + k.suppliers + '</div></div>'

    + '<div class="kpi"><div class="kl"><i class="ti ti-coin"></i>발주 금액</div>'
    +   '<div class="kv">' + won(k.amount) + '<span class="ku">원</span></div>'
    +   '<div class="ks">입고 ' + won(k.in_amount) + '원</div></div>'

    + '<div class="kpi"><div class="kl"><i class="ti ti-circle-check"></i>입고 일치율</div>'
    +   '<div class="kv ok">' + eok(k.ok_pct) + '<span class="ku">%</span></div>'
    +   '<div class="ks">' + nf(k.ok) + '/' + nf(k.recv_cnt) + ' 품목'
    +     (k.pending ? ' · <span style="color:var(--txt3)">미입고 ' + nf(k.pending) + ' 제외</span>' : '')
    +   '</div></div>'

    + '<div class="kpi"><div class="kl"><i class="ti ti-alert-triangle"></i>부족 입고</div>'
    +   '<div class="kv wn">' + nf(k.short) + '<span class="ku">건</span></div>'
    +   '<div class="ks">' + nf(k.short_qty) + '개 · 발주 ' + nf(k.short_orders) + '건</div></div>'

    + '<div class="kpi"><div class="kl"><i class="ti ti-clock"></i>평균 리드타임</div>'
    +   '<div class="kv ac">' + eok(k.lead_avg) + '<span class="ku">일</span></div>'
    +   '<div class="ks">' + (k.pending && !k.lead_avg ? '입고 건이 없어 산출 불가' : '발주 → 입고') + '</div></div>';
}
