<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>발주 제안</title>
<link rel="stylesheet" href="/static/vendor/tabler-icons.css">
<style>
:root{
  --acc:#2a78d6; --ok:#1D9E75; --wn:#EF9F27; --dn:#E24B4A;
  --s0:#F8F7F4; --s1:#EFEEEA; --s2:#E5E4DF;
  --border:#D4D3CE; --border-s:#B9B8B3; --txt:#1A1917; --txt3:#898781; --r:6px;
  --bg-ac:#EAF2FC; --bg-ok:#E7F5F0; --bg-wn:#FDF3E3; --bg-dn:#FBEAEA;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard','Malgun Gothic',sans-serif;background:var(--s0);
  color:var(--txt);font-size:12px;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:12px;gap:10px}

.ro{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;
  border:0.5px solid var(--border);border-radius:var(--r);padding:9px 12px}
.ro .note{font-size:11px;color:var(--txt3);line-height:1.5}
.sp{flex:1}
select,input[type=text],input[type=number]{font-family:inherit;font-size:11px;padding:5px 7px;
  border:0.5px solid var(--border);border-radius:5px;background:#fff;color:var(--txt)}
.btn{font-family:inherit;font-size:11px;padding:6px 11px;border:0.5px solid var(--border);
  border-radius:5px;background:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.btn:hover{background:var(--s1)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnp{background:var(--acc);color:#fff;border-color:var(--acc)}
.btnp:hover{background:#2468bb}
.btns{background:var(--ok);color:#fff;border-color:var(--ok)}
.btns:hover{background:#17835f}
.btnd{background:#fff;color:var(--dn);border-color:var(--dn)}
.btnd:hover{background:var(--bg-dn)}

.krow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.kc{background:#fff;border:0.5px solid var(--border);border-radius:var(--r);padding:9px 11px}
.kl{font-size:10px;color:var(--txt3);display:flex;align-items:center;gap:4px}
.kv{font-size:19px;font-weight:600;margin-top:2px;letter-spacing:-.4px}
.ks{font-size:10px;color:var(--txt3);margin-top:1px}

.tabs{display:flex;gap:4px}
.tab{font-size:11px;padding:6px 12px;border:0.5px solid var(--border);border-radius:5px;
  background:#fff;cursor:pointer}
.tab.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.tc{font-size:10px;opacity:.75;margin-left:3px}

.main{flex:1;display:flex;gap:10px;overflow:hidden}
.left{flex:1;display:flex;flex-direction:column;background:#fff;border:0.5px solid var(--border);
  border-radius:var(--r);overflow:hidden}
.lh{padding:8px 11px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;
  gap:8px;font-size:11px;color:var(--txt3);flex-wrap:wrap}
.listwrap{flex:1;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:11px}
table:not([class]){min-width:820px}
th{position:sticky;top:0;background:var(--s1);padding:7px 9px;text-align:left;font-weight:500;
  font-size:10px;color:var(--txt3);border-bottom:0.5px solid var(--border);white-space:nowrap;z-index:1}
td{padding:7px 9px;border-bottom:0.5px solid var(--border);white-space:nowrap;vertical-align:middle}
tr.pick{cursor:pointer}
tr.pick:hover > td{background:var(--s1)}
tr.on > td{background:var(--bg-ac)}
.num{text-align:right}
.pid{font-family:ui-monospace,Menlo,monospace;font-size:10px;color:var(--acc)}
.nm{font-size:11px}
.sub{font-size:9px;color:var(--txt3);margin-top:1px}

.bg{display:inline-block;font-size:9px;padding:1px 6px;border-radius:9px;white-space:nowrap}
.bok{background:var(--bg-ok);color:#0F7A57}
.bwn{background:var(--bg-wn);color:#9A6412}
.bdn{background:var(--bg-dn);color:#9B1C1C}
.bac{background:var(--bg-ac);color:#1D5FA8}
.bmu{background:var(--s2);color:var(--txt3)}

.right{width:300px;flex-shrink:0;display:flex;flex-direction:column;background:#fff;
  border:0.5px solid var(--border);border-radius:var(--r);overflow:hidden}
.dh{padding:10px 12px;border-bottom:0.5px solid var(--border)}
.dh-t{font-size:13px;font-weight:600}
.dh-s{font-size:10px;color:var(--txt3);margin-top:2px;line-height:1.5}
.dbody{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:9px;padding:10px 12px}
/* ⚠️ 세로 flex 는 넘치기 전에 자식을 먼저 줄인다. .pn 의 overflow:hidden 이
   min-height:auto 바닥을 없애 카드가 0 까지 눌린다 — 줄이지 말고 넘겨라. */
.dbody > *{flex-shrink:0}
.pn{border:0.5px solid var(--border);border-radius:8px;overflow:hidden}
.pnh{background:var(--s1);padding:6px 10px;font-size:10px;color:var(--txt3);
  display:flex;align-items:center;gap:5px}
.pnh-t{font-weight:500;color:var(--txt)}
.ir{display:flex;justify-content:space-between;gap:8px;padding:5px 10px;font-size:11px;
  border-bottom:0.5px solid var(--s2)}
.ir:last-child{border-bottom:none}
.ik{color:var(--txt3);flex-shrink:0}
.iv{text-align:right;word-break:break-all}
.mnote{font-size:10px;color:var(--txt3);line-height:1.6;padding:8px 10px;background:var(--s1);
  border-radius:6px}
.empty{padding:28px 14px;text-align:center;color:var(--txt3);font-size:11px;line-height:1.7}

.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 11px;
  border-top:0.5px solid var(--border);background:var(--s1)}
.bar b{font-size:12px}
.qty{width:74px;text-align:right}
.warn{font-size:10px;color:var(--dn)}

/* 덮는 창 — embed-mobile.js 의 MODAL_SEL 과 같은 이름을 쓴다 */
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;
  justify-content:center;z-index:50;padding:16px}
.ovl.on{display:flex}
.ovb{background:#fff;border-radius:10px;max-width:520px;width:100%;max-height:86vh;
  display:flex;flex-direction:column;overflow:hidden}
.ovh{padding:11px 14px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;gap:8px}
.ovc{padding:12px 14px;overflow:auto;display:flex;flex-direction:column;gap:9px}
.ovf{padding:10px 14px;border-top:0.5px solid var(--border);display:flex;gap:6px;justify-content:flex-end}
.fl{display:flex;flex-direction:column;gap:3px;font-size:11px}
.fl > span{color:var(--txt3);font-size:10px}
textarea{font-family:inherit;font-size:11px;padding:6px 8px;border:0.5px solid var(--border);
  border-radius:5px;resize:vertical;min-height:52px}

@media(max-width:820px){
  .krow{grid-template-columns:repeat(2,1fr)}
  .main{flex-direction:column}
  .right{width:auto}
}
</style>
<!-- 폰 CSS 는 화면 고유 style **뒤에** 와야 이긴다 (전 embed 공통 규칙) -->
<link rel="stylesheet" href="/static/css/embed-mobile.css">
</head>
<body>
<div class="wrap">

  <div class="ro">
    <div class="note">
      <b>등급이 발주 방식을 정합니다.</b>
      A <span class="bg bdn">수동</span> 담당자가 확인하고 직접 ·
      B <span class="bg bwn">승인</span> 준비해 두고 승인하면 발주 ·
      C <span class="bg bok">자동</span> 즉시 발주(품목별로 끌 수 있습니다).<br>
      발주 마감까지 <b id="leadd">14</b>일 이내인 자재를 집습니다. 기준일 <b id="based"></b>.
    </div>
    <div class="sp"></div>
    <button class="btn btnp" onclick="makePlans()"><i class="ti ti-refresh"></i>발주 제안 생성</button>
  </div>

  <div class="krow">
    <div class="kc"><div class="kl"><i class="ti ti-clipboard-list"></i>대기 제안</div>
      <div class="kv" id="k1">-</div><div class="ks" id="k1s"></div></div>
    <div class="kc"><div class="kl"><i class="ti ti-coin"></i>대기 금액</div>
      <div class="kv" id="k2">-</div><div class="ks">승인하면 나갈 금액</div></div>
    <div class="kc"><div class="kl"><i class="ti ti-robot"></i>자동 발주</div>
      <div class="kv" id="k3">-</div><div class="ks" id="k3s"></div></div>
    <div class="kc"><div class="kl"><i class="ti ti-hand-stop"></i>자동 멈춤</div>
      <div class="kv" id="k4">-</div><div class="ks" id="k4s"></div></div>
    <div class="kc"><div class="kl"><i class="ti ti-adjustments"></i>품목 예외</div>
      <div class="kv" id="k5">-</div><div class="ks">등급 기본값을 덮은 자재</div></div>
  </div>

  <div class="tabs">
    <button class="tab on" data-t="wait" onclick="setTab('wait')">대기 제안<span class="tc" id="tc1"></span></button>
    <button class="tab" data-t="hist" onclick="setTab('hist')">처리 이력<span class="tc" id="tc2"></span></button>
    <button class="tab" data-t="pol"  onclick="setTab('pol')">정책<span class="tc" id="tc3"></span></button>
  </div>

  <div class="main">
    <div class="left">
      <div class="lh" id="lh"></div>
      <div class="listwrap" id="list"></div>
      <div class="bar" id="bar" style="display:none">
        <span id="selinfo">고른 것 없음</span>
        <div class="sp"></div>
        <select id="appr"></select>
        <button class="btn btnd" onclick="openAct('reject')">반려</button>
        <button class="btn" onclick="doHold()">보류</button>
        <button class="btn btns" onclick="openAct('approve')">승인 · 발주</button>
      </div>
    </div>

    <div class="right">
      <div class="dh"><div class="dh-t" id="dht">제안을 선택하세요</div>
        <div class="dh-s" id="dhs">왼쪽에서 고르면 그 제안의 근거가 여기에 나옵니다.</div></div>
      <div class="dbody" id="dbody"></div>
    </div>
  </div>
</div>

<div class="ovl" id="ovl"><div class="ovb">
  <div class="ovh"><i class="ti ti-alert-circle"></i><b id="ovt"></b>
    <div class="sp"></div><button class="btn" onclick="closeOv()">닫기</button></div>
  <div class="ovc" id="ovc"></div>
  <div class="ovf" id="ovf"></div>
</div></div>

<script>
// 서버가 내려준 값 — order_plan_source()
const ROWS   = {{ rows|tojson }};
const SUM    = {{ summary|tojson }};
const CAND   = {{ cand|tojson }};
const SKIP   = {{ skipped|tojson }};
const BASE   = {{ base|tojson }};
const ENTRY  = {{ entry|tojson }};
const POLICY = {{ policy|tojson }};
const PDESC  = {{ policy_desc|tojson }};
const PLIST  = {{ policy_list|tojson }};
const AUTOMAX= {{ auto_max|tojson }};
const LEADD  = {{ lead_days|tojson }};
const CUSTOM = {{ custom|tojson }};
const APPRS  = {{ approvers|tojson }};
const WORKERS= {{ workers|tojson }};
const BYGRADE= {{ by_grade|tojson }};

const nf = n => (n == null ? '-' : Number(n).toLocaleString('ko-KR'));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const won = n => nf(Math.round(n || 0)) + '원';

let TAB = 'wait', SEL = {}, CUR = null, QTY = {};

const WAIT = ROWS.filter(r => r.Status === '대기');
const HIST = ROWS.filter(r => r.Status !== '대기');

function polBadge(p){
  const c = p === '자동' ? 'bok' : (p === '승인' ? 'bwn' : 'bdn');
  return '<span class="bg ' + c + '">' + esc(p) + '</span>';
}
function gradeBadge(g){
  return '<span class="bg ' + (g === 'A' ? 'bdn' : g === 'B' ? 'bwn' : 'bac') + '">' + esc(g) + '</span>';
}
function dl(n){
  if(n == null) return '-';
  if(n < 0) return '<b style="color:var(--dn)">' + n + '일 지남</b>';
  if(n === 0) return '<b style="color:var(--dn)">오늘</b>';
  return 'D-' + n;
}

function kpi(){
  document.getElementById('based').textContent = BASE;
  document.getElementById('leadd').textContent = LEADD;
  document.getElementById('k1').textContent = SUM.wait;
  document.getElementById('k1s').innerHTML = '수동 ' + SUM.manual + ' · 승인 ' + SUM.appr;
  document.getElementById('k2').textContent = won(SUM.wait_amt);
  document.getElementById('k3').textContent = SUM.auto_placed;
  document.getElementById('k3s').textContent = '사람 손 없이 나간 발주';
  document.getElementById('k4').textContent = SUM.blocked;
  document.getElementById('k4s').textContent = '한도 ' + nf(AUTOMAX) + '원 초과';
  document.getElementById('k5').textContent = CUSTOM.length;
  document.getElementById('tc1').textContent = WAIT.length;
  document.getElementById('tc2').textContent = HIST.length;
  document.getElementById('tc3').textContent = CUSTOM.length;
  // 승인자 — 권한 있는 사람만. 눌러 보고 거절당해서 알게 하지 않는다
  document.getElementById('appr').innerHTML =
    '<option value="">승인자 선택</option>' + APPRS.map(w =>
      '<option value="' + w.EP_ID + '">' + esc(w.Name) + ' ' + esc(w.Position) + '</option>').join('');
}

function setTab(t){
  TAB = t; SEL = {}; CUR = null;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  draw();
}

function rowsFor(){ return TAB === 'wait' ? WAIT : TAB === 'hist' ? HIST : CUSTOM; }

function draw(){
  const lh = document.getElementById('lh'), box = document.getElementById('list'),
        bar = document.getElementById('bar');
  bar.style.display = (TAB === 'wait' && WAIT.length) ? 'flex' : 'none';

  if(TAB === 'pol'){ drawPolicy(); return; }
  if(TAB === 'hist'){ drawHist(); return; }

  lh.innerHTML = '<b style="color:var(--txt)">' + WAIT.length + '건</b> 대기'
    + ' · 수동 ' + SUM.manual + ' · 승인 ' + SUM.appr
    + (SUM.blocked ? ' · <span style="color:var(--dn)">자동 멈춤 ' + SUM.blocked + '</span>' : '')
    + '<div class="sp"></div>'
    + '<button class="btn" onclick="pickAll(true)">승인 건 전체 선택</button>'
    + '<button class="btn" onclick="pickAll(false)">해제</button>';

  if(!WAIT.length){
    box.innerHTML = '<div class="empty">대기 중인 제안이 없습니다.<br>'
      + '<b>[발주 제안 생성]</b> 을 누르면 발주 마감이 ' + LEADD + '일 이내로 다가온 자재를 모아'
      + ' 등급별 정책대로 처리합니다.' + (CAND.length ? '<br>지금 집을 수 있는 자재 '
      + CAND.length + '종이 있습니다.' : '') + '</div>';
    return;
  }
  box.innerHTML = '<table><thead><tr>'
    + '<th style="width:28px"></th><th>제안 · 자재</th><th>등급 · 정책</th>'
    + '<th class="num">발주 마감</th><th class="num">재고 / 안전</th>'
    + '<th class="num">수량</th><th class="num">금액</th><th>협력사</th></tr></thead><tbody>'
    + WAIT.map(r => {
      const q = QTY[r.Plan_ID] != null ? QTY[r.Plan_ID] : r.Qty;
      return '<tr class="pick' + (CUR === r.Plan_ID ? ' on' : '') + '"'
      + ' onclick="pick(&quot;' + r.Plan_ID + '&quot;)">'
      + '<td onclick="event.stopPropagation()"><input type="checkbox" '
      +   (SEL[r.Plan_ID] ? 'checked' : '') + ' onchange="toggle(&quot;' + r.Plan_ID + '&quot;,this.checked)"></td>'
      + '<td><div class="nm">' + esc(r.P_N || '') + '</div>'
      +   '<div class="sub"><span class="pid">' + r.Plan_ID + '</span> · ' + esc(r.P_ID) + '</div></td>'
      + '<td>' + gradeBadge(r.Grade) + ' ' + polBadge(r.Policy)
      +   (r.Auto_Block ? '<div class="sub" style="color:var(--dn)">자동 멈춤</div>' : '')
      +   (r.Policy !== POLICY[r.Grade] ? '<div class="sub">예외 적용</div>' : '') + '</td>'
      + '<td class="num">' + dl(r.Deadline) + '</td>'
      + '<td class="num">' + nf(r.Stock_Qty) + ' / ' + nf(r.Safe_Qty) + '</td>'
      + '<td class="num" onclick="event.stopPropagation()">'
      +   '<input type="number" class="qty" min="1" value="' + q + '"'
      +   ' onchange="setQty(&quot;' + r.Plan_ID + '&quot;,this.value)"></td>'
      + '<td class="num">' + won(q * (r.Unit_Price || 0)) + '</td>'
      + '<td>' + esc(r.supplier || '-') + (r.is_foreign ? ' <span class="bg bmu">해외</span>' : '') + '</td>'
      + '</tr>';
    }).join('') + '</tbody></table>';
  selInfo();
}

function drawHist(){
  const lh = document.getElementById('lh'), box = document.getElementById('list');
  lh.innerHTML = '<b style="color:var(--txt)">' + HIST.length + '건</b>'
    + ' · 발주 ' + SUM.placed + '(자동 ' + SUM.auto_placed + ')'
    + ' · 반려 ' + SUM.rejected + ' · 보류 ' + SUM.held;
  if(!HIST.length){ box.innerHTML = '<div class="empty">처리된 제안이 없습니다.</div>'; return; }
  box.innerHTML = '<table><thead><tr>'
    + '<th>제안일</th><th>제안 · 자재</th><th>등급 · 정책</th><th>결과</th>'
    + '<th class="num">수량</th><th class="num">금액</th><th>발주번호</th><th>처리</th>'
    + '</tr></thead><tbody>'
    + HIST.map(r => '<tr class="pick' + (CUR === r.Plan_ID ? ' on' : '') + '"'
      + ' onclick="pick(&quot;' + r.Plan_ID + '&quot;)">'
      + '<td>' + esc(r.Plan_Date) + '</td>'
      + '<td><div class="nm">' + esc(r.P_N || '') + '</div>'
      +   '<div class="sub"><span class="pid">' + r.Plan_ID + '</span> · ' + esc(r.P_ID) + '</div></td>'
      + '<td>' + gradeBadge(r.Grade) + ' ' + polBadge(r.Policy) + '</td>'
      + '<td>' + (r.Status === '발주' ? '<span class="bg bok">발주</span>'
                : r.Status === '반려' ? '<span class="bg bdn">반려</span>'
                : '<span class="bg bmu">' + esc(r.Status) + '</span>') + '</td>'
      + '<td class="num">' + nf(r.Qty) + '</td>'
      + '<td class="num">' + won(r.Amount) + '</td>'
      + '<td>' + (r.H_ID ? '<span class="pid">' + esc(r.H_ID) + '</span>' : '-') + '</td>'
      + '<td>' + (r.worker ? esc(r.worker) : '<span class="bg bok">자동</span>')
      +   '<div class="sub">' + esc(r.Done_Date || '') + '</div></td>'
      + '</tr>').join('') + '</tbody></table>';
}

function drawPolicy(){
  const lh = document.getElementById('lh'), box = document.getElementById('list');
  lh.innerHTML = '등급이 정한 기본값을 <b style="color:var(--txt)">품목별로 덮을 수 있습니다</b>'
    + '<div class="sp"></div>'
    + '<button class="btn btnp" onclick="openPol()"><i class="ti ti-plus"></i>예외 걸기</button>';
  const base = 'ABC'.split('').map(g =>
    '<tr><td>' + gradeBadge(g) + '</td><td>' + polBadge(POLICY[g]) + '</td>'
    + '<td class="num">' + nf(BYGRADE[g].n) + '종</td>'
    + '<td style="white-space:normal">' + esc(PDESC[POLICY[g]]) + '</td></tr>').join('');
  const cus = CUSTOM.length
    ? CUSTOM.map(c => '<tr><td><span class="pid">' + esc(c.P_ID) + '</span>'
        + '<div class="sub">' + esc(c.P_N || '') + '</div></td>'
        + '<td>' + gradeBadge(c.grade) + ' ' + polBadge(c.base) + '</td>'
        + '<td>' + polBadge(c.policy) + '</td>'
        + '<td style="white-space:normal">' + esc(c.reason || '') + '</td>'
        + '<td><button class="btn" onclick="clearPol(&quot;' + c.P_ID + '&quot;)">거두기</button></td></tr>').join('')
    : '<tr><td colspan="5" style="color:var(--txt3);text-align:center;padding:14px">'
      + '품목별 예외가 없습니다 — 전 자재가 등급 기본값을 따릅니다.</td></tr>';
  box.innerHTML =
      '<div style="padding:10px 11px"><div class="mnote">'
    + '<b>자동 발주 한도 ' + nf(AUTOMAX) + '원.</b> C등급이라도 한 건이 이 금액을 넘으면'
    + ' 자동을 멈추고 승인 대기로 돌립니다 — C는 싸고 흔한 자재라는 전제 위에서 자동을'
    + ' 허용한 것이라, 전제가 깨지면 사람이 봐야 합니다.</div></div>'
    + '<table class="tbl"><thead><tr><th>등급</th><th>기본 정책</th><th class="num">자재</th>'
    + '<th>무엇을 하나</th></tr></thead><tbody>' + base + '</tbody></table>'
    + '<div style="padding:10px 11px 4px;font-size:11px;color:var(--txt3)">'
    + '<b style="color:var(--txt)">품목별 예외 ' + CUSTOM.length + '건</b></div>'
    + '<table class="tbl"><thead><tr><th>품번</th><th>등급 기본</th><th>적용</th>'
    + '<th>사유</th><th></th></tr></thead><tbody>' + cus + '</tbody></table>';
}

function pick(id){
  CUR = id; draw(); detail(id);
}
function toggle(id, on){ SEL[id] = on; selInfo(); }
function setQty(id, v){
  const n = parseInt(v, 10);
  QTY[id] = (isNaN(n) || n < 1) ? 1 : n;
  draw();
}
function pickAll(on){
  // A(수동)는 담당자가 **한 건씩 확인**하는 자리다. 전체 선택에 딸려 나가면
  // 그 구분이 사라지므로 승인 정책만 집는다.
  WAIT.forEach(r => { if(r.Policy === '승인' && !r.Auto_Block) SEL[r.Plan_ID] = on; });
  draw();
}
function picked(){ return WAIT.filter(r => SEL[r.Plan_ID]); }
function selInfo(){
  const p = picked();
  const amt = p.reduce((a, r) => a + (QTY[r.Plan_ID] != null ? QTY[r.Plan_ID] : r.Qty) * (r.Unit_Price || 0), 0);
  const man = p.filter(r => r.Policy === '수동').length;
  document.getElementById('selinfo').innerHTML = p.length
    ? '고른 것 <b>' + p.length + '건</b> · <b>' + won(amt) + '</b>'
      + (man ? ' <span class="bg bdn">수동 ' + man + '</span>' : '')
    : '고른 것 없음';
}

function detail(id){
  const r = ROWS.filter(x => x.Plan_ID === id)[0];
  if(!r) return;
  const q = QTY[id] != null ? QTY[id] : r.Qty;
  document.getElementById('dht').textContent = r.P_N || r.P_ID;
  document.getElementById('dhs').innerHTML = '<span class="pid">' + r.Plan_ID + '</span> · '
    + esc(r.P_ID) + ' · ' + esc(r.Spec || '');
  document.getElementById('dbody').innerHTML =
      '<div class="pn"><div class="pnh"><i class="ti ti-route"></i>'
    +   '<span class="pnh-t">어떻게 나가나</span>' + gradeBadge(r.Grade) + polBadge(r.Policy) + '</div>'
    +   '<div class="ir"><span class="ik">등급 기본</span><span class="iv">'
    +     esc(POLICY[r.Grade] || '-') + (r.Policy !== POLICY[r.Grade]
          ? ' → <b>' + esc(r.Policy) + '</b> (예외)' : '') + '</span></div>'
    +   '<div class="mnote" style="border-radius:0">' + esc(PDESC[r.Policy] || '') + '</div>'
    +   (r.Auto_Block ? '<div class="mnote" style="border-radius:0;color:var(--dn)">'
          + '⚠️ ' + esc(r.Auto_Block) + '</div>' : '')
    + '</div>'

    + '<div class="pn"><div class="pnh"><i class="ti ti-calculator"></i>'
    +   '<span class="pnh-t">제안 근거</span><span class="bg bmu">제안 시점 값</span></div>'
    +   ir('현재고', nf(r.Stock_Qty) + '개')
    +   ir('안전재고', nf(r.Safe_Qty) + '개')
    +   ir('일평균 사용량', nf(r.Daily) + '개/일')
    +   ir('리드타임', nf(r.Lead_Time) + '일')
    +   ir('발주 마감', dl(r.Deadline))
    +   '<div class="mnote" style="border-radius:0">권장 발주량 = 일평균 × 리드타임'
    +     ' + 안전재고 − 현재고, MOQ(' + nf(r.MinOrderQty) + ')와 포장단위('
    +     nf(r.PkgUnit) + ')로 올림합니다.</div>'
    + '</div>'

    + '<div class="pn"><div class="pnh"><i class="ti ti-package"></i>'
    +   '<span class="pnh-t">발주 내용</span></div>'
    +   ir('수량', '<b>' + nf(q) + '</b>개' + (q !== r.Qty ? ' <span class="bg bwn">조정</span>' : ''))
    +   ir('단가', won(r.Unit_Price) + ' <span class="bg bmu">제안 시점</span>')
    +   ir('금액', '<b>' + won(q * (r.Unit_Price || 0)) + '</b>')
    +   ir('협력사', esc(r.supplier || '-'))
    +   ir('예상 입고', nf(r.cur_lead) + '일 뒤')
    + '</div>'

    + (r.Status !== '대기'
       ? '<div class="pn"><div class="pnh"><i class="ti ti-check"></i>'
         + '<span class="pnh-t">처리 결과</span></div>'
         + ir('상태', esc(r.Status))
         + ir('발주번호', r.H_ID ? '<span class="pid">' + esc(r.H_ID) + '</span>' : '-')
         + ir('처리자', r.worker ? esc(r.worker) : '자동 (사람 없음)')
         + ir('처리일', esc(r.Done_Date || '-'))
         + (r.Note ? '<div class="mnote" style="border-radius:0">' + esc(r.Note) + '</div>' : '')
         + '</div>'
       : '');
}
function ir(k, v){
  return '<div class="ir"><span class="ik">' + k + '</span><span class="iv">' + v + '</span></div>';
}

// ── 쓰기 ────────────────────────────────────────────────────
async function post(url, body){
  const r = await fetch(url, {method: 'POST', headers: {'Content-Type': 'application/json'},
                             body: JSON.stringify(body)});
  let d = {};
  try{ d = await r.json(); }catch(e){ d = {ok: false, errors: ['응답을 읽지 못했습니다.']}; }
  return d;
}
function reload(){ location.reload(); }

async function makePlans(){
  const d = await post('/api/plan/make', {});
  if(!d.ok){ alertOv('제안을 만들지 못했습니다', (d.errors || []).join('\n')); return; }
  const n = (d.result.made || []).length, a = (d.result.auto || []).length;
  if(!n){ alertOv('지금 발주할 자재가 없습니다',
    '발주 마감이 ' + LEADD + '일 이내로 다가온 자재가 없거나, 이미 발주가 나가 있습니다.'); return; }
  alertOv('제안 ' + n + '건을 만들었습니다',
    'C등급 자동 발주 ' + a + '건은 이미 나갔고, 나머지 ' + (n - a) + '건이 대기로 남았습니다.', reload);
}

function openAct(kind){
  const p = picked();
  if(!p.length){ alertOv('고른 제안이 없습니다', '처리할 제안을 먼저 고르세요.'); return; }
  const ep = document.getElementById('appr').value;
  if(!ep){ alertOv('승인자를 고르세요', '발주는 돈을 쓰는 일이라 직급과 금액 한도를 봅니다.'); return; }
  const amt = p.reduce((a, r) => a + (QTY[r.Plan_ID] != null ? QTY[r.Plan_ID] : r.Qty) * (r.Unit_Price || 0), 0);
  const w = APPRS.filter(x => x.EP_ID === ep)[0] || {};
  const over = (w.limit != null) && amt > w.limit;
  const rows = p.map(r => '<div class="ir"><span class="ik">' + esc(r.P_N || r.P_ID)
    + ' ' + polBadge(r.Policy) + '</span><span class="iv">'
    + nf(QTY[r.Plan_ID] != null ? QTY[r.Plan_ID] : r.Qty) + '개 · '
    + won((QTY[r.Plan_ID] != null ? QTY[r.Plan_ID] : r.Qty) * (r.Unit_Price || 0)) + '</span></div>').join('');

  document.getElementById('ovt').textContent =
    kind === 'approve' ? '승인하면 바로 발주됩니다' : '제안을 반려합니다';
  document.getElementById('ovc').innerHTML =
      '<div class="pn">' + rows + '</div>'
    + '<div class="ir"><span class="ik">합계</span><span class="iv"><b>' + won(amt) + '</b></span></div>'
    + (kind === 'approve'
       ? '<div class="mnote">협력사별로 발주서가 나뉘어 생성됩니다. 발주 뒤에는 되돌릴 수 없습니다.'
         + (over ? '<br><b style="color:var(--dn)">' + esc(w.Name) + ' ' + esc(w.Position)
             + '의 한도 ' + nf(w.limit) + '원을 넘습니다 — 상위 직급이 처리해야 합니다.</b>' : '')
         + '</div>'
         + '<label class="fl"><span>메모 (선택)</span><textarea id="ovnote"></textarea></label>'
       : '<label class="fl"><span>반려 사유 (필수)</span><textarea id="ovnote"'
         + ' placeholder="예) 생산 계획이 줄어 당분간 필요 없습니다"></textarea></label>');
  document.getElementById('ovf').innerHTML =
      '<button class="btn" onclick="closeOv()">취소</button>'
    + '<button class="btn ' + (kind === 'approve' ? 'btns' : 'btnd') + '" ' + (over ? 'disabled' : '')
    + ' onclick="doAct(&quot;' + kind + '&quot;)">'
    + (kind === 'approve' ? '확정 발주' : '반려') + '</button>';
  document.getElementById('ovl').classList.add('on');
}

async function doAct(kind){
  const ids = picked().map(r => r.Plan_ID);
  const ep = document.getElementById('appr').value;
  const note = (document.getElementById('ovnote') || {}).value || '';
  const qty = {};
  picked().forEach(r => { if(QTY[r.Plan_ID] != null) qty[r.Plan_ID] = QTY[r.Plan_ID]; });
  const d = kind === 'approve'
    ? await post('/api/plan/approve', {ids: ids, EP_ID: ep, qty: qty, note: note})
    : await post('/api/plan/reject', {ids: ids, EP_ID: ep, reason: note});
  if(!d.ok){ alertOv('처리하지 못했습니다', (d.errors || []).join('\n')); return; }
  closeOv();
  alertOv(kind === 'approve' ? '발주했습니다' : '반려했습니다',
    kind === 'approve'
      ? '발주서 ' + ((d.result.made || []).length) + '장 · ' + won(d.result.amount)
        + '\n입고 처리 화면의 미입고 목록에 나타납니다.'
      : ids.length + '건을 반려했습니다.', reload);
}

async function doHold(){
  const p = picked();
  if(!p.length){ alertOv('고른 제안이 없습니다', '보류할 제안을 먼저 고르세요.'); return; }
  const ep = document.getElementById('appr').value || (WORKERS[0] || {}).EP_ID;
  const d = await post('/api/plan/hold', {ids: p.map(r => r.Plan_ID), EP_ID: ep});
  if(!d.ok){ alertOv('보류하지 못했습니다', (d.errors || []).join('\n')); return; }
  alertOv('보류했습니다', '오늘은 다시 올라오지 않습니다. 내일 다시 제안됩니다.', reload);
}

function openPol(){
  document.getElementById('ovt').textContent = '품목별 발주 정책 예외';
  const opts = PLIST.map(p => '<option value="' + p + '">' + p + '</option>').join('');
  document.getElementById('ovc').innerHTML =
      '<div class="mnote">등급이 정한 기본값을 이 품목만 다르게 합니다.'
    + ' 사유를 남기는 이유는 안전재고 수동 조정과 같습니다 — 근거 없는 예외는'
    + ' "왜 이 자재만 손으로 넣나" 를 아무도 설명하지 못하게 만듭니다.</div>'
    + '<label class="fl"><span>품번</span><input type="text" id="polpid" placeholder="예) V01010001"></label>'
    + '<label class="fl"><span>적용할 정책</span><select id="polsel">' + opts + '</select></label>'
    + '<label class="fl"><span>사유 (5자 이상)</span><textarea id="polwhy"></textarea></label>'
    + '<label class="fl"><span>담당자</span><select id="polep">'
    +   APPRS.map(w => '<option value="' + w.EP_ID + '">' + esc(w.Name) + ' ' + esc(w.Position)
        + '</option>').join('') + '</select></label>';
  document.getElementById('ovf').innerHTML =
      '<button class="btn" onclick="closeOv()">취소</button>'
    + '<button class="btn btnp" onclick="savePol()">예외 걸기</button>';
  document.getElementById('ovl').classList.add('on');
}
async function savePol(){
  const d = await post('/api/plan/policy', {
    P_ID: document.getElementById('polpid').value,
    policy: document.getElementById('polsel').value,
    reason: document.getElementById('polwhy').value,
    EP_ID: document.getElementById('polep').value});
  if(!d.ok){ alertOv('걸지 못했습니다', (d.errors || []).join('\n')); return; }
  closeOv(); alertOv('예외를 걸었습니다', '', reload);
}
async function clearPol(pid){
  const ep = (APPRS[0] || {}).EP_ID;
  const d = await post('/api/plan/policy', {P_ID: pid, clear: true, EP_ID: ep});
  if(!d.ok){ alertOv('거두지 못했습니다', (d.errors || []).join('\n')); return; }
  alertOv('예외를 거뒀습니다', pid + ' 는 다시 등급 기본값을 따릅니다.', reload);
}

// 브라우저 alert 은 iframe 안에서 막히면 아무 일도 안 일어난 것처럼 보인다
function alertOv(title, msg, after){
  document.getElementById('ovt').textContent = title;
  document.getElementById('ovc').innerHTML = '<div class="mnote" style="white-space:pre-line">'
    + esc(msg) + '</div>';
  document.getElementById('ovf').innerHTML =
    '<button class="btn btnp" onclick="closeOv(' + (after ? 'true' : '') + ')">확인</button>';
  document.getElementById('ovl').classList.add('on');
  closeOv.after = after || null;
}
function closeOv(run){
  document.getElementById('ovl').classList.remove('on');
  if(run && closeOv.after){ const f = closeOv.after; closeOv.after = null; f(); }
}
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeOv(); });
document.getElementById('ovl').addEventListener('click', e => {
  if(e.target.id === 'ovl') closeOv(); });

kpi(); draw();
</script>
