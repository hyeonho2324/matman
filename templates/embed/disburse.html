<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>불출 처리</title>
<link rel="stylesheet" href="/static/vendor/tabler-icons.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--s0:#F8F7F4;--s1:#EFEEEA;--s2:#E5E4DF;--border:#D4D3CE;--border-s:#B8B7B2;--acc:#2a78d6;--ok:#1D9E75;--wn:#EF9F27;--dn:#E24B4A;--txt:#1A1917;--txt2:#4A4946;--txt3:#898781;--r:6px;--bg-ok:rgba(29,158,117,.1);--bg-wn:rgba(239,159,39,.1);--bg-dn:rgba(224,75,74,.1);--bg-ac:rgba(42,120,214,.09)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;font-size:13px;color:var(--txt);background:var(--s0);height:100vh;display:flex;flex-direction:column;overflow:hidden}
.wrap{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:44px;background:var(--s1);border-bottom:0.5px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:8px;flex-shrink:0}
.pt{font-size:14px;font-weight:500;flex:1;display:flex;align-items:center;gap:6px}
.tag{font-size:10px;color:var(--txt3);font-weight:400}
.ro{padding:7px 14px;background:var(--bg-ac);border-bottom:0.5px solid var(--border);font-size:10px;color:#185FA5;line-height:1.6;flex-shrink:0}
.main{flex:1;display:flex;overflow:hidden;min-height:0}
.left{width:320px;border-right:0.5px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;background:var(--s1)}
.lh{padding:8px 12px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;gap:5px;font-size:11px;font-weight:500}
.srch{padding:6px 10px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;gap:5px;background:var(--s0)}
.srch input{border:none;outline:none;background:transparent;font-size:11px;font-family:inherit;flex:1;color:var(--txt)}
.llist{flex:1;overflow-y:auto}
.it{padding:8px 12px;border-bottom:0.5px solid var(--border);cursor:pointer}
.it:hover{background:var(--s2)}
.it.on{background:var(--bg-ac);border-left:3px solid var(--acc);padding-left:9px}
.it-h{display:flex;align-items:center;gap:5px}
.pid{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--acc);font-weight:500}
.it-n{font-size:11px;margin-top:2px}
.it-s{font-size:10px;color:var(--txt3);margin-top:1px}
.right{flex:1;overflow-y:auto;padding:14px;min-width:0}
.qtybar{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--s1);border:0.5px solid var(--border);border-radius:8px;margin-bottom:14px;flex-wrap:wrap}
.qtybar label{font-size:11px;font-weight:500}
input[type=range]{accent-color:var(--acc);width:220px;height:18px}
.qv{font-size:17px;font-weight:700;color:var(--acc);min-width:64px;text-align:right}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.card{background:var(--s0);border:0.5px solid var(--border);border-radius:8px;padding:10px 12px}
.c-l{font-size:10px;color:var(--txt3);margin-bottom:4px;display:flex;align-items:center;gap:4px}
.c-v{font-size:19px;font-weight:600;line-height:1.1}
.c-v small{font-size:11px;font-weight:400;color:var(--txt3)}
.c-s{font-size:10px;color:var(--txt3);margin-top:3px}
.c-v.ok{color:var(--ok)}.c-v.dn{color:var(--dn)}.c-v.wn{color:var(--wn)}
.sec{background:var(--s0);border:0.5px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:14px}
.sech{padding:8px 12px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;gap:6px;background:var(--s1)}
.sech-t{font-size:12px;font-weight:500;flex:1}
.sech-m{font-size:10px;color:var(--txt3)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:var(--s1);padding:6px 10px;text-align:left;font-weight:500;font-size:10px;color:var(--txt3);border-bottom:0.5px solid var(--border);white-space:nowrap}
td{padding:6px 10px;border-bottom:0.5px solid var(--border);white-space:nowrap}
tr:last-child td{border-bottom:none}
tr.use{background:var(--bg-ac)}
.num{text-align:right}
.lotid{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px}
.fifo{width:17px;height:17px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;background:var(--s2);color:var(--txt3)}
.fifo.on{background:var(--ok);color:#fff}
.bg{display:inline-flex;align-items:center;gap:3px;padding:1px 6px;border-radius:99px;font-size:9px;font-weight:500}
.bac{background:var(--bg-ac);color:#185FA5}.bmu{background:var(--s2);color:var(--txt3);border:0.5px solid var(--border)}
.bok{background:var(--bg-ok);color:#1D6E52}.bdn{background:var(--bg-dn);color:#9B1C1C}
.gr{display:inline-block;width:16px;height:16px;line-height:16px;text-align:center;border-radius:4px;font-size:9px;font-weight:600}
.grA{background:var(--bg-dn);color:#9B1C1C}.grB{background:var(--bg-wn);color:#854F0B}.grC{background:var(--bg-ok);color:#1D6E52}
.note{font-size:10px;color:var(--txt3);line-height:1.6;padding:8px 12px}
.alert{padding:9px 12px;border-radius:8px;font-size:11px;line-height:1.7;margin-bottom:14px;border:0.5px solid}
.a-ok{background:var(--bg-ok);border-color:rgba(29,158,117,.3);color:#1D6E52}
.a-wn{background:var(--bg-wn);border-color:rgba(239,159,39,.3);color:#854F0B}
.a-dn{background:var(--bg-dn);border-color:rgba(224,75,74,.3);color:#9B1C1C}
.actbar{display:flex;align-items:center;gap:7px;width:100%;margin-top:9px;padding-top:9px;border-top:0.5px solid var(--border);flex-wrap:wrap}
.actbar label{font-size:11px;font-weight:500}
.sel{font-family:inherit;font-size:11px;padding:4px 7px;border:0.5px solid var(--border-s);border-radius:var(--r);background:var(--s0);color:var(--txt);outline:none}
.btn{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:var(--r);font-size:12px;cursor:pointer;border:0.5px solid var(--border-s);background:transparent;color:var(--txt);font-family:inherit;white-space:nowrap}
.btn:hover{background:var(--s2)}
.btnp{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:500;margin-left:auto}
.btnp:hover{background:#2168bd}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:disabled:hover{background:transparent}
.btnp:disabled:hover{background:var(--acc)}
.ovl{position:fixed;inset:0;background:rgba(26,25,23,.42);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.mdl{background:var(--s0);border:0.5px solid var(--border-s);border-radius:10px;width:100%;max-width:560px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.mdh{padding:11px 14px;border-bottom:0.5px solid var(--border);background:var(--s1);display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;flex-shrink:0}
.mdb{padding:14px;overflow-y:auto}
.mdf{padding:10px 14px;border-top:0.5px solid var(--border);background:var(--s1);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0}
.dl{display:grid;grid-template-columns:76px 1fr;gap:5px 10px;font-size:11px;margin-bottom:12px}
.dl dt{color:var(--txt3)}
.dl dd{font-weight:500}
.tid{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;color:var(--acc)}
.tabs{display:flex;border-bottom:0.5px solid var(--border);background:var(--s1);flex-shrink:0}
.tab{flex:1;padding:7px 8px;font-size:11px;text-align:center;cursor:pointer;color:var(--txt3);border-bottom:2px solid transparent}
.tab:hover{background:var(--s2)}
.tab.on{color:var(--acc);border-bottom-color:var(--acc);font-weight:500;background:var(--s0)}
.tab .n{font-size:9px;opacity:.75;margin-left:3px}
.empty{padding:26px 16px;text-align:center;color:var(--txt3);font-size:11px;line-height:1.8}
.ck{width:15px;height:15px;accent-color:var(--acc);cursor:pointer}
.ck:disabled{cursor:not-allowed;opacity:.45}
.qin{width:84px;font-family:inherit;font-size:11px;padding:3px 6px;border:0.5px solid var(--border-s);border-radius:var(--r);background:var(--s0);color:var(--txt);outline:none;text-align:right}
.qin:focus{border-color:var(--acc)}
.qin:disabled{opacity:.45;background:var(--s2)}
tr.off{opacity:.55}
.sub{font-size:9px;color:var(--txt3);margin-top:1px}
.bar{height:5px;background:var(--s2);border-radius:99px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--ok)}
.rid{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--acc);font-weight:500}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.card{background:var(--s0);border:0.5px solid var(--border);border-radius:8px;padding:10px 12px}
.c-l{font-size:10px;color:var(--txt3);margin-bottom:4px;display:flex;align-items:center;gap:4px}
.c-v{font-size:19px;font-weight:600;line-height:1.1}
.c-v small{font-size:11px;font-weight:400;color:var(--txt3)}
.c-s{font-size:10px;color:var(--txt3);margin-top:3px}
.c-v.ok{color:var(--ok)}.c-v.dn{color:var(--dn)}.c-v.wn{color:var(--wn)}
.a-ac{background:var(--bg-ac);border-color:rgba(42,120,214,.3);color:#185FA5}
@media(max-width:900px){
  .kpi-row{grid-template-columns:repeat(2,1fr)}
  .main{flex-direction:column}
  .left{width:100%;max-height:34%;border-right:none;border-bottom:0.5px solid var(--border-s)}
  input[type=range]{width:150px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="pt"><i class="ti ti-arrow-bar-up" style="color:var(--wn)"></i>불출 처리
      <span class="tag">실제 DB · FIFO 자동 지정 · 잔여 LOT 기준</span></div>
  </div>
  <div class="ro">
    <i class="ti ti-info-circle"></i>
    <b>요청 불출</b> 탭에서 요청서를 고르면 <b>품목 전체를 체크박스로 골라 한 번에</b> 내보냅니다.
    재고가 모자란 품목은 가능한 만큼만, 재고가 0인 품목은 체크가 막힙니다.
    요청 없이 낼 때는 <b>직접 불출</b> 탭을 쓰세요. 배분은 언제나 <b>FIFO</b>로 계산됩니다.
  </div>
  <div class="main">
    <div class="left">
      <div class="tabs">
        <div class="tab" id="tab-req" onclick="setMode('req')">요청 불출<span class="n" id="n-req"></span></div>
        <div class="tab" id="tab-direct" onclick="setMode('direct')">직접 불출<span class="n" id="n-direct"></span></div>
      </div>
      <div class="lh"><i class="ti" id="lh-i"></i><span id="lh-t"></span>
        <span id="cnt" style="margin-left:auto;font-weight:400;color:var(--txt3)"></span></div>
      <div class="srch"><i class="ti ti-search" style="font-size:12px;color:var(--txt3)"></i>
        <input id="q" placeholder="검색" oninput="drawList()"></div>
      <div class="llist" id="list"></div>
    </div>
    <div class="right" id="right"></div>
  </div>
</div>
<script>
const ITEMS = {{ disburse|tojson }};
const LOTS  = {{ scan_lots|tojson }};
const WORKERS = {{ workers|tojson }};
// 생산에서 올라온 불출 요청 (미완료분). 고르면 그 자재·잔여수량이 채워진다.
const OPEN_REQS = {{ open_reqs|tojson }};
let mode = 'req';           // 'req' = 요청 일괄 불출 · 'direct' = 요청 없는 단건 불출
let selReq = null;          // 선택된 요청서
let B = {};                 // 요청 라인별 {on, qty}
let sel = ITEMS.length ? ITEMS[0].P_ID : null;
// 로그인이 없으므로 불출 담당자를 화면에서 고른다
let who = WORKERS.length ? WORKERS[0].EP_ID : '';
let busy = false;
const nf  = n => (n==null ? '-' : Math.round(Number(n)).toLocaleString());
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// 자재별 잔여 LOT (FIFO 순)
const byPid = {};
LOTS.forEach(function(l){
  if(l.remain > 0) (byPid[l.P_ID] = byPid[l.P_ID] || []).push(l);
});
Object.keys(byPid).forEach(function(k){
  byPid[k].sort(function(a,b){ return a.Lot_Date < b.Lot_Date ? -1 : 1; });
});

function setMode(m){
  mode = m;
  document.getElementById('q').value = '';
  if(m === 'req'){
    selReq = OPEN_REQS.length ? OPEN_REQS[0].Req_ID : null;
    drawList();
    if(selReq) pickReq(selReq);
    else document.getElementById('right').innerHTML =
      '<div class="empty"><i class="ti ti-clipboard-off" style="font-size:22px;display:block;margin-bottom:8px"></i>'
      + '처리할 불출 요청이 없습니다.<br>불출 요청 화면에서 요청을 등록하면 여기에 나타납니다.<br>'
      + '요청 없이 내보내려면 <b>직접 불출</b> 탭을 쓰세요.</div>';
  }else{
    drawList();
    if(sel) pick(sel);
  }
}

function drawList(){
  const nReq = OPEN_REQS.length;
  document.getElementById('n-req').textContent    = nReq;
  document.getElementById('n-direct').textContent = ITEMS.length;
  document.getElementById('tab-req').className    = 'tab' + (mode==='req'    ? ' on' : '');
  document.getElementById('tab-direct').className = 'tab' + (mode==='direct' ? ' on' : '');
  document.getElementById('lh-i').className = 'ti ' + (mode==='req' ? 'ti-clipboard-list' : 'ti-package');
  document.getElementById('lh-t').textContent = mode==='req' ? '불출 요청' : '불출 가능 자재';
  document.getElementById('q').placeholder = mode==='req' ? '요청번호 · 작업지시 · 완제품' : '품번 · 품명';

  const q = (document.getElementById('q').value||'').trim().toLowerCase();
  if(mode === 'req'){
    const rows = OPEN_REQS.filter(function(r){
      return !q || (r.Req_ID+' '+(r.Work_Order||'')+' '+(r.FG_N||'')).toLowerCase().indexOf(q)>=0; });
    document.getElementById('cnt').textContent = rows.length + '건';
    document.getElementById('list').innerHTML = rows.length ? rows.map(function(r){
      const cls = r.Status==='일부불출' ? 'bwn' : 'bac';
      return '<div class="it ' + (selReq===r.Req_ID?'on':'') + '" data-id="' + r.Req_ID
        + '" onclick="pickReq(this.dataset.id)">'
        + '<div class="it-h"><span class="rid">' + r.Req_ID + '</span>'
        +   '<span class="bg ' + cls + '">' + r.Status + '</span></div>'
        + '<div class="it-n">' + esc(r.FG_N||'-') + ' ' + nf(r.Plan_Qty) + '대</div>'
        + '<div class="it-s">' + r.Req_Date + ' · ' + r.line_cnt + '품목 · 잔여 ' + nf(r.left_qty) + '개'
        +   (r.cut_cnt ? ' · 승인 조정 ' + r.cut_cnt : '')
        +   (r.short_cnt ? ' · <span style="color:#9B1C1C">부족 ' + r.short_cnt + '</span>' : '') + '</div>'
        + '<div class="bar"><i style="width:' + (r.pct||0) + '%"></i></div>'
        + '</div>';
    }).join('') : '<div class="empty">해당 요청이 없습니다.</div>';
    return;
  }
  const r = ITEMS.filter(function(x){
    if(!q) return true;
    return (x.P_ID+' '+(x.P_N||'')+' '+(x.Spec||'')).toLowerCase().indexOf(q)>=0;
  });
  document.getElementById('cnt').textContent = r.length + '종';
  document.getElementById('list').innerHTML = r.map(function(x){
    return '<div class="it ' + (sel===x.P_ID?'on':'') + '" data-id="' + x.P_ID
      + '" onclick="pick(this.dataset.id)">'
      + '<div class="it-h"><span class="pid">' + x.P_ID + '</span>'
      +   (x.grade ? '<span class="gr gr'+x.grade+'">'+x.grade+'</span>' : '') + '</div>'
      + '<div class="it-n">' + esc(x.P_N) + '</div>'
      + '<div class="it-s">재고 ' + nf(x.stock) + ' · LOT ' + x.lot_n + '개 · ' + esc(x.loc_name||'-') + '</div>'
      + '</div>';
  }).join('');
}

function pick(pid){ sel = pid; drawList(); draw(true); }

function draw(resetQty){
  const it = ITEMS.filter(function(x){return x.P_ID===sel;})[0];
  if(!it) return;
  const lots = byPid[sel] || [];
  const r = document.getElementById('right');

  if(resetQty){
    r.innerHTML = '<div class="qtybar"><label>불출 수량</label>'
      + '<input type="range" id="qty" min="0" max="' + it.stock + '" value="'
      + Math.min(Math.max(Math.round(it.stock*0.3),1), it.stock) + '" oninput="draw(false)">'
      + '<span class="qv" id="qv">0</span><span style="font-size:11px;color:var(--txt3)">개</span>'
      + '<span style="font-size:10px;color:var(--txt3);margin-left:auto">보유 ' + nf(it.stock)
      + '개 · LOT ' + lots.length + '개</span>'
      + '<div class="actbar"><label>담당자</label>'
      +   '<select class="sel" onchange="setWho(this.value)">'
      +     WORKERS.map(function(w){
              return '<option value="' + w.EP_ID + '"' + (who===w.EP_ID ? ' selected' : '') + '>'
                + esc(w.Name) + ' ' + esc(w.Position||'') + '</option>';
            }).join('')
      +   '</select>'
      +   '<button class="btn btnp" id="go" onclick="openConfirm()">'
      +     '<i class="ti ti-arrow-bar-up"></i>불출 등록</button>'
      + '</div></div><div id="out"></div>';
  }
  const qty = +document.getElementById('qty').value;
  document.getElementById('qv').textContent = nf(qty);

  // FIFO 배분
  let left = qty; const alloc = [];
  for(let i=0;i<lots.length && left>0;i++){
    const take = Math.min(left, lots[i].remain);
    alloc.push({l:lots[i], take:take, idx:alloc.length+1});
    left -= take;
  }
  const after = it.stock - (qty - left);
  const belowSafe = it.safe_qty && after < it.safe_qty;

  let msg, cls;
  if(qty<=0){ cls='a-wn'; msg='불출 수량을 지정하세요.'; }
  else if(left>0){ cls='a-dn'; msg='재고가 <b>' + nf(left) + '개 부족</b>합니다. 보유 ' + nf(it.stock) + '개 전량을 꺼내도 모자랍니다.'; }
  else if(belowSafe){ cls='a-wn'; msg='불출 후 재고 <b>' + nf(after) + '개</b>로 안전재고 ' + nf(it.safe_qty) + '개 <b>아래</b>가 됩니다. 발주를 검토하세요.'; }
  else { cls='a-ok'; msg='LOT ' + alloc.length + '개에서 불출 가능합니다. 불출 후 재고 ' + nf(after) + '개로 안전재고를 유지합니다.'; }

  document.getElementById('out').innerHTML =
    '<div class="alert ' + cls + '"><i class="ti ti-info-circle"></i> ' + msg + '</div>'
  + '<div class="kpi-row">'
  +   '<div class="card"><div class="c-l"><i class="ti ti-stack-2"></i>현재고</div>'
  +     '<div class="c-v">' + nf(it.stock) + '<small>개</small></div>'
  +     '<div class="c-s">LOT ' + lots.length + '개</div></div>'
  +   '<div class="card"><div class="c-l"><i class="ti ti-arrow-bar-up"></i>불출</div>'
  +     '<div class="c-v wn">' + nf(qty-left) + '<small>개</small></div>'
  +     '<div class="c-s">LOT ' + alloc.length + '개에서</div></div>'
  +   '<div class="card"><div class="c-l"><i class="ti ti-box"></i>불출 후 재고</div>'
  +     '<div class="c-v ' + (belowSafe?'dn':'ok') + '">' + nf(after) + '<small>개</small></div>'
  +     '<div class="c-s">안전재고 ' + nf(it.safe_qty) + '개</div></div>'

  +     '<div class="c-v ' + (left?'dn':'ok') + '">' + nf(left) + '<small>개</small></div>'
  +     '<div class="c-s">' + (left ? '재고 모자람' : '전량 가능') + '</div></div>'
  + '</div>'

  + '<div class="sec"><div class="sech"><i class="ti ti-arrows-sort"></i>'
  +   '<span class="sech-t">FIFO 불출 지시</span>'
  +   '<span class="sech-m">입고가 오래된 LOT부터 꺼냅니다</span></div>'
  +   '<table><thead><tr><th style="width:30px">순</th><th>LOT</th><th>입고일</th><th>창고</th>'
  +     '<th class="num">잔여</th><th class="num">불출</th><th class="num">남음</th></tr></thead><tbody>'
  +   lots.map(function(l){
        const a = alloc.filter(function(x){return x.l.Lot_ID===l.Lot_ID;})[0];
        return '<tr class="' + (a?'use':'') + '">'
          + '<td><span class="fifo ' + (a?'on':'') + '">' + (a ? a.idx : '·') + '</span></td>'
          + '<td><span class="lotid">' + l.Lot_ID + '</span></td>'
          + '<td>' + l.Lot_Date + '</td>'
          + '<td>' + esc(l.loc_name||'-') + '</td>'
          + '<td class="num">' + nf(l.remain) + '</td>'
          + '<td class="num">' + (a ? '<b style="color:var(--acc)">' + nf(a.take) + '</b>' : '-') + '</td>'
          + '<td class="num">' + nf(l.remain - (a?a.take:0)) + '</td></tr>';
      }).join('')
  +   '</tbody></table>'
  +   '<div class="note">선입선출(FIFO) — 오래된 LOT을 먼저 소진해 재고 노후화를 막습니다. '
  +     '한 LOT으로 부족하면 다음 LOT에서 이어 꺼냅니다.</div>'
  + '</div>';

  sync();
}

// ── 불출 등록 ────────────────────────────────────────────────
// FIFO 배분은 위에서 화면이 계산해 보여주지만, 등록할 때는 그 값을
// 서버로 보내지 않는다. 서버가 잔여 LOT 을 다시 읽어 처음부터 배분한다.
// 화면 계산을 그대로 믿으면 잔여보다 많이 꺼내는 요청을 막을 수 없다.
function disPayload(qty){ return {P_ID: sel, qty: qty, EP_ID: who}; }

function setWho(v){ who = v; if(mode==='req') drawReq(); else sync(); }

function sync(){
  const go = document.getElementById('go');
  if(!go) return;
  if(mode === 'req'){
    const r = reqOf(selReq);
    const on = r ? (r.items||[]).filter(function(i){
      return B[i.Req_num] && B[i.Req_num].on && B[i.Req_num].qty > 0; }) : [];
    go.disabled = busy || !who || !on.length;
    return;
  }
  const qe = document.getElementById('qty');
  const q  = qe ? +qe.value : 0;
  const it = ITEMS.filter(function(x){return x.P_ID===sel;})[0];
  go.disabled = busy || !who || q <= 0 || !it || q > it.stock;
}

function ovlClose(){
  const o = document.getElementById('ovl');
  if(o) o.remove();
}

function ovl(title, icon, bodyHtml, footHtml){
  ovlClose();
  const d = document.createElement('div');
  d.id = 'ovl'; d.className = 'ovl';
  d.innerHTML = '<div class="mdl"><div class="mdh"><i class="ti ' + icon + '"></i>' + title + '</div>'
    + '<div class="mdb">' + bodyHtml + '</div>'
    + '<div class="mdf">' + footHtml + '</div></div>';
  document.body.appendChild(d);
}

        + ' · 잔여 ' + nf(p.req.left_qty) + '개'

  + '</dl>'
  + (p.below_safe

      : '')
  + '<div class="sec"><div class="sech"><i class="ti ti-arrows-sort"></i>'
  +   '<span class="sech-t">LOT 배분 (서버 재계산)</span>'
  +   '<span class="sech-m">' + p.lot_cnt + '개 LOT</span></div>'
  +   '<table><thead><tr><th style="width:30px">순</th><th>LOT</th><th>입고일</th>'
  +     '<th class="num">불출</th><th class="num">남음</th>'
  +     (hasTid ? '<th>거래번호</th>' : '') + '</tr></thead><tbody>'
  +   p.alloc.map(function(a){
        return '<tr><td><span class="fifo on">' + a.seq + '</span></td>'
        + '<td><span class="lotid">' + a.Lot_ID + '</span></td>'
        + '<td>' + a.Lot_Date + '</td>'
        + '<td class="num"><b style="color:var(--acc)">' + nf(a.take) + '</b></td>'
        + '<td class="num">' + nf(a.after) + '</td>'

      }).join('')

}

function errBody(errs){
  return '<div class="alert a-dn"><i class="ti ti-alert-circle"></i> '
       + errs.map(esc).join('<br>') + '</div>';
}

const CLOSE_BTN = '<button class="btn" onclick="ovlClose()">닫기</button>';

// 1단계 — 서버에 미리보기를 요청해 배분을 확정한다
async function openConfirm(){
  if(busy) return;
  busy = true; sync();
  const qty = +document.getElementById('qty').value;
  ovl('불출 등록', 'ti-loader', '<div class="note">확인 중입니다...</div>', '');
  try{
    const r = await fetch('/api/disburse/preview', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(disPayload(qty))
    });
    const d = await r.json();
    if(d.ok && d.plan){
      ovl('불출 등록 확인', 'ti-arrow-bar-up', planBody(d.plan),
          '<button class="btn" onclick="ovlClose()">취소</button>'
        + '<button class="btn btnp" style="margin-left:0" onclick="doSubmit()">확정 등록</button>');
    }else{
      ovl('등록할 수 없습니다', 'ti-alert-circle', errBody(d.errors || ['알 수 없는 오류입니다.']), CLOSE_BTN);
    }
  }catch(e){
    ovl('통신 실패', 'ti-alert-circle', errBody(['서버와 통신하지 못했습니다: ' + e.message]), CLOSE_BTN);
  }
  busy = false; sync();
}

// 2단계 — 실제 등록
async function doSubmit(){
  if(busy) return;
  busy = true;
  const qty = +document.getElementById('qty').value;
  ovl('불출 등록', 'ti-loader', '<div class="note">등록 중입니다...</div>', '');
  try{
    const r = await fetch('/api/disburse', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(disPayload(qty))
    });
    const d = await r.json();
    if(d.ok && d.plan){
      ovl('불출 등록 완료', 'ti-circle-check',
          planBody(d.plan, '<div class="alert a-ok"><i class="ti ti-check"></i> LOT '
            + d.plan.lot_cnt + '개에서 ' + nf(d.plan.qty) + '개를 불출했습니다. '
            + '불출일 ' + d.plan.date + ' · 거래 ' + d.plan.lot_cnt + '건이 기록됐습니다.</div>'),
          '<button class="btn btnp" style="margin-left:0" onclick="location.reload()">확인</button>');
    }else{
      ovl('등록 실패', 'ti-alert-circle', errBody(d.errors || ['불출 등록에 실패했습니다.']), CLOSE_BTN);
    }
  }catch(e){
    ovl('통신 실패', 'ti-alert-circle', errBody(['서버와 통신하지 못했습니다: ' + e.message]), CLOSE_BTN);
  }
  busy = false; sync();
}


// ── 요청 불출 (일괄) ─────────────────────────────────────────
// 요청 한 건은 보통 자재 10~15종이다. 한 품목씩 열다섯 번 등록하게 하면
// 현장에서 쓸 수 없다. 요청서를 통째로 골라 체크한 것만 한 번에 내보낸다.
//
// 자재마다 사정이 다르다.
//   전량가능 — 요청 잔여만큼 재고가 있다 (기본 체크)
//   부분가능 — 재고가 모자라 있는 만큼만 (기본 체크, 수량은 재고까지)
//   불가     — 재고 0. 체크 자체가 막힌다. 발주가 먼저다
//   완료     — 이미 다 나갔다

function canOf(i){ return Math.min(i.left_qty, i.stock); }   // 이번에 낼 수 있는 최대치

function lineState(i){
  if(i.left_qty <= 0)           return {t:'완료',   c:'bok', pick:false};
  if(canOf(i) <= 0)             return {t:'불가',   c:'bdn', pick:false};
  if(canOf(i) < i.left_qty)     return {t:'부분가능', c:'bwn', pick:true};
  return {t:'전량가능', c:'bac', pick:true};
}

function reqOf(id){ return OPEN_REQS.filter(function(r){ return r.Req_ID===id; })[0]; }

function resetBatch(r){
  B = {};
  (r.items||[]).forEach(function(i){
    const st = lineState(i);
    B[i.Req_num] = {on: st.pick, qty: canOf(i)};      // 낼 수 있는 건 기본으로 체크
  });
}

function pickReq(id){
  selReq = id;
  const r = reqOf(id);
  if(r) resetBatch(r);
  drawList(); drawReq();
}

function toggleLine(num, on){ B[num].on = !!on; drawReq(); }
function setLineQty(num, v){
  const r = reqOf(selReq);
  const i = r.items.filter(function(x){ return x.Req_num == num; })[0];
  const n = parseInt(v, 10);
  B[num].qty = isNaN(n) ? 0 : Math.max(0, Math.min(n, canOf(i)));   // 낼 수 있는 한도를 넘기지 않는다
  drawReq();
}
function toggleAll(on){
  const r = reqOf(selReq);
  (r.items||[]).forEach(function(i){
    if(lineState(i).pick) B[i.Req_num].on = !!on;
  });
  drawReq();
}

function drawReq(){
  const r = reqOf(selReq);
  if(!r) return;
  const items = r.items || [];
  const pickable = items.filter(function(i){ return lineState(i).pick; });
  const on = items.filter(function(i){ return B[i.Req_num] && B[i.Req_num].on && B[i.Req_num].qty > 0; });
  const totQty = on.reduce(function(a,i){ return a + B[i.Req_num].qty; }, 0);
  const totAmt = on.reduce(function(a,i){ return a + B[i.Req_num].qty * (i.P_Price||0); }, 0);
  const blocked = items.filter(function(i){ return i.left_qty > 0 && canOf(i) <= 0; }).length;
  const partial = on.filter(function(i){ return B[i.Req_num].qty < i.left_qty; }).length;

  document.getElementById('right').innerHTML =
    '<div class="alert a-ac"><i class="ti ti-clipboard-list"></i> '
  +   '<b>' + r.Req_ID + '</b> · ' + esc(r.FG_N||'-') + ' ' + nf(r.Plan_Qty) + '대 · '
  +   '작업지시 ' + esc(r.Work_Order||'-') + ' · ' + r.Req_Date + ' · '
  +   esc(r.worker||'-') + ' 요청 · 진행률 <b>' + (r.pct||0) + '%</b>'
  +   (r.Note ? '<br>메모: ' + esc(r.Note) : '')
  + '</div>'

  + '<div class="kpi-row">'
  +   '<div class="card"><div class="c-l"><i class="ti ti-checkbox"></i>선택</div>'
  +     '<div class="c-v">' + on.length + '<small>/' + items.length + '</small></div>'
  +     '<div class="c-s">' + (partial ? '부분 ' + partial + '종 포함' : '선택분 전량') + '</div></div>'
  +   '<div class="card"><div class="c-l"><i class="ti ti-stack-2"></i>불출 수량</div>'
  +     '<div class="c-v">' + nf(totQty) + '<small>개</small></div>'
  +     '<div class="c-s">' + nf(totAmt) + '원</div></div>'
  +   '<div class="card"><div class="c-l"><i class="ti ti-ban"></i>불출 불가</div>'
  +     '<div class="c-v ' + (blocked?'dn':'ok') + '">' + blocked + '<small>종</small></div>'
  +     '<div class="c-s">' + (blocked ? '재고 0 · 발주 필요' : '없음') + '</div></div>'
  +   '<div class="card"><div class="c-l"><i class="ti ti-progress"></i>요청 잔여</div>'
  +     '<div class="c-v">' + nf(r.left_qty) + '<small>개</small></div>'
  +     '<div class="c-s">' + (r.cut_cnt ? '승인 ' + nf(r.eff_qty) + ' (요청 ' + nf(r.req_qty) + ')'
                                            : '요청 ' + nf(r.req_qty))
  +       ' · 불출 ' + nf(r.done_qty) + '</div></div>'
  + '</div>'

  + '<div class="actbar"><label>담당자</label>'
  +   '<select class="sel" onchange="setWho(this.value)">'
  +     WORKERS.map(function(w){
        return '<option value="' + w.EP_ID + '"' + (who===w.EP_ID?' selected':'') + '>'
          + esc(w.Name) + ' ' + esc(w.Position||'') + '</option>'; }).join('')
  +   '</select>'
  +   '<button class="btn" onclick="toggleAll(true)"><i class="ti ti-checks"></i>가능한 것 전체</button>'
  +   '<button class="btn" onclick="toggleAll(false)">전체 해제</button>'
  +   '<button class="btn btnp" id="go" onclick="openBatchConfirm()">'
  +     '<i class="ti ti-arrow-bar-up"></i>선택 ' + on.length + '건 불출</button>'
  + '</div>'

  + '<div class="sec"><div class="sech"><i class="ti ti-list-check"></i>'
  +   '<span class="sech-t">요청 품목</span>'
  +   '<span class="sech-m">체크한 품목만 불출됩니다 · 수량은 재고 한도까지 조절할 수 있습니다</span></div>'
  +   '<table><thead><tr><th style="width:30px"></th><th>자재</th><th class="num">승인</th>'
  +     '<th class="num">불출</th><th class="num">잔여</th><th class="num">현재고</th>'
  +     '<th class="num">이번 불출</th><th>상태</th></tr></thead><tbody>'
  +   items.map(function(i){
      const st = lineState(i);
      const b  = B[i.Req_num] || {on:false, qty:0};
      const can = canOf(i);
      return '<tr class="' + (st.pick && b.on ? 'use' : (st.pick ? '' : 'off')) + '">'
        + '<td><input class="ck" type="checkbox"' + (b.on?' checked':'') + (st.pick?'':' disabled')
        +   ' data-num="' + i.Req_num + '" onchange="toggleLine(this.dataset.num, this.checked)"></td>'
        + '<td><span class="pid">' + i.P_ID + '</span>'
        +   (i.grade ? ' <span class="gr gr' + i.grade + '">' + i.grade + '</span>' : '')
        +   '<div class="sub">' + esc((i.P_N||'').slice(0,16)) + '</div></td>'
        + '<td class="num">' + nf(i.eff_qty)
        +   (i.cut ? '<div class="sub">요청 ' + nf(i.Req_Qty) + '</div>' : '') + '</td>'
        + '<td class="num">' + nf(i.Done_Qty) + '</td>'
        + '<td class="num"><b>' + nf(i.left_qty) + '</b></td>'
        + '<td class="num">' + nf(i.stock) + '</td>'
        + '<td class="num">'
        +   (st.pick
              ? '<input class="qin" type="number" min="0" max="' + can + '" value="' + b.qty
                + '" data-num="' + i.Req_num + '" onchange="setLineQty(this.dataset.num, this.value)"'
                + (b.on ? '' : ' disabled') + '>'
              : '-')
        +   '</td>'
        + '<td><span class="bg ' + st.c + '">' + st.t + '</span>'
        +   (st.t === '부분가능' ? '<div class="sub">재고까지만 · 잔여 ' + nf(i.left_qty - can) + '개 남음</div>' : '')
        +   '</td>'
        + '</tr>';
    }).join('')
  +   '</tbody></table>'
  +   '<div class="note">체크한 품목은 <b>FIFO 로 각각 배분</b>되어 한 번에 기록됩니다. '
  +     '한 건이라도 실패하면 전부 취소되므로, 화면에 보인 것과 실제 결과가 달라지지 않습니다. '
  +     '재고가 0인 품목은 체크할 수 없습니다 — 발주가 먼저입니다.</div>'
  + '</div>';

  sync();
}

function batchPayload(){
  const r = reqOf(selReq);
  const lines = [];
  (r.items||[]).forEach(function(i){
    const b = B[i.Req_num];
    if(b && b.on && b.qty > 0)
      lines.push({P_ID: i.P_ID, qty: b.qty,
                  req: {Req_ID: r.Req_ID, Req_num: i.Req_num}});
  });
  return {lines: lines, EP_ID: who};
}

function batchBody(p, note){

  + '<div class="sec"><div class="sech"><i class="ti ti-arrows-sort"></i>'

  +   '<span class="sech-m">' + p.line_cnt + '품목 / LOT ' + p.lot_cnt + '개</span></div>'

  +     (hasTid ? '<th>거래번호</th>' : '') + '</tr></thead><tbody>'
  +   p.items.map(function(it){
      return '<tr><td><span class="pid">' + it.P_ID + '</span>'
        + '<div class="sub">' + esc((it.P_N||'').slice(0,14)) + '</div></td>'
        + '<td class="num"><b style="color:var(--acc)">' + nf(it.qty) + '</b>'
        +   '<div class="sub">잔여 ' + nf(it.after) + '</div></td>'

              return '<div class="sub"><span class="lotid">' + a.Lot_ID + '</span> ' + nf(a.take) + '개</div>';
            }).join('') + '</td>'
        + (hasTid ? '<td>' + it.alloc.map(function(a){
              return '<div class="sub"><span class="tid">' + (a.T_ID||'') + '</span></div>'; }).join('') + '</td>' : '')
        + '</tr>';
    }).join('')
  +   '</tbody></table></div>';
}

async function openBatchConfirm(){
  if(busy) return;
  busy = true; sync();
  ovl('일괄 불출', 'ti-loader', '<div class="note">확인 중입니다...</div>', '');
  try{
    const r = await fetch('/api/disburse/batch/preview', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(batchPayload())});
    const d = await r.json();
    if(d.ok && d.plan){
      ovl('일괄 불출 확인', 'ti-arrow-bar-up', batchBody(d.plan),
          '<button class="btn" onclick="ovlClose()">취소</button>'
        + '<button class="btn btnp" style="margin-left:0" onclick="doBatchSubmit()">확정 등록</button>');
    }else{
      ovl('등록할 수 없습니다', 'ti-alert-circle', errBody(d.errors || ['알 수 없는 오류입니다.']), CLOSE_BTN);
    }
  }catch(e){
    ovl('통신 실패', 'ti-alert-circle', errBody(['서버와 통신하지 못했습니다: ' + e.message]), CLOSE_BTN);
  }
  busy = false; sync();
}

async function doBatchSubmit(){
  if(busy) return;
  busy = true;
  ovl('일괄 불출', 'ti-loader', '<div class="note">등록 중입니다...</div>', '');
  try{
    const r = await fetch('/api/disburse/batch', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(batchPayload())});
    const d = await r.json();
    if(d.ok && d.plan){
      ovl('일괄 불출 완료', 'ti-circle-check',
          batchBody(d.plan, '<div class="alert a-ok"><i class="ti ti-check"></i> '
            + d.plan.line_cnt + '품목 ' + nf(d.plan.qty) + '개를 불출했습니다. '
            + '불출일 ' + d.plan.date + ' · LOT ' + d.plan.lot_cnt + '개에서 나갔습니다.</div>'),
          '<button class="btn btnp" style="margin-left:0" onclick="location.reload()">확인</button>');
    }else{
      ovl('등록 실패', 'ti-alert-circle', errBody(d.errors || ['일괄 불출에 실패했습니다.']), CLOSE_BTN);
    }
  }catch(e){
    ovl('통신 실패', 'ti-alert-circle', errBody(['서버와 통신하지 못했습니다: ' + e.message]), CLOSE_BTN);
  }
  busy = false; sync();
}

// 처리할 요청이 있으면 요청 탭부터, 없으면 직접 불출 탭부터 연다
setMode(OPEN_REQS.length ? 'req' : 'direct');
</script>
