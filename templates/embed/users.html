<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>사용자 관리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.14.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;font-size:13px;color:#1A1917;background:#F8F7F4;height:100vh;display:flex;flex-direction:column;overflow:hidden}
:root{--s0:#F8F7F4;--s1:#EFEEEA;--s2:#E5E4DF;--border:#D4D3CE;--border-s:#B8B7B2;--acc:#2a78d6;--ok:#1D9E75;--wn:#EF9F27;--dn:#E24B4A;--txt:#1A1917;--txt2:#4A4946;--txt3:#898781;--r:6px;--bg-ok:rgba(29,158,117,.1);--bg-wn:rgba(239,159,39,.1);--bg-dn:rgba(224,75,74,.1);--bg-ac:rgba(42,120,214,.09)}
.wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;align-items:center;justify-content:center}
.inner{text-align:center;max-width:500px;padding:24px}
.icon{font-size:48px;margin-bottom:16px;color:var(--acc)}
.title{font-size:18px;font-weight:600;margin-bottom:8px}
.sub{font-size:13px;color:var(--txt3);line-height:1.7;margin-bottom:16px}
.features{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:left;margin-bottom:16px}
.feat{background:var(--s1);border:0.5px solid var(--border);border-radius:8px;padding:10px 12px}
.feat-icon{font-size:16px;margin-bottom:4px}
.feat-t{font-size:12px;font-weight:500}
.feat-s{font-size:11px;color:var(--txt3)}
.badge{display:inline-block;padding:4px 12px;background:var(--bg-ac);color:var(--acc);border-radius:99px;font-size:12px;font-weight:500}
</style>
</head>
<body>
<div class="wrap">
  <div class="inner">
    <div class="icon"><i class="ti ti-users"></i></div>
    <div class="title">사용자 관리</div>
    <div class="sub">자재팀 및 생산팀 30명의 계정, 권한, 담당 구역을 관리합니다.</div>
    <div class="features"><div class="feat"><div class="feat-icon"><i class="ti ti-history"></i></div><div class="feat-t">처리 이력</div><div class="feat-s">입고/불출/생산/발주 통계</div></div><div class="feat"><div class="feat-icon"><i class="ti ti-key"></i></div><div class="feat-t">권한 설정</div><div class="feat-s">8개 기능별 토글</div></div><div class="feat"><div class="feat-icon"><i class="ti ti-building-warehouse"></i></div><div class="feat-t">담당 구역</div><div class="feat-s">L01~F02 구역 배정</div></div><div class="feat"><div class="feat-icon"><i class="ti ti-lock"></i></div><div class="feat-t">계정 보안</div><div class="feat-s">잠금/비밀번호 관리</div></div></div>
    <div class="badge">✓ 구현 완료 · 인터랙티브</div>
  </div>
</div>
</body>
</html>
