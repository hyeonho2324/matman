<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>입고 처리</title>
<link rel="stylesheet" href="/static/vendor/tabler-icons.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--s0:#F8F7F4;--s1:#EFEEEA;--s2:#E5E4DF;--border:#D4D3CE;--border-s:#B8B7B2;--acc:#2a78d6;--ok:#1D9E75;--wn:#EF9F27;--dn:#E24B4A;--txt:#1A1917;--txt2:#4A4946;--txt3:#898781;--r:6px;--bg-ok:rgba(29,158,117,.1);--bg-wn:rgba(239,159,39,.1);--bg-dn:rgba(224,75,74,.1);--bg-ac:rgba(42,120,214,.09)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;font-size:13px;color:var(--txt);background:var(--s0);height:100vh;display:flex;flex-direction:column;overflow:hidden}
.wrap{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:44px;background:var(--s1);border-bottom:0.5px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:8px;flex-shrink:0}
.pt{font-size:14px;font-weight:500;flex:1;display:flex;align-items:center;gap:6px}
.tag{font-size:10px;color:var(--txt3);font-weight:400}
.ro{padding:7px 14px;background:var(--bg-ac);border-bottom:0.5px solid var(--border);font-size:10px;color:#185FA5;line-height:1.6;flex-shrink:0}
.main{flex:1;display:flex;overflow:hidden;min-height:0}
.left{width:330px;border-right:0.5px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;background:var(--s1)}
.lh{padding:9px 12px;border-bottom:0.5px solid var(--border);font-size:11px;font-weight:500;display:flex;align-items:center;gap:5px}
.llist{flex:1;overflow-y:auto}
.po{padding:9px 12px;border-bottom:0.5px solid var(--border);cursor:pointer}
.po:hover{background:var(--s2)}
.po.on{background:var(--bg-ac);border-left:3px solid var(--acc);padding-left:9px}
.po-h{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.hid{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--acc);font-weight:500}
.po-s{font-size:10px;color:var(--txt3);line-height:1.5}
.right{flex:1;overflow-y:auto;padding:14px;min-width:0}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.card{background:var(--s0);border:0.5px solid var(--border);border-radius:8px;padding:10px 12px}
.c-l{font-size:10px;color:var(--txt3);margin-bottom:4px;display:flex;align-items:center;gap:4px}
.c-v{font-size:19px;font-weight:600;line-height:1.1}
.c-v small{font-size:11px;font-weight:400;color:var(--txt3)}
.c-s{font-size:10px;color:var(--txt3);margin-top:3px}
.c-v.ok{color:var(--ok)}.c-v.dn{color:var(--dn)}
.sec{background:var(--s0);border:0.5px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:14px}
.sech{padding:8px 12px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;gap:6px;background:var(--s1)}
.sech-t{font-size:12px;font-weight:500;flex:1}
.sech-m{font-size:10px;color:var(--txt3)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:var(--s1);padding:6px 10px;text-align:left;font-weight:500;font-size:10px;color:var(--txt3);border-bottom:0.5px solid var(--border);white-space:nowrap}
td{padding:6px 10px;border-bottom:0.5px solid var(--border);white-space:nowrap}
tr:last-child td{border-bottom:none}
.num{text-align:right}
.pid{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--acc)}
.lotid{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px}
.bg{display:inline-flex;align-items:center;gap:3px;padding:1px 6px;border-radius:99px;font-size:9px;font-weight:500}
.bac{background:var(--bg-ac);color:#185FA5}.bmu{background:var(--s2);color:var(--txt3);border:0.5px solid var(--border)}
.bok{background:var(--bg-ok);color:#1D6E52}.bdn{background:var(--bg-dn);color:#9B1C1C}
.bwn{background:var(--bg-wn);color:#854F0B}
.fx{padding:9px 12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;line-height:1.8;color:var(--txt2);background:var(--s1);border-bottom:0.5px solid var(--border);white-space:pre-wrap}
.note{font-size:10px;color:var(--txt3);line-height:1.6;padding:8px 12px}
.flow{display:flex;align-items:center;padding:10px 12px;background:var(--s1);border-bottom:0.5px solid var(--border)}
.fs{flex:1;text-align:center}
.fd{width:22px;height:22px;border-radius:50%;margin:0 auto 4px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;background:var(--ok)}
.fl{font-size:9px;color:var(--txt3);line-height:1.4}
.fl b{display:block;color:var(--txt);font-size:10px}
.fline{height:1.5px;background:var(--ok);flex:0 0 20px;margin-bottom:20px}
.tabs{display:flex;border-bottom:0.5px solid var(--border);background:var(--s1);flex-shrink:0}
.tab{flex:1;padding:7px 8px;font-size:11px;text-align:center;cursor:pointer;color:var(--txt3);border-bottom:2px solid transparent}
.tab:hover{background:var(--s2)}
.tab.on{color:var(--acc);border-bottom-color:var(--acc);font-weight:500;background:var(--s0)}
.tab .n{font-size:9px;opacity:.75;margin-left:3px}
.empty{padding:22px 16px;text-align:center;color:var(--txt3);font-size:11px;line-height:1.8}
.alert{padding:9px 12px;border-radius:8px;font-size:11px;line-height:1.7;margin-bottom:14px;border:0.5px solid}
.a-ok{background:var(--bg-ok);border-color:rgba(29,158,117,.3);color:#1D6E52}
.a-wn{background:var(--bg-wn);border-color:rgba(239,159,39,.3);color:#854F0B}
.a-dn{background:var(--bg-dn);border-color:rgba(224,75,74,.3);color:#9B1C1C}
.a-ac{background:var(--bg-ac);border-color:rgba(42,120,214,.3);color:#185FA5}
.actbar{display:flex;align-items:center;gap:7px;padding:10px 12px;background:var(--s1);border:0.5px solid var(--border);border-radius:8px;margin-bottom:14px;flex-wrap:wrap}
.actbar label{font-size:11px;font-weight:500}
.wsel{font-family:inherit;font-size:11px;padding:4px 7px;border:0.5px solid var(--border-s);border-radius:var(--r);background:var(--s0);color:var(--txt);outline:none}
.qin{width:84px;font-family:inherit;font-size:11px;padding:3px 6px;border:0.5px solid var(--border-s);border-radius:var(--r);background:var(--s0);color:var(--txt);outline:none;text-align:right}
.qin:focus{border-color:var(--acc)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:var(--r);font-size:12px;cursor:pointer;border:0.5px solid var(--border-s);background:transparent;color:var(--txt);font-family:inherit;white-space:nowrap}
.btn:hover{background:var(--s2)}
.btnp{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:500;margin-left:auto}
.btnp:hover{background:#2168bd}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:disabled:hover{background:transparent}
.btnp:disabled:hover{background:var(--acc)}
.ovl{position:fixed;inset:0;background:rgba(26,25,23,.42);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.mdl{background:var(--s0);border:0.5px solid var(--border-s);border-radius:10px;width:100%;max-width:600px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.mdh{padding:11px 14px;border-bottom:0.5px solid var(--border);background:var(--s1);display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;flex-shrink:0}
.mdb{padding:14px;overflow-y:auto}
.mdf{padding:10px 14px;border-top:0.5px solid var(--border);background:var(--s1);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0}
.dl{display:grid;grid-template-columns:84px 1fr;gap:5px 10px;font-size:11px;margin-bottom:12px}
.dl dt{color:var(--txt3)}
.dl dd{font-weight:500}
.tid{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;color:var(--acc)}
.sub{font-size:9px;color:var(--txt3);margin-top:1px}
.sin{width:106px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;padding:3px 5px;border:0.5px solid var(--border-s);border-radius:var(--r);background:var(--s0);color:var(--acc);outline:none}
.sin:focus{border-color:var(--acc)}
.rin{flex:1;font-family:inherit;font-size:10px;padding:4px 7px;border:0.5px solid var(--border-s);border-radius:var(--r);background:var(--s0);color:var(--txt);outline:none;min-width:0}
.rin:focus{border-color:var(--acc)}
tr.swap{background:var(--bg-wn)}
tr.swap td{border-bottom-color:rgba(239,159,39,.35)}
.rrow{display:flex;align-items:center;gap:6px;padding:1px 0}
.rlab{font-size:10px;color:#854F0B;white-space:nowrap;font-weight:500}
.setl{display:flex;gap:0;border-bottom:0.5px solid var(--border)}
.samt{flex:1;padding:9px 12px;border-right:0.5px solid var(--border);display:flex;flex-direction:column;gap:2px}
.samt:last-child{border-right:none}
.samt span{font-size:10px;color:var(--txt3)}
.samt b{font-size:14px}
.samt.diff b.up{color:var(--dn)}
.samt.diff b.dn{color:var(--acc)}
.srow{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:0.5px solid var(--border);flex-wrap:wrap}
.srow label{font-size:11px;font-weight:500;width:56px;flex-shrink:0}
.schip{padding:3px 10px;font-size:11px}
.schip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:500}
.schip.on:hover{background:#2168bd}
b.up{color:var(--dn)}
b.dn{color:var(--acc)}
@media(max-width:900px){
  .kpi-row{grid-template-columns:repeat(2,1fr)}
  .main{flex-direction:column}
  .left{width:100%;max-height:34%;border-right:none;border-bottom:0.5px solid var(--border-s)}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="pt"><i class="ti ti-arrow-bar-to-down" style="color:var(--acc)"></i>입고 처리
      <span class="tag">실제 DB · 발주 → 입고 · LOT 생성 규칙</span></div>
  </div>
  <div class="ro">
    <i class="ti ti-info-circle"></i>
    <b>미입고</b> 탭에서 발주를 골라 실제 입고 수량을 넣으면 <b>LOT이 생성되고 재고가 늘어납니다.</b>
    <b>입고 완료</b> 탭은 이미 처리된 발주가 어떻게 입고·LOT 생성으로 이어졌는지 보여줍니다.
  </div>
  <div class="main">
    <div class="left">
      <div class="tabs">
        <div class="tab" id="tab-pending" onclick="setMode('pending')">미입고<span class="n" id="n-pending"></span></div>
        <div class="tab" id="tab-done" onclick="setMode('done')">입고 완료<span class="n" id="n-done"></span></div>
      </div>
      <div class="lh"><i class="ti ti-file-text"></i><span id="lh-t">최근 발주</span> <span id="cnt" style="margin-left:auto;font-weight:400;color:var(--txt3)"></span></div>
      <div class="llist" id="list"></div>
    </div>
    <div class="right" id="right"></div>
  </div>
</div>
<script>
const PO      = {{ recent_po|tojson }};
const DET     = {{ po_detail|tojson }};
const PENDING = {{ pending|tojson }};
const WORKERS = {{ workers|tojson }};
const SUBS    = {{ subs|tojson }};    // 대체 입고용 품목 목록
let mode = 'pending';                 // 'pending' = 입고 등록 · 'done' = 대조 조회
let sel  = null;
let L    = {};                        // 발주 순번별 {pid, qty, reason}
let settle = '';                      // 빈 값이면 차액 부호로 자동 선택
let settleNote = '';
// 로그인이 없으므로 입고 담당자를 화면에서 고른다
let who  = WORKERS.length ? WORKERS[0].EP_ID : '';
let busy = false;
const nf  = n => (n==null ? '-' : Math.round(Number(n)).toLocaleString());
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const won = n => n>=100000000 ? (n/100000000).toFixed(2)+'억' : (n>=10000 ? nf(n/10000)+'만' : nf(n));

function drawList(){
  document.getElementById('n-pending').textContent = PENDING.length;
  document.getElementById('n-done').textContent    = PO.length;
  document.getElementById('tab-pending').className  = 'tab' + (mode==='pending' ? ' on' : '');
  document.getElementById('tab-done').className     = 'tab' + (mode==='done'    ? ' on' : '');
  document.getElementById('lh-t').textContent = mode==='pending' ? '미입고 발주' : '최근 발주';

  const rows = (mode==='pending') ? PENDING : PO;
  document.getElementById('cnt').textContent = rows.length + '건';
  if(!rows.length){
    document.getElementById('list').innerHTML =
      '<div class="empty">' + (mode==='pending' ? '미입고 발주가 없습니다.' : '발주 이력이 없습니다.') + '</div>';
    return;
  }
  document.getElementById('list').innerHTML = rows.map(function(o){
    const lines = (mode==='pending') ? o.line_cnt : o.lines;
    const sub = (mode==='pending')
      ? '발주 ' + o.P_Date + ' · 예상 입고 ' + o.eta
      : '발주 ' + o.P_Date + (o.recv_date ? ' → 입고 ' + o.recv_date + ' (' + o.lead_days + '일)' : ' · 미입고');
    return '<div class="po ' + (sel===o.H_ID?'on':'') + '" data-hid="' + o.H_ID + '" onclick="pick(this.dataset.hid)">'
      + '<div class="po-h"><span class="hid">' + o.H_ID + '</span>'
      +   (o.is_foreign==='Y' ? '<span class="bg bac">해외</span>' : '')
      +   (mode==='pending' ? '<span class="bg bwn">미입고</span>' : '') + '</div>'
      + '<div class="po-s">' + esc(o.supplier||'-') + ' · ' + lines + '품목 · ' + won(o.amount) + '원<br>' + sub + '</div>'
      + '</div>';
  }).join('');
}

function pickDone(hid){
  const o = PO.filter(function(x){return x.H_ID===hid;})[0];
  if(!o) return;
  const ds = DET[hid] || [];
  const ok = ds.filter(function(d){return d.in_qty===d.ord_qty;}).length;
  const short = ds.filter(function(d){return d.in_qty!=null && d.in_qty<d.ord_qty;});

  document.getElementById('right').innerHTML =
    '<div class="kpi-row">'
  +   '<div class="card"><div class="c-l"><i class="ti ti-list"></i>발주 품목</div>'
  +     '<div class="c-v">' + ds.length + '<small>종</small></div>'
  +     '<div class="c-s">' + nf(o.qty) + '개 · ' + won(o.amount) + '원</div></div>'
  +   '<div class="card"><div class="c-l"><i class="ti ti-check"></i>수량 일치</div>'
  +     '<div class="c-v ok">' + ok + '<small>/' + ds.length + '</small></div>'
  +     '<div class="c-s">발주 = 입고</div></div>'
  +   '<div class="card"><div class="c-l"><i class="ti ti-alert-triangle"></i>부족 입고</div>'
  +     '<div class="c-v ' + (short.length?'dn':'') + '">' + short.length + '<small>종</small></div>'
  +     '<div class="c-s">' + (short.length ? '포장단위 배수' : '없음') + '</div></div>'
  +   '<div class="card"><div class="c-l"><i class="ti ti-clock"></i>리드타임</div>'
  +     '<div class="c-v">' + (o.lead_days!=null ? o.lead_days : '-') + '<small>일</small></div>'
  +     '<div class="c-s">' + o.P_Date + ' → ' + (o.recv_date||'-') + '</div></div>'
  + '</div>'

  + '<div class="sec"><div class="sech"><i class="ti ti-route"></i>'
  +   '<span class="sech-t">입고 처리 흐름</span><span class="sech-m">' + esc(o.supplier||'-') + '</span></div>'
  +   '<div class="flow">'
  +     '<div class="fs"><div class="fd"><i class="ti ti-file-text"></i></div>'
  +       '<div class="fl"><b>발주 등록</b>' + o.P_Date + '</div></div>'
  +     '<div class="fline"></div>'
  +     '<div class="fs"><div class="fd"><i class="ti ti-truck"></i></div>'
  +       '<div class="fl"><b>' + (o.lead_days!=null?o.lead_days+'일':'-') + '</b>리드타임</div></div>'
  +     '<div class="fline"></div>'
  +     '<div class="fs"><div class="fd"><i class="ti ti-package"></i></div>'
  +       '<div class="fl"><b>검수 · 수량확인</b>' + ds.length + '품목</div></div>'
  +     '<div class="fline"></div>'
  +     '<div class="fs"><div class="fd"><i class="ti ti-box"></i></div>'
  +       '<div class="fl"><b>LOT 생성</b>' + (o.recv_date||'-') + '</div></div>'
  +   '</div>'
  +   '<div class="fx">LOT 번호 규칙\n  LOT + 입고일(YYYYMMDD) + 당일순번(4자리)\n'
  +   '  예: ' + (ds.find(function(d){return d.Lot_ID;}) || {Lot_ID:'LOT202507030001'}).Lot_ID + '\n\n'
  +   '발주번호 규칙\n  PO + 발주일(YYYYMMDD) + 당일순번(4자리)\n  예: ' + o.H_ID + '</div>'
  + '</div>'

  + '<div class="sec"><div class="sech"><i class="ti ti-git-compare"></i>'
  +   '<span class="sech-t">품목별 발주 → 입고</span>'
  +   '<span class="sech-m">생성된 LOT 포함</span></div>'
  +   '<table><thead><tr><th>자재</th><th>품명</th><th class="num">발주</th><th class="num">입고</th>'
  +     '<th class="num">차이</th><th>생성 LOT</th><th>보관</th></tr></thead><tbody>'
  +   ds.map(function(d){
        const gap = d.in_qty==null ? null : d.in_qty - d.ord_qty;
        return '<tr><td><span class="pid">' + d.P_ID + '</span></td>'
          + '<td>' + esc((d.P_N||'').slice(0,12)) + '</td>'
          + '<td class="num">' + nf(d.ord_qty) + '</td>'
          + '<td class="num">' + (d.in_qty==null ? '-' : nf(d.in_qty)) + '</td>'
          + '<td class="num">' + (gap ? '<span class="bg bdn">' + nf(gap) + '</span>'
              + (d.PkgUnit ? '<div style="font-size:9px;color:var(--txt3)">포장 ' + d.PkgUnit + '×' + Math.abs(gap/d.PkgUnit) + '</div>' : '')
              : (gap===0 ? '<span class="bg bok">일치</span>' : '-')) + '</td>'
          + '<td><span class="lotid">' + (d.Lot_ID||'-') + '</span></td>'
          + '<td>' + esc(d.loc_name||'-') + '</td></tr>';
      }).join('')
  +   '</tbody></table>'
  +   (short.length
      ? '<div class="note">⚠️ 부족 입고 ' + short.length + '건. 부족분이 모두 <b>포장단위의 배수</b>다 — '
        + '상자 단위로 출하되므로 낱개 부족은 생기지 않습니다.</div>'
      : '<div class="note">발주 수량과 입고 수량이 전량 일치합니다.</div>')
  + '</div>';
}


// ── 입고 등록 ────────────────────────────────────────────────
// 실무에서 발주한 그대로 들어오는 일은 오히려 드물다.
// 수량이 모자라거나, 아예 다른 품번이 오거나(거래처 결품 → 호환품 대체),
// 그래서 금액이 어긋나면 잔금을 정산해야 한다. 셋을 한 화면에서 처리한다.
//
// 라인을 품번이 아니라 발주 순번(Purchase_num)으로 지목한다.
// 대체 입고를 하면 품번이 바뀌므로 품번으로는 어느 라인인지 알 수 없다.

const SUBMAP = {};
SUBS.forEach(function(s){ SUBMAP[s.P_ID] = s; });

function setMode(m){
  mode = m;
  const rows = (m === 'pending') ? PENDING : PO;
  sel = rows.length ? rows[0].H_ID : null;
  L = {}; settle = ''; settleNote = '';
  drawList();
  if(sel){ pick(sel); return; }
  document.getElementById('right').innerHTML =
    '<div class="empty"><i class="ti ti-inbox" style="font-size:22px;display:block;margin-bottom:8px"></i>'
    + (m === 'pending'
        ? '미입고 발주가 없습니다.<br>구매 발주 화면에서 발주를 등록하면 여기에 나타납니다.'
        : '입고된 발주가 없습니다.') + '</div>';
}

function pick(hid){
  sel = hid; L = {}; settle = ''; settleNote = '';
  drawList();
  if(mode === 'pending') pickPending(hid); else pickDone(hid);
}

// 라인 상태 — 발주 순번마다 {pid, qty, reason}
function lineOf(it){
  if(!L[it.Purchase_num]) L[it.Purchase_num] = {pid: it.P_ID, qty: it.ord_qty, reason: ''};
  return L[it.Purchase_num];
}
function setQ(num, v){ const n = parseInt(v,10); L[num].qty = isNaN(n) ? 0 : Math.max(0,n); pickPending(sel); }
function setPid(num, v){
  v = (v||'').trim().toUpperCase();
  L[num].pid = SUBMAP[v] ? v : L[num].pid;
  pickPending(sel);
}
function setReason(num, v){ L[num].reason = v; syncIn(); }
function setSettle(v){ settle = v; syncIn(); }
function setNote(v){ settleNote = v; }
function setWho(v){ who = v; syncIn(); }

function autoSettle(diff){ return diff > 0 ? '추가청구' : (diff < 0 ? '차감' : '정산없음'); }

function pickPending(hid){
  const o = PENDING.filter(function(x){return x.H_ID===hid;})[0];
  if(!o) return;
  o.items.forEach(lineOf);

  const act = o.items.filter(function(it){ return L[it.Purchase_num].qty > 0; });
  let ordAmt = 0, inAmt = 0, nOk = 0, nSh = 0, nOv = 0, nSw = 0, totQty = 0;
  act.forEach(function(it){
    const st = L[it.Purchase_num], p = SUBMAP[st.pid] || {};
    ordAmt += Math.round(it.ord_qty * (it.price||0));
    inAmt  += Math.round(st.qty * (p.P_Price||0));
    totQty += st.qty;
    if(st.pid !== it.P_ID) nSw++;
    if(st.qty === it.ord_qty) nOk++; else if(st.qty < it.ord_qty) nSh++; else nOv++;
  });
  const diff = inAmt - ordAmt;
  const eff  = settle || autoSettle(diff);
  const rest = o.items.length - act.length;

  document.getElementById('right').innerHTML =
    '<div class="alert a-ac"><i class="ti ti-info-circle"></i> '
  +   '<b>' + o.H_ID + '</b> · ' + esc(o.supplier||'-') + ' · 발주 ' + o.P_Date
  +   ' · 예상 입고 ' + o.eta + ' · ' + o.items.length + '품목 ' + nf(o.qty) + '개</div>'

  + '<div class="kpi-row">'
  +   '<div class="card"><div class="c-l"><i class="ti ti-package"></i>입고 품목</div>'
  +     '<div class="c-v">' + act.length + '<small>/' + o.items.length + '</small></div>'
  +     '<div class="c-s">' + (rest ? rest + '품목 미입고로 남김' : '전 품목 입고') + '</div></div>'
  +   '<div class="card"><div class="c-l"><i class="ti ti-stack-2"></i>입고 수량</div>'
  +     '<div class="c-v">' + nf(totQty) + '<small>개</small></div>'
  +     '<div class="c-s">' + won(inAmt) + '원</div></div>'
  +   '<div class="card"><div class="c-l"><i class="ti ti-check"></i>발주대로</div>'
  +     '<div class="c-v ok">' + nOk + '<small>/' + act.length + '</small></div>'
  +     '<div class="c-s">' + (nSh?'부족 '+nSh+' ':'') + (nOv?'초과 '+nOv:'') + (nSh||nOv?'':'수량 전부 일치') + '</div></div>'
  +   '<div class="card"><div class="c-l"><i class="ti ti-arrows-exchange"></i>대체 입고</div>'
  +     '<div class="c-v ' + (nSw?'wn':'') + '">' + nSw + '<small>종</small></div>'
  +     '<div class="c-s">' + (nSw ? '협의 내용 필수' : '없음') + '</div></div>'
  + '</div>'

  + '<div class="actbar"><label>담당자</label>'
  +   '<select class="wsel" onchange="setWho(this.value)">'
  +     WORKERS.map(function(w){
          return '<option value="' + w.EP_ID + '"' + (who===w.EP_ID?' selected':'') + '>'
            + esc(w.Name) + ' ' + esc(w.Position||'') + '</option>'; }).join('')
  +   '</select>'
  +   '<span style="font-size:10px;color:var(--txt3)">창고는 입고 품목의 대분류로 자동 배정됩니다</span>'
  +   '<button class="btn btnp" id="go" onclick="openInConfirm()">'
  +     '<i class="ti ti-arrow-bar-to-down"></i>입고 등록</button>'
  + '</div>'

  + '<div class="sec"><div class="sech"><i class="ti ti-git-compare"></i>'
  +   '<span class="sech-t">품목별 입고 내역</span>'
  +   '<span class="sech-m">수량 0 = 이번에 안 받음 · 품번을 바꾸면 대체 입고</span></div>'
  +   '<table><thead><tr><th style="width:26px">#</th><th>발주 품목</th><th class="num">발주</th>'
  +     '<th>실제 입고 품번</th><th class="num">실입고</th><th class="num">차이</th>'
  +     '<th>판정</th><th>창고</th></tr></thead><tbody>'
  +   o.items.map(function(it){
        const st = L[it.Purchase_num];
        const p  = SUBMAP[st.pid] || {};
        const sw = st.pid !== it.P_ID;
        const gap = st.qty - it.ord_qty;
        const j = st.qty > 0
          ? (gap === 0 ? {t:'일치',c:'bok'} : (gap < 0 ? {t:'부족',c:'bdn'} : {t:'초과',c:'bwn'}))
          : {t:'미입고', c:'bmu'};
        const pkgNote = (gap < 0 && it.pkg && (-gap) % it.pkg === 0)
          ? '<div class="sub">포장 ' + it.pkg + '×' + (-gap/it.pkg) + '</div>' : '';
        let row = '<tr class="' + (sw?'swap':'') + '">'
          + '<td>' + it.Purchase_num + '</td>'
          + '<td><span class="pid">' + it.P_ID + '</span><div class="sub">' + esc((it.P_N||'').slice(0,14)) + '</div></td>'
          + '<td class="num">' + nf(it.ord_qty) + '<div class="sub">' + nf(it.price) + '원</div></td>'
          + '<td><input class="sin" list="sublist" value="' + st.pid + '" data-num="' + it.Purchase_num
          +   '" onchange="setPid(this.dataset.num, this.value)">'
          +   '<div class="sub">' + esc((p.P_N||'').slice(0,14)) + ' · ' + nf(p.P_Price) + '원</div></td>'
          + '<td class="num"><input class="qin" type="number" min="0" value="' + st.qty
          +   '" data-num="' + it.Purchase_num + '" onchange="setQ(this.dataset.num, this.value)"></td>'
          + '<td class="num">' + (st.qty > 0 && gap ? nf(gap) + pkgNote : (st.qty > 0 ? '0' : '-')) + '</td>'
          + '<td><span class="bg ' + j.c + '">' + j.t + '</span>'
          +   (sw ? '<div><span class="bg bwn">대체</span></div>' : '') + '</td>'
          + '<td>' + esc(p.loc_name||'-') + '</td></tr>';
        if(sw && st.qty > 0){
          row += '<tr class="swap"><td></td><td colspan="7">'
            + '<div class="rrow"><i class="ti ti-message-2" style="color:var(--wn)"></i>'
            + '<span class="rlab">' + it.P_ID + ' → ' + st.pid + ' 협의 내용</span>'
            + '<input class="rin" placeholder="예: 발주품 결품으로 호환품 대체, 차액은 결제에서 차감 (거래처 협의 완료)" '
            + 'value="' + esc(st.reason) + '" data-num="' + it.Purchase_num
            + '" oninput="setReason(this.dataset.num, this.value)"></div></td></tr>';
        }
        return row;
      }).join('')
  +   '</tbody></table></div>'

  + '<div class="sec"><div class="sech"><i class="ti ti-receipt-2"></i>'
  +   '<span class="sech-t">잔금 처리</span>'
  +   '<span class="sech-m">발주 금액과 실제 입고 금액의 차액</span></div>'
  +   '<div class="setl">'
  +     '<div class="samt"><span>발주 금액</span><b>' + nf(ordAmt) + '원</b></div>'
  +     '<div class="samt"><span>입고 금액</span><b>' + nf(inAmt) + '원</b></div>'
  +     '<div class="samt diff"><span>차액</span><b class="' + (diff>0?'up':(diff<0?'dn':'')) + '">'
  +       (diff>0?'+':'') + nf(diff) + '원</b></div>'
  +   '</div>'
  +   '<div class="srow"><label>처리 방식</label>'
  +     ['추가청구','차감','정산없음'].map(function(k){
          return '<button class="btn schip ' + (eff===k?'on':'') + '" data-k="' + k
            + '" onclick="setSettle(this.dataset.k)">' + k + '</button>';
        }).join('')
  +     '<span class="sub" style="margin-left:6px">' + (settle ? '직접 선택' : '차액 부호로 자동 선택됨') + '</span>'
  +   '</div>'
  +   '<div class="srow"><label>메모</label>'
  +     '<input class="rin" placeholder="정산 관련 메모 (선택)" value="' + esc(settleNote)
  +     '" oninput="setNote(this.value)"></div>'
  +   '<div class="note">차액이 0이 아니면 <b>추가청구</b>(더 받았으니 더 냄) 또는 <b>차감</b>(덜 받았으니 결제에서 뺌)을 고릅니다. '
  +     '거래처와 협의해 차액을 청구하지 않기로 했으면 <b>정산없음</b>을 고르세요. '
  +     '변경 내역은 발주 변경 이력에 남습니다.</div>'
  + '</div>'

  + '<datalist id="sublist">'
  +   SUBS.map(function(s){
        return '<option value="' + s.P_ID + '">' + esc(s.P_N) + ' · ' + esc(s.Spec||'')
          + ' · ' + esc(s.supplier||'') + '</option>'; }).join('')
  + '</datalist>';

  syncIn();
}

function syncIn(){
  const go = document.getElementById('go');
  if(!go) return;
  const o = PENDING.filter(function(x){return x.H_ID===sel;})[0];
  if(!o){ go.disabled = true; return; }
  const act = o.items.filter(function(it){ return L[it.Purchase_num].qty > 0; });
  // 대체 입고는 협의 내용이 있어야 한다 — 서버도 같은 조건으로 막는다
  const missing = act.some(function(it){
    const st = L[it.Purchase_num];
    return st.pid !== it.P_ID && !(st.reason||'').trim();
  });
  go.disabled = busy || !who || !act.length || missing;
  go.title = missing ? '대체 입고는 협의 내용을 적어야 합니다' : '';
}

function ovlClose(){ const o = document.getElementById('ovl'); if(o) o.remove(); }

function ovl(title, icon, body, foot){
  ovlClose();
  const d = document.createElement('div');
  d.id = 'ovl'; d.className = 'ovl';
  d.innerHTML = '<div class="mdl"><div class="mdh"><i class="ti ' + icon + '"></i>' + title + '</div>'
    + '<div class="mdb">' + body + '</div><div class="mdf">' + foot + '</div></div>';
  document.body.appendChild(d);
}

function inBody(p, note){
  const hasLot = !!(p.items[0] && p.items[0].Lot_ID);
  return (note || '')
  + '<dl class="dl">'
  +   '<dt>발주</dt><dd><span class="hid">' + p.H_ID + '</span> · ' + esc(p.supplier||'-') + '</dd>'
  +   '<dt>입고일</dt><dd>' + p.date + ' <span class="sub">(발주 ' + p.P_Date
  +     ' → 리드타임 ' + p.lead_days + '일)</span></dd>'
  +   '<dt>담당자</dt><dd>' + esc(p.worker.Name) + ' ' + esc(p.worker.Position||'') + '</dd>'
  +   '<dt>입고</dt><dd>' + p.line_cnt + '품목 · ' + nf(p.qty) + '개'
  +     (p.swap_cnt ? ' · <b style="color:var(--wn)">대체 ' + p.swap_cnt + '건</b>' : '') + '</dd>'
  +   '<dt>잔금</dt><dd>발주 ' + nf(p.ord_amount) + '원 → 입고 ' + nf(p.amount) + '원 · '
  +     '차액 <b class="' + (p.diff_amt>0?'up':(p.diff_amt<0?'dn':'')) + '">'
  +     (p.diff_amt>0?'+':'') + nf(p.diff_amt) + '원</b> → <b>' + p.settle + '</b></dd>'
  + '</dl>'
  + (p.rest_cnt ? '<div class="alert a-wn"><i class="ti ti-alert-triangle"></i> '
      + p.rest_cnt + '개 품목은 이번에 받지 않아 미입고로 남습니다.</div>' : '')
  + '<div class="sec"><div class="sech"><i class="ti ti-box"></i>'
  +   '<span class="sech-t">' + (hasLot ? '생성된 LOT' : '생성될 LOT') + '</span>'
  +   '<span class="sech-m">' + p.line_cnt + '건</span></div>'
  +   '<table><thead><tr><th>발주 품목</th><th>입고 품목</th><th class="num">발주</th>'
  +     '<th class="num">입고</th><th>판정</th><th>창고</th>'
  +     (hasLot ? '<th>LOT</th>' : '') + '</tr></thead><tbody>'
  +   p.items.map(function(it){
        const c = it.judge === '일치' ? 'bok' : (it.judge === '부족' ? 'bdn' : 'bwn');
        return '<tr class="' + (it.swapped?'swap':'') + '">'
        + '<td><span class="pid">' + it.ord_P_ID + '</span></td>'
        + '<td>' + (it.swapped
            ? '<span class="pid">' + it.P_ID + '</span> <span class="bg bwn">대체</span>'
            : '<span class="sub">동일</span>') + '</td>'
        + '<td class="num">' + nf(it.ord_qty) + '</td>'
        + '<td class="num"><b style="color:var(--acc)">' + nf(it.in_qty) + '</b></td>'
        + '<td><span class="bg ' + c + '">' + it.judge + '</span></td>'
        + '<td>' + esc(it.loc_name||'-') + '</td>'
        + (hasLot ? '<td><span class="lotid">' + it.Lot_ID + '</span></td>' : '') + '</tr>'
        + (it.reason ? '<tr class="swap"><td colspan="' + (hasLot?7:6) + '">'
            + '<span class="sub">협의: ' + esc(it.reason) + '</span></td></tr>' : '');
      }).join('')
  +   '</tbody></table></div>';
}

function errBody(e){
  return '<div class="alert a-dn"><i class="ti ti-alert-circle"></i> ' + e.map(esc).join('<br>') + '</div>';
}
const CLOSE_BTN = '<button class="btn" onclick="ovlClose()">닫기</button>';

function payload(){
  const o = PENDING.filter(function(x){return x.H_ID===sel;})[0];
  const lines = [];
  o.items.forEach(function(it){
    const st = L[it.Purchase_num];
    if(st.qty > 0) lines.push({Purchase_num: it.Purchase_num, P_ID: st.pid,
                               qty: st.qty, reason: st.reason});
  });
  return {H_ID: sel, lines: lines, EP_ID: who,
          settle: settle, settle_note: settleNote};
}

async function openInConfirm(){
  if(busy) return;
  busy = true; syncIn();
  ovl('입고 등록', 'ti-loader', '<div class="note">확인 중입니다...</div>', '');
  try{
    const r = await fetch('/api/inbound/preview', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload())});
    const d = await r.json();
    if(d.ok && d.plan){
      ovl('입고 등록 확인', 'ti-arrow-bar-to-down', inBody(d.plan),
          '<button class="btn" onclick="ovlClose()">취소</button>'
        + '<button class="btn btnp" style="margin-left:0" onclick="doInSubmit()">확정 등록</button>');
    }else{
      ovl('등록할 수 없습니다', 'ti-alert-circle', errBody(d.errors || ['알 수 없는 오류입니다.']), CLOSE_BTN);
    }
  }catch(e){
    ovl('통신 실패', 'ti-alert-circle', errBody(['서버와 통신하지 못했습니다: ' + e.message]), CLOSE_BTN);
  }
  busy = false; syncIn();
}

async function doInSubmit(){
  if(busy) return;
  busy = true;
  ovl('입고 등록', 'ti-loader', '<div class="note">등록 중입니다...</div>', '');
  try{
    const r = await fetch('/api/inbound', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload())});
    const d = await r.json();
    if(d.ok && d.plan){
      ovl('입고 등록 완료', 'ti-circle-check',
          inBody(d.plan, '<div class="alert a-ok"><i class="ti ti-check"></i> LOT '
            + d.plan.line_cnt + '건을 생성했습니다. ' + nf(d.plan.qty) + '개가 창고에 입고되어 '
            + '이제 불출할 수 있습니다.'
            + (d.plan.chg_cnt ? ' 변경 ' + d.plan.chg_cnt + '건은 발주 변경 이력에 남았습니다.' : '')
            + '</div>'),
          '<button class="btn btnp" style="margin-left:0" onclick="location.reload()">확인</button>');
    }else{
      ovl('등록 실패', 'ti-alert-circle', errBody(d.errors || ['입고 등록에 실패했습니다.']), CLOSE_BTN);
    }
  }catch(e){
    ovl('통신 실패', 'ti-alert-circle', errBody(['서버와 통신하지 못했습니다: ' + e.message]), CLOSE_BTN);
  }
  busy = false; syncIn();
}

// 받을 발주가 있으면 등록 탭부터, 없으면 대조 탭부터 연다
setMode(PENDING.length ? 'pending' : 'done');
</script>
</body>
</html>
