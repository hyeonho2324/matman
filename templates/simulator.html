{% extends "base.html" %}
{% block content %}
<div class="page-header">
  <div>
    <div class="page-title"><i class="ti ti-adjustments" style="margin-right:6px;color:var(--fill-accent)"></i>가상 발주 시뮬레이터</div>
    <div class="page-subtitle">실시간 재고 시뮬레이션</div>
  </div>
  <div class="page-actions">
      <a href="/forecast" class="btn"><i class="ti ti-chart-line"></i>수요 예측</a>
      <a href="/purchase" class="btn"><i class="ti ti-truck-delivery"></i>발주 등록</a>
  </div>
</div>

<!-- 이 화면의 인터랙티브 UI는 iframe으로 통합됩니다 -->
<div style="flex:1;display:flex;flex-direction:column;gap:14px">
  <div style="flex:1;border-radius:12px;overflow:hidden;border:0.5px solid var(--border);min-height:580px">
    <iframe
      src="/embed/simulator"
      style="width:100%;height:100%;min-height:580px;border:none;display:block"
      title="가상 발주 시뮬레이터">
    </iframe>
  </div>
</div>
{% endblock %}
