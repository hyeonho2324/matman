{% extends "base.html" %}
{% block content %}
<div class="page-header">
  <div>
    <div class="page-title"><i class="ti ti-box" style="margin-right:6px;color:var(--fill-accent)"></i>LOT 상세</div>
    <div class="page-subtitle">LOT 636개 · 체류일수와 FIFO 준수 검증</div>
  </div>
  <div class="page-actions">
      <a href="/products" class="btn"><i class="ti ti-package"></i>자재 목록</a>
      <a href="/tx-history" class="btn"><i class="ti ti-history"></i>트랜잭션 이력</a>
      <a href="/picking" class="btn"><i class="ti ti-list-check"></i>피킹리스트</a>
  </div>
</div>

<!-- 이 화면의 인터랙티브 UI는 iframe으로 통합됩니다 -->
<div style="flex:1;display:flex;flex-direction:column;gap:14px">
  <div style="flex:1;border-radius:12px;overflow:hidden;border:0.5px solid var(--border);min-height:580px">
    <iframe
      src="/embed/lot"
      style="width:100%;height:100%;min-height:580px;border:none;display:block"
      title="LOT 상세">
    </iframe>
  </div>
</div>
{% endblock %}
