{% extends "base.html" %}
{% block content %}
<div class="page-header">
  <div>
    <div class="page-title"><i class="ti ti-arrow-bar-to-down" style="margin-right:6px;color:var(--fill-accent)"></i>입고 처리</div>
    <div class="page-subtitle">LOT 생성 및 검수</div>
  </div>
  <div class="page-actions">
      <a href="/lot" class="btn"><i class="ti ti-box"></i>LOT 목록</a>
      <a href="/purchase" class="btn"><i class="ti ti-truck-delivery"></i>발주 조회</a>
      <a href="/scanner" class="btn"><i class="ti ti-scan"></i>스캐너</a>
  </div>
</div>

<!-- 이 화면의 인터랙티브 UI는 iframe으로 통합됩니다 -->
<div style="flex:1;display:flex;flex-direction:column;gap:14px">
  <div style="flex:1;border-radius:12px;overflow:hidden;border:0.5px solid var(--border);min-height:580px">
    <iframe
      src="/embed/inbound"
      style="width:100%;height:100%;min-height:580px;border:none;display:block"
      title="입고 처리">
    </iframe>
  </div>
</div>
{% endblock %}
